pack_id: tiktok-shop-us-beauty-overlay-2026-10-27
platform_family: tiktok_shop
site: US
program: null
match:
  category: [beauty, skincare, beauty_personal_care, cosmetics]
status: VERIFIED_CATEGORY_OVERLAY
capabilities: [LISTING, CREATOR_AFFILIATE, COMPLIANCE]
business_capabilities:
  category_overlay: true
  beauty_requirements_included: true
surfaces: [PDP, CREATOR]
rule_atoms:
  - rule_id: TTS-US-BEAUTY-QUALIFICATION
    scope: {site: US, category: [beauty, skincare, beauty_personal_care, cosmetics], surface: PDP, locale: ['*']}
    statement: Beauty and personal care products may require documentation through the Qualification Center, with requirements depending on seller role and product type.
    source_url: https://seller-us.tiktok.com/university/essay?knowledge_id=1789325403522858
    verified_at: '2026-10-27'
    expires_at: '2027-01-27'
    authority: OFFICIAL
    payload: {rule_kind: category_qualification, constraints: {documentation_may_be_required: true}}
  - rule_id: TTS-US-BEAUTY-SHELF-LIFE
    scope: {site: US, category: [beauty, skincare, beauty_personal_care, cosmetics], surface: PDP, locale: ['*']}
    statement: Beauty and personal care products should have at least 365 days of remaining shelf life upon delivery; when less than 365 days remain, sellers must clearly disclose this before purchase and in the listing. Products more than three years old must not be sold.
    source_url: https://seller-us.tiktok.com/university/essay?knowledge_id=1789325403522858
    verified_at: '2026-10-27'
    expires_at: '2027-01-27'
    authority: OFFICIAL
    payload:
      listing_field: shelf_life
      constraints: {recommended_remaining_days_at_delivery: 365, disclose_when_below_days: 365, max_product_age_years: 3}
  - rule_id: TTS-US-BEAUTY-NO-OVERALL-SKIN-WHITENING
    scope: {site: US, category: [beauty, skincare, beauty_personal_care, cosmetics], surface: [PDP, CREATOR], locale: ['*']}
    statement: Products marketed, labeled or depicted as bleaching, whitening or lightening natural skin color, reducing overall melanin, or altering natural pigmentation are prohibited; appearance-brightening or localized dark-spot language may be allowed when otherwise compliant.
    source_url: https://seller-us.tiktok.com/university/essay?knowledge_id=1399532709988097
    verified_at: '2026-10-27'
    expires_at: '2027-01-27'
    authority: OFFICIAL
    payload:
      rule_kind: beauty_claim_boundary
      constraints: {overall_skin_whitening: false, melanin_reduction_claim: false, localized_appearance_brightening_may_be_allowed: true}
  - rule_id: TTS-US-BEAUTY-CREATOR-AUTHENTICITY
    scope: {site: US, category: [beauty, skincare, beauty_personal_care, cosmetics], surface: CREATOR, locale: ['*']}
    statement: Beauty and skincare creator content should keep claims aligned with the product listing and avoid beauty filters that exaggerate product effects.
    source_url: https://seller-us.tiktok.com/university/essay?knowledge_id=6349304365467438
    verified_at: '2026-10-27'
    expires_at: '2027-01-27'
    authority: OFFICIAL
    payload:
      rule_kind: creator_content_authenticity
      constraints: {claims_match_listing: true, effect_exaggerating_beauty_filters: false}
