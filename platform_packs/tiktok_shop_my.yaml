  url: https://seller-my.tiktok.com/university/essay?knowledge_id=4138822087902977&lang=en
  verified_at: '2026-10-27'
- source_id: TTS-MY-OFFICIAL-ETT-REG-2026-10
  kind: OFFICIAL_PLATFORM_POLICY
  title: Consumer Protection (Electronic Trade Transactions) Regulations - Malaysia
  url: https://seller-my.tiktok.com/university/essay?knowledge_id=755956737378065&lang=en
  verified_at: '2026-10-27'
notes:
- The 2027-01-27 expires_at values are an internal 90-day re-verification horizon,
  not a TikTok policy expiry date.
- This pack does not assert beauty-category claim rules, cross-border fees, logistics,
  creator commission, advertising eligibility, or regulatory approval.
- Malaysia title/description Bahasa Melayu requirement is captured from TikTok Shop
  Malaysia guidance summarizing the Consumer Protection (Electronic Trade Transactions)
  Regulations 2024; legal applicability beyond the platform context should still be
  reviewed when material.
