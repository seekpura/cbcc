name: phase4-visual-master-binding-red
on:
  push:
    branches: [main]
    paths:
      - 'tests/test_v0676_phase4_visual_master_runtime_binding.py'
      - '.github/workflows/phase4-visual-master-binding-red.yml'
  workflow_dispatch:

jobs:
  red:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q pytest pyyaml openpyxl
      - name: Run Phase 4 Visual Master compiler-binding RED
        run: pytest -q tests/test_v0676_phase4_visual_master_runtime_binding.py
