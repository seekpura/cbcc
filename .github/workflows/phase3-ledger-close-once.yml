name: one-shot-phase3-ledger-close

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-ledger-close-once.yml'

permissions:
  contents: write

jobs:
  close-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch CURRENT ledger without rewriting Phase 0-2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from copy import deepcopy
          import json

          path=Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json')
          map_path=Path('references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE3_OPPORTUNITY_FAMILY_EVALUATION.json')
          text=path.read_text(encoding='utf-8')
          before=json.loads(text)
          old_p0=deepcopy(before['phase_evidence']['0'])
          old_p1=deepcopy(before['phase_evidence']['1'])
          old_p2=deepcopy(before['phase_evidence']['2'])
          consumer=json.loads(map_path.read_text(encoding='utf-8'))

          replacements={
            'REQ-063':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PASS_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED'),
            'REQ-064':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE4_EXECUTION_PENDING'),
            'REQ-065':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE4_EXECUTION_PENDING'),
            'REQ-066':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE4_EXECUTION_PENDING'),
            'REQ-067':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE4_EXECUTION_PENDING'),
            'REQ-068':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE4_EXECUTION_PENDING'),
            'REQ-069':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE4_EXECUTION_PENDING'),
            'REQ-070':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE6_PHASE7_EXECUTION_PENDING'),
            'REQ-071':('PARTIAL_PHASE2_ADS_OPTIMIZATION_BUSINESS_AUTHORITY_VERIFIED','PARTIAL_PHASE2_ADS_AND_PHASE3_OPPORTUNITY_FAMILY_VERIFIED_PHASE4_EXECUTION_PENDING'),
            'REQ-072':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE4_EXECUTION_PENDING'),
            'REQ-073':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE4_PHASE5_EXECUTION_PENDING'),
            'REQ-074':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE4_PHASE5_EXECUTION_PENDING'),
            'REQ-075':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE4_PHASE5_EXECUTION_PENDING'),
            'REQ-076':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE4_PHASE6_EXECUTION_PENDING'),
            'REQ-077':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED_PHASE6_EXECUTION_PENDING'),
            'REQ-078':('PARTIAL_PHASE2_ADS_AND_MEASUREMENT_TEST_CONTRACTS_VERIFIED','PASS_PHASE2_PHASE3_TEST_ROTATION_AB_MULTIVARIATE_VERIFIED'),
            'REQ-079':('LOCKED_NOT_YET_FULLY_IMPLEMENTED','PARTIAL_PHASE3_OPPORTUNITY_FAMILY_AND_ACTIVATION_BOUNDARY_VERIFIED_PHASE4_SURFACE_SPECIALIZATION_PENDING'),
          }
          for req,(old_status,new_status) in replacements.items():
              old=f'{{"req":"{req}"'
              start=text.find(old)
              assert start>=0, req
              end=text.find('\n',start)
              line=text[start:end if end>=0 else len(text)]
              needle=f'"status":"{old_status}"'
              assert needle in line, (req,line)
              updated=line.replace(needle,f'"status":"{new_status}"',1)
              text=text[:start]+updated+text[start+len(line):]

          phase_old='    "3":"NOT_STARTED",'
          phase_new='    "3":"PASS_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED",'
          assert text.count(phase_old)==1
          text=text.replace(phase_old,phase_new,1)

          phase3={
            'status':'PASS_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED',
            'requirements':consumer['requirements'],
            'verified_subtasks':['23-family pre-asset Opportunity-Family Evaluation, deliberate omission accounting, no-quota semantics, post-asset fulfillment, asset_universe_matrix materialization and Human Asset-Universe projection'],
            'focused_tests':'13/13 passed: 7 core opportunity-family behaviors + 6 runtime/compiler/Human/legacy-compatibility bindings',
            'cross_scope_tests':'48/48 fresh GitHub runner PASS after setting historical package import path PYTHONPATH=runtime. Batch covered Phase 3 authority/runtime, legacy open-world/no-quota/activation/workspace behavior and complete Phase 2 Measurement suites. The preceding attempt produced 45 pass / 3 environment-only ModuleNotFoundError: cbcc failures in legacy v0.6.33 tests and caused no production-code change.',
            'red_evidence':consumer['verification']['red'],
            'proof_objects':consumer['proof_objects'],
            'verified_behaviors':consumer['verified_behavior'],
            'produced_object_inspection':consumer['verification']['produced_object_inspection'],
            'legacy_12_axis_status':'PRESERVED_UNCHANGED',
            'scope_diff':consumer['verification']['scope_diff'],
            'deferred_boundaries':consumer['deferred_boundaries'],
            'remaining_phase3':'NONE — the locked Phase 3 Opportunity-Family Evaluation acceptance contract is verified; Phase 4 Visual/Art Direction remains separate and NOT_STARTED.',
            'phase4_status':'NOT_STARTED',
            'human_json_md_html_parity':'PENDING_PHASE6',
            'real_k01_full':'PENDING_PHASE10',
            'built_plugin_readback':'PENDING_PHASE11',
            'provider_actual_output':'E2E_PENDING',
            'source_truth':'GITHUB_MAIN_PERSISTED',
            'source_commits':consumer['source_commits']+['0b7681aff2f72f3544f233624a9c3325a5ac1762'],
            'verification_workflow':{'run_id':41337145114,'status':'SUCCESS','verified_tree_note':'Successful verification ran after production commit 4c4f00728eab29f153afa7ba4b39e6c929d537c2; subsequent commits through 2b1e4ab7dfdf63fef5bc634d8700d4799fb652f2 only removed temporary workflows. GitHub compare confirms no production-code mutation after the verified bind.'}
          }
          assert '"3"' not in before['phase_evidence']
          idx=text.rfind('\n  }\n}')
          assert idx>0
          block=json.dumps(phase3,ensure_ascii=False,indent=2)
          block='    "3": '+block.replace('\n','\n    ')
          text=text[:idx]+',\n'+block+text[idx:]

          final=json.loads(text)
          assert final['phase_evidence']['0']==old_p0
          assert final['phase_evidence']['1']==old_p1
          assert final['phase_evidence']['2']==old_p2
          assert final['phase_status']['2']=='PASS_PHASE2_FULL_BUSINESS_OBJECT_DENSITY_VERIFIED'
          assert final['phase_status']['3']=='PASS_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED'
          assert final['phase_status']['4']=='NOT_STARTED'
          assert final['phase_evidence']['3']['remaining_phase3'].startswith('NONE')
          assert final['phase_evidence']['3']['phase4_status']=='NOT_STARTED'
          assert final['phase_evidence']['3']['real_k01_full']=='PENDING_PHASE10'
          assert final['phase_evidence']['3']['built_plugin_readback']=='PENDING_PHASE11'
          assert final['phase_evidence']['3']['provider_actual_output']=='E2E_PENDING'
          req_status={x['req']:x['status'] for x in final['new_requirements']}
          assert req_status['REQ-063']=='PASS_PHASE3_OPPORTUNITY_FAMILY_EVALUATION_VERIFIED'
          assert req_status['REQ-078']=='PASS_PHASE2_PHASE3_TEST_ROTATION_AB_MULTIVARIATE_VERIFIED'
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit verified Phase 3 ledger closure
        shell: bash
        run: |
          git config user.name 'cbcc-phase3-closure'
          git config user.email 'actions@users.noreply.github.com'
          git add references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json
          git diff --cached --quiet && exit 1
          git commit -m 'docs: close verified Phase 3 opportunity-family evaluation'
          git push origin HEAD:main
