name: phase4-scene-derived-photography-red

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q pytest pyyaml openpyxl
      - name: Run Phase 4 scene-derived photography RED
        run: pytest -q tests/test_v0676_phase4_scene_derived_photography_authority.py
