name: phase4-k01-regression-red

on:
  push:
    branches: [phase4-k01-regression]
    paths:
      - 'tests/test_v0676_phase4_nonphoto_camera_view_regression.py'
      - '.github/workflows/phase4-k01-regression-red.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  red:
    runs-on: ubuntu-latest
    env: {PYTHONPATH: runtime}
    steps:
      - uses: actions/checkout@v4
        with: {ref: phase4-k01-regression}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q pytest pyyaml
      - name: Reproduce generic camera/view over-activation
        run: |
          pytest -q \
            tests/test_v0676_phase4_nonphoto_camera_view_regression.py \
            tests/test_v0672_fresh_k01_portfolio_delta.py
