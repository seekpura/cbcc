name: v0.6.42 Regression Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/cbcc/**'
      - 'references/**'
      - 'prompts/**'
      - 'tests/test_v0642_regression_recovery.py'
      - 'tests/test_v0639_project_authored_html.py'
      - 'scripts/build_plugin_dist_v0642.py'
      - 'scripts/check_v0642_regression_recovery.py'
      - 'VERSION'
  workflow_dispatch:

jobs:
  regression-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed runtime
        run: python -m compileall -q runtime/cbcc
      - name: Run focused v0.6.42 regressions
        env:
          PYTHONPATH: runtime
        run: python -m pytest -q tests/test_v0642_regression_recovery.py tests/test_v0639_project_authored_html.py
      - name: Keep v0.6.37 prompt-density guard
        run: python scripts/check_commercial_prompt_density.py
      - name: Build v0.6.42 installable package
        run: python -m scripts.build_plugin_dist_v0642 --output-dir dist_v0642
      - name: Check packaged Host/Canonical authority and final delivery path
        run: python scripts/check_v0642_regression_recovery.py dist_v0642/plugin/cross-border-commerce-creative
