name: phase4-scene-photography-postcommit-verify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q pytest pyyaml openpyxl
      - name: Cross-scope verification from committed main
        run: |
          pytest -q \
            tests/test_v0676_phase4_scene_derived_photography_authority.py \
            tests/test_v0676_phase4_visual_route_art_direction.py \
            tests/test_v0676_phase4_visual_master_authority.py \
            tests/test_v0676_phase4_visual_master_runtime_binding.py \
            tests/test_v0632_portfolio_visual_authority.py \
            tests/test_v0630_agent_art_direction_authority.py \
            tests/test_v0676_phase3_opportunity_family_evaluation.py \
            tests/test_v0676_phase3_opportunity_family_runtime_binding.py \
            tests/test_v0662_asset_universe_and_package_regressions.py \
            tests/test_v0655_asset_universe_open_world.py \
            tests/test_v0646_asset_family_no_quota.py \
            tests/test_v0646_activation_state_taxonomy.py
      - name: Produced-object inspection
        run: |
          python - <<'PY'
          from copy import deepcopy
          from cbcc.portfolio_visual_authority import validate_portfolio_differentiation
          from cbcc import prompt_compiler
          from tests.test_v0676_phase4_scene_derived_photography_authority import (
              _asset, _preset, _direction,
          )

          camera, lighting, cmf = _preset()

          unrelated = {
              'assets': [
                  _asset(
                      'AST-A', scene='bright morning bathroom vanity routine',
                      carrier='LIFESTYLE_PHOTOGRAPHY',
                      composition='environment-led vanity identity frame with product foreground',
                      camera=camera, lighting=lighting, cmf=cmf,
                      delta='environment-led identity scene',
                  ),
                  _asset(
                      'AST-B', scene='dark controlled studio macro of liquid texture and bottle material',
                      carrier='MATERIAL_MACRO_PHOTOGRAPHY',
                      composition='tight macro material study with liquid texture as evidence plane',
                      camera=camera, lighting=lighting, cmf=cmf,
                      delta='switch from human-scale environment to material macro evidence',
                  ),
              ]
          }
          duplicate = validate_portfolio_differentiation(unrelated, _direction())
          assert duplicate['status'] == 'RETURN_TO_AGENT'
          dup_issue = next(x for x in duplicate['issues'] if x['type']=='DUPLICATE_PHOTOGRAPHY_EXECUTION_SIGNATURE')
          assert dup_issue['asset_ids'] == ['AST-A','AST-B']

          missing_arch = {
              'assets': [
                  _asset(
                      'AST-MISSING', scene='real morning routine at bathroom vanity',
                      carrier='LIFESTYLE_PHOTOGRAPHY',
                      composition='hand-to-product routine relationship',
                      camera=None, lighting=None, cmf=None,
                      delta='embodied routine scene',
                  )
              ]
          }
          single_direction = deepcopy(_direction())
          single_direction['portfolio_differentiation_review']['adjacent_asset_review'] = [
              {'asset_id':'AST-MISSING','delta':'single photographic route fixture'}
          ]
          missing = validate_portfolio_differentiation(missing_arch, single_direction)
          assert missing['status'] == 'RETURN_TO_AGENT'
          missing_issue = next(x for x in missing['issues'] if x['type']=='MISSING_SCENE_DERIVED_PHOTOGRAPHY_EXECUTION')
          assert set(missing_issue['missing']) == {'camera','lighting','cmf'}

          camera_b = {
              'focal_length_mm':100,'preferred_view':'top-down macro detail view',
              'working_distance':'0.45m','camera_height':'macro working distance',
              'shot_size':'macro detail','focus_plane':'liquid meniscus and label edge',
              'aperture':'f/11','shutter':'1/160s','iso':125,
          }
          lighting_b = {
              'key':{'direction':'rear-side grazing','modifier':'strip diffusion'},
              'negative_fill':'camera-right black flag','cct':5000,'white_balance':'5000K locked',
              'exposure_ratio_plan':'3:1 with controlled edge separation',
              'highlight_policy':'trace glass edge without clipping liquid highlight',
              'reflection':'polarizer + flag control',
          }
          cmf_b = {
              'color':'neutral translucent liquid against controlled deep field',
              'material':'glass + transparent serum texture',
              'finish':'crisp edge highlight + visible liquid body',
          }
          distinct_a = _asset(
              'AST-D1', scene='bright morning vanity identity scene', carrier='LIFESTYLE_PHOTOGRAPHY',
              composition='environment-led identity frame', camera=camera, lighting=lighting, cmf=cmf,
              delta='wide identity/context scene',
          )
          distinct_b = _asset(
              'AST-D2', scene='controlled dark macro texture study', carrier='MATERIAL_MACRO_PHOTOGRAPHY',
              composition='tight macro evidence frame', camera=camera_b, lighting=lighting_b, cmf=cmf_b,
              delta='macro texture evidence scene',
          )
          execution_a = prompt_compiler._derived_photo_contract(distinct_a, None, None)
          execution_b = prompt_compiler._derived_photo_contract(distinct_b, None, None)
          assert execution_a['authority'] == execution_b['authority'] == 'AGENT_ASSET_ART_DIRECTION'
          assert execution_a['camera'] != execution_b['camera']
          assert execution_a['lighting'] != execution_b['lighting']
          assert execution_a['cmf'] != execution_b['cmf']

          justification = (
              'Controlled A/B test: keep camera, lighting and CMF fixed so only the authored message/evidence '
              'plane changes; the shared preset is the experimental control, not a generic portfolio default.'
          )
          controlled = {
              'assets': [
                  _asset(
                      'AST-AB-A', scene='controlled tabletop A/B variant A',
                      carrier='CONTROLLED_TEST_PHOTOGRAPHY_A', composition='variant A evidence hierarchy',
                      camera=camera, lighting=lighting, cmf=cmf,
                      delta='A variant changes evidence hierarchy only', justification=justification,
                  ),
                  _asset(
                      'AST-AB-B', scene='controlled tabletop A/B variant B',
                      carrier='CONTROLLED_TEST_PHOTOGRAPHY_B', composition='variant B evidence hierarchy',
                      camera=camera, lighting=lighting, cmf=cmf,
                      delta='B variant changes evidence hierarchy only', justification=justification,
                  ),
              ]
          }
          controlled_result = validate_portfolio_differentiation(controlled, _direction())
          assert controlled_result['status'] == 'PASS'

          legacy_nonphoto = {
              'assets': [
                  {
                      'asset_id':'AST-LEGACY-A','asset_type':'IMAGE','art_direction_status':'AUTHORED',
                      'asset_art_direction':{
                          'visual_carrier':'LOCKED_SOURCE_HERO',
                          'composition_grammar':'asymmetric two-layer depth stack',
                          'layout_geometry':'product x=70%, evidence trace x=12%',
                          'scale_depth':'large 68%','negative_space':'open left crescent',
                          'camera_or_view':'95mm eye level','material_response':'warm mineral plaster',
                          'deliberate_difference':'opening identity hero',
                          'product_presence':{'planning_state':'REQUIRED','product_role':'hero'},
                      },
                  },
                  {
                      'asset_id':'AST-LEGACY-B','asset_type':'IMAGE','art_direction_status':'AUTHORED',
                      'asset_art_direction':{
                          'visual_carrier':'GRAPHIC_EVIDENCE_AXIS',
                          'composition_grammar':'12-degree diagonal evidence axis',
                          'layout_geometry':'values travel lower-left to upper-right',
                          'scale_depth':'flat information depth','negative_space':'upper-right breathing field',
                          'camera_or_view':'','material_response':'vellum-like translucent evidence plane',
                          'deliberate_difference':'remove product and switch to diagonal information carrier',
                          'product_presence':{'planning_state':'FORBIDDEN','product_role':'absent'},
                      },
                  },
              ]
          }
          legacy_result = validate_portfolio_differentiation(legacy_nonphoto, _direction())
          assert legacy_result['status'] == 'PASS'
          assert legacy_result['photography_asset_count_reviewed'] == 0

          print({
              'duplicate_unrelated_scene_status': duplicate['status'],
              'duplicate_photo_groups': duplicate['duplicate_photography_signature_groups'],
              'missing_photo_execution_status': missing['status'],
              'missing_fields': missing_issue['missing'],
              'distinct_scene_authority': execution_a['authority'],
              'distinct_camera': execution_a['camera'] != execution_b['camera'],
              'distinct_lighting': execution_a['lighting'] != execution_b['lighting'],
              'distinct_cmf': execution_a['cmf'] != execution_b['cmf'],
              'controlled_ab_status': controlled_result['status'],
              'legacy_nonphoto_status': legacy_result['status'],
          })
          PY
