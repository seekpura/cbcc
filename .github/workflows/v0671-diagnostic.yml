name: v0671-diagnostic

on:
  push:
    branches: ['v0.6.71-full-canonical-parity']
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml pytest
      - name: hash seed 0
        continue-on-error: true
        env: {PYTHONHASHSEED: '0'}
        run: python -m pytest tests/test_v0671_full_canonical_parity.py -q
      - name: hash seed 1
        continue-on-error: true
        env: {PYTHONHASHSEED: '1'}
        run: python -m pytest tests/test_v0671_full_canonical_parity.py -q
      - name: hash seed 2
        continue-on-error: true
        env: {PYTHONHASHSEED: '2'}
        run: python -m pytest tests/test_v0671_full_canonical_parity.py -q
      - name: hash seed 3
        continue-on-error: true
        env: {PYTHONHASHSEED: '3'}
        run: python -m pytest tests/test_v0671_full_canonical_parity.py -q
      - name: hash seed 4
        continue-on-error: true
        env: {PYTHONHASHSEED: '4'}
        run: python -m pytest tests/test_v0671_full_canonical_parity.py -q
      - name: hash seed 5
        continue-on-error: true
        env: {PYTHONHASHSEED: '5'}
        run: python -m pytest tests/test_v0671_full_canonical_parity.py -q
      - name: hash seed 6
        continue-on-error: true
        env: {PYTHONHASHSEED: '6'}
        run: python -m pytest tests/test_v0671_full_canonical_parity.py -q
      - name: hash seed 7
        continue-on-error: true
        env: {PYTHONHASHSEED: '7'}
        run: python -m pytest tests/test_v0671_full_canonical_parity.py -q
