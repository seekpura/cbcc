name: v0671-diagnostic

on:
  push:
    branches: ['v0.6.71-full-canonical-parity']
  workflow_dispatch:

jobs:
  subset:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aggregate
            expr: ''
          - name: without-static
            expr: 'not real_delivery_html'
          - name: without-listing
            expr: 'not listing_markdown'
          - name: without-lineage
            expr: 'not full_asset_package_lineage'
          - name: without-strategy
            expr: 'not strategy_completion'
          - name: without-relevance
            expr: 'not human_asset_and_typography'
          - name: without-production-objects
            expr: 'not human_payload_exposes_independent'
          - name: first-five
            expr: 'not human_payload_exposes_independent'
          - name: static-and-production
            expr: 'real_delivery_html or human_payload_exposes_independent'
          - name: listing-and-production
            expr: 'listing_markdown or human_payload_exposes_independent'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml pytest
      - name: Run subset
        env:
          PYTHONHASHSEED: '0'
          EXPR: ${{ matrix.expr }}
        run: |
          if [ -z "$EXPR" ]; then
            python -m pytest tests/test_v0671_full_canonical_parity.py -q
          else
            python -m pytest tests/test_v0671_full_canonical_parity.py -q -k "$EXPR"
          fi
