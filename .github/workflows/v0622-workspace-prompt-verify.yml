name: CBCC v0.6.22 Release cleanup

on:
  push:
    branches:
      - work/v0622-dynamic-workspace-prompt

permissions:
  contents: write

jobs:
  release-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "63c696af39ac309c9d275d88160fb1fe7921c778"
      - name: Build and push clean release tree
        run: |
          python .release/v0622_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize v0.6.22 dynamic workspace and prompt projection"
          git push origin HEAD:work/v0622-dynamic-workspace-prompt
