name: v0.6.38 Host FULL Delivery Regression

on:
  push:
    branches:
      - v0.6.38-host-delivery-regression-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-delivery-release-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Compile runtime
        run: python -m compileall -q runtime/cbcc

      - name: Keep v0.6.37 commercial prompt density
        run: python scripts/check_commercial_prompt_density.py

      - name: Run v0.6.37 forward regressions
        run: |
          python -m pytest -q tests/test_v0637_commercial_operator_density.py
          python -m pytest -q tests/test_v0637_operator_execution_board.py
          python -m pytest -q tests/test_v0637_operator_delivery_html.py
          python -m pytest -q tests/test_v0637_video_narrative.py
          python -m pytest -q tests/test_v0637_prompt_activation.py
          python -m pytest -q tests/test_v0631_model_native_prompt_contract.py

      - name: Build real v0.6.38 plugin package
        run: python scripts/build_plugin_dist_v0638.py --output-dir /tmp/cbcc-v0638-dist

      - name: Reject host/canonical authority shrinkage
        run: python scripts/check_plugin_host_authority_density.py /tmp/cbcc-v0638-dist/cross-border-commerce-creative-plugin-v0.6.38.zip

      - name: Inspect release package contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cbcc-v0638-dist/release_manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          c=data['delivery_contract']
          assert c['host_native_full_delivery_is_first_class'] is True
          assert c['fixed_global_dashboard_shell_forbidden'] is True
          assert c['operator_board_cannot_replace_full_objects'] is True
          assert c['complete_per_asset_human_design_card_required'] is True
          assert c['unsupported_numeric_ui_fill_forbidden'] is True
          print('PASS', data['version'], data['authority_version'])
          PY

      - name: Run smoke suites
        run: |
          python tests/run_smoke.py
          python tests/run_toolkit_smoke.py
