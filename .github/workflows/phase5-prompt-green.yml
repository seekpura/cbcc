name: phase5-prompt-green

on:
  push:
    branches: [phase5-prompt-compiler]
    paths:
      - '.github/workflows/phase5-prompt-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-green:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: runtime
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -q pytest pyyaml pillow
      - name: Phase 5 language-purity focused proof
        run: |
          pytest -q \
            tests/test_v0631_model_native_prompt_contract.py \
            tests/test_v0676_phase5_integrated_render_language_purity.py
      - name: Prompt adjacency — v0.6.72
        run: |
          pytest -q \
            tests/test_v0672_prompt_relevance_and_nested_execution.py \
            tests/test_v0672_integrated_copy_negative_constraint.py
      - name: Prompt adjacency — v0.6.73
        run: pytest -q tests/test_v0673_model_prompt_route_relevance.py
      - name: Cross-scope closure — v0.6.74
        run: pytest -q tests/test_v0674_regression_closure.py
