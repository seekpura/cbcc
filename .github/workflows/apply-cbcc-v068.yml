name: Apply CBCC v0.6.8 release patch

on:
  push:
    branches: [main]
    paths:
      - '.changes/apply-v068.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply release patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .changes/v068-meta.patch
          git apply .changes/v068-meta.patch
          git apply --check .changes/v068-delivery.patch
          git apply .changes/v068-delivery.patch
          test "$(tr -d '\r\n ' < VERSION)" = '0.6.8'

      - name: Verify semantic and asset workspaces
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/test_v067_workspace_information_architecture.py tests/test_v068_asset_production_workspace.py
          python -m compileall -q runtime builders
          python - <<'PY'
          from pathlib import Path
          import json,re,shutil,sys
          root=Path.cwd();sys.path.insert(0,str(root/'runtime'))
          from cbcc.compiler import build_project
          from cbcc.delivery_html import build_delivery_html
          fx=root/'tests/fixtures/kiyuu_my_tiktok'
          req=json.loads((fx/'request.json').read_text(encoding='utf-8'))
          out=Path('/tmp/cbcc-v068-kiyuu')
          if out.exists(): shutil.rmtree(out)
          build_project(out,req,fx)
          html_path=build_delivery_html(out,out/'index.html')
          text=html_path.read_text(encoding='utf-8')
          assert text.count('data-workspace-kind="asset-production"') == 3
          pages=re.findall(r'<section class="page asset-page".*?</section>',text,re.S)
          assert len(pages)==3
          assert all('module-shell' not in page for page in pages)
          print(f'KIYUU asset workspaces={len(pages)} html_bytes={html_path.stat().st_size}')
          PY

      - name: Commit verified canonical source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .changes/v068-meta.patch .changes/v068-delivery.patch .changes/apply-v068.trigger
          rm -f .github/workflows/apply-cbcc-v068.yml
          rmdir .changes 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: release CBCC v0.6.8 asset production workspace'
          git push origin HEAD:main
