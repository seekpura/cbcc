name: Phase 5 REQ-082 Prompt Density Characterization

on:
  push:
    branches: [phase5-req082-prompt-density]
    paths:
      - '.github/workflows/phase5-req082-characterization.yml'
      - '.github/phase5_req082_characterization_trigger.txt'
      - 'tests/test_v0678_phase5_req082_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q pytest pyyaml pillow
      - name: Broad Prompt density characterization
        run: pytest -q tests/test_v0678_phase5_req082_broad_prompt_density.py
      - name: Static Art Direction acting-Prompt characterization
        run: pytest -q tests/test_v0678_phase5_req082_static_ad_prompt_consumption.py
      - name: Integrated render bilingual semantic purity characterization
        run: pytest -q tests/test_v0678_phase5_req082_integrated_render_language_purity.py
      - name: Current Phase 5 adjacent contracts
        run: |
          pytest -q \
            tests/test_v0676_phase5_dynamic_prompt_continuity.py \
            tests/test_v0677_phase5_req086_scene_photo_prompt_consumption.py
      - name: Complete v067 cross-scope
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_v067*.py' -print | sort)
          test "${#files[@]}" -gt 0
          pytest -q "${files[@]}"
