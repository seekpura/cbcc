name: phase4-route-red
on:
  push:
    branches: [main]
    paths:
      - 'tests/test_v0676_phase4_visual_route_art_direction.py'
      - 'runtime/cbcc/strategy_culture_completion_v0670.py'
      - 'runtime/cbcc/agent_art_direction_authority.py'
      - 'runtime/cbcc/portfolio_visual_authority.py'
      - '.github/workflows/phase4-route-red.yml'
  workflow_dispatch:

jobs:
  red:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml openpyxl
      - name: Run Phase 4 route RED
        # Manual retrigger after repairing the unrelated v0.6.70 Python syntax regression.
        run: pytest -q tests/test_v0676_phase4_visual_route_art_direction.py
