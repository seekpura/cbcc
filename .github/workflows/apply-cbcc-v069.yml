name: Apply CBCC v0.6.9 photography continuity patch

on:
  push:
    branches: [main]
    paths:
      - '.changes/apply-v069.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.6.9 patches
        shell: bash
        run: |
          set -euo pipefail
          for p in $(find .changes -maxdepth 1 -name 'v069-*.patch' -type f | sort); do
            echo "applying $p"
            git apply --check "$p"
            git apply "$p"
          done
          test "$(tr -d '\r\n ' < VERSION)" = '0.6.9'

      - name: Verify continuity and real KIYUU delivery
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_v067_workspace_information_architecture.py tests/test_v068_asset_production_workspace.py tests/test_v069_photography_execution_continuity.py
          python -m compileall -q runtime builders
          python - <<'PY'
          from pathlib import Path
          import json, shutil, sys
          root=Path.cwd(); sys.path.insert(0,str(root/'runtime'))
          from cbcc.compiler import build_project
          from cbcc.delivery_html import build_delivery_html
          fx=root/'tests/fixtures/kiyuu_my_tiktok'
          req=json.loads((fx/'request.json').read_text(encoding='utf-8'))
          out=Path('/tmp/cbcc-v069-kiyuu')
          if out.exists(): shutil.rmtree(out)
          build_project(out,req,fx)
          packages=sorted(p for p in (out/'artifacts/asset_packages').iterdir() if p.is_dir())
          assert len(packages)==3
          for package in packages:
              design=json.loads((package/'12_design_card.json').read_text(encoding='utf-8'))
              prompt=json.loads((package/'13_prompt_contract.json').read_text(encoding='utf-8'))
              execution=design['photography_execution']
              assert execution['capture_mode']=='COMPOSITE'
              assert execution['composition']['product_occupancy']['height_pct']==68
              assert execution['color_management']['output_space']=='sRGB'
              assert execution['color_management']['product_color_fidelity']=='locked real-product layer'
              for key in ('canonical_prompt_cn','canonical_prompt_en'):
                  text=prompt[key]
                  for required in ('COMPOSITE','68','sRGB','locked real-product layer'):
                      assert required in text
          html=build_delivery_html(out,out/'index.html').read_text(encoding='utf-8')
          assert html.count('拍摄 / 合成模式')>=3
          assert html.count('构图执行合同')>=3
          assert html.count('输出色彩管理')>=3
          print(f'KIYUU packages={len(packages)} html_bytes={len(html.encode())}')
          PY

      - name: Commit verified v0.6.9 source and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .changes/v069-*.patch .changes/apply-v069.trigger
          rm -f .github/workflows/apply-cbcc-v069.yml
          rmdir .changes 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve photography execution contract through canonical prompts'
          git push origin HEAD:main
