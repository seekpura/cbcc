name: v0673-apply-candidate

on:
  push:
    branches: [v0.6.73-bilingual-business-object-delivery-closure]
    paths:
      - '.release_patches/v0673/**'
      - '.github/workflows/v0673-apply-candidate.yml'

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pyyaml pytest
      - name: Context-safe apply of fresh-K01 candidate
        run: |
          set -euo pipefail
          for p in .release_patches/v0673/*.patch; do
            echo "checking $p"
            git apply --check "$p"
          done
          for p in .release_patches/v0673/*.patch; do
            git apply "$p"
          done
      - name: Verify v0.6.73 candidate plus inherited release floors
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: runtime
        run: |
          python -m pytest -q \
            tests/test_v0673_bilingual_asset_guidance.py \
            tests/test_v0673_chinese_delivery_closure.py \
            tests/test_v0673_model_prompt_route_relevance.py \
            tests/test_v0672_fresh_k01_portfolio_delta.py \
            tests/test_v0672_fresh_k01_projection_closure.py \
            tests/test_v0672_global_language_closure.py \
            tests/test_v0672_canonical_human_compaction.py \
            tests/test_v0672_fresh_k01_materialization_closure.py \
            tests/test_v0672_fresh_k01_final_export_closure.py \
            tests/test_v0672_prompt_relevance_and_nested_execution.py \
            tests/test_v0672_integrated_copy_negative_constraint.py \
            tests/test_v0672_nonblocking_platform_research.py \
            tests/test_v0671_full_canonical_parity.py \
            tests/test_v0671_canonical_search_security.py \
            tests/test_v0670_positive_canonical_projection.py
      - name: Commit exact candidate and remove staging machinery
        run: |
          set -euo pipefail
          git config user.name 'cbcc-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -r .release_patches/v0673 .github/workflows/v0673-apply-candidate.yml
          git add runtime/cbcc/asset_compiler.py runtime/cbcc/human_language_delivery.py runtime/cbcc/video_creator.py runtime/cbcc/model_native_prompt_contract.py
          git add tests/test_v0673_bilingual_asset_guidance.py tests/test_v0673_chinese_delivery_closure.py tests/test_v0673_model_prompt_route_relevance.py
          git commit -m 'v0.6.73: close bilingual business-object and model-prompt consumption gaps'
          git push origin HEAD:v0.6.73-bilingual-business-object-delivery-closure
