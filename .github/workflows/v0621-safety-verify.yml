name: CBCC v0.6.21 request safety verification

on:
  push:
    branches:
      - work/v0621-mcp-streamable-http

permissions:
  contents: write

jobs:
  verify-request-safety:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply request safety patch
        run: python .changes/v0621_safety_patch.py
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Verify continuity through v0.6.21 safety boundary
        shell: bash
        run: |
          mkdir -p .changes
          set +e
          pytest -q -ra \
            tests/test_v0613_provider_transport_integrity.py \
            tests/test_v0614_provider_executor_lifecycle.py \
            tests/test_v0615_provider_executor_bridge.py \
            tests/test_v0615_provider_contract_bridge.py \
            tests/test_v0616_provider_host_surface.py \
            tests/test_v0617_host_action_mapping.py \
            tests/test_v0617_secret_field_patterns.py \
            tests/test_v0618_transport_descriptors.py \
            tests/test_v0619_plugin_http_host.py \
            tests/test_v0619_http_auth_failclosed.py \
            tests/test_v0620_mcp_stdio_host.py \
            tests/test_v0621_mcp_streamable_http.py \
            > .changes/v0621-safety-output.txt 2>&1
          rc=$?
          set -e
          echo "$rc" > .changes/v0621-safety-output.rc
          cat .changes/v0621-safety-output.txt
      - name: Commit materialized safety changes and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/cbcc/mcp_protocol.py runtime/cbcc/mcp_streamable_http.py \
            tests/test_v0621_mcp_streamable_http.py \
            .changes/v0621-safety-output.txt .changes/v0621-safety-output.rc
          if ! git diff --cached --quiet; then
            git commit -m "fix: enforce v0.6.21 MCP request-id safety"
            git push origin HEAD:work/v0621-mcp-streamable-http
          fi
      - name: Enforce targeted test result
        if: always()
        shell: bash
        run: test "$(cat .changes/v0621-safety-output.rc)" = "0"
