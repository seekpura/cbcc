name: phase7-wire-final-mature-package

permissions:
  contents: write

on:
  push:
    branches: [repair-04-phase7-full-materialization]
    paths:
      - '.github/workflows/phase7-wire-final-mature-package.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-04-phase7-full-materialization
      - name: Re-audit mature package on final bytes and require it in production orchestrator
        run: |
          python - <<'PY'
          from pathlib import Path

          semantic_path = Path('runtime/cbcc/full_package_semantic_closure_v0681.py')
          text = semantic_path.read_text(encoding='utf-8')

          marker = '\ndef _rebuild_manifest_and_zip(package: Path, zip_path: Path | None, manifest: dict[str, Any]) -> dict[str, Any]:\n'
          helper = r'''
def _manifest_declared_package_paths(manifest: Mapping[str, Any]) -> list[tuple[str, str]]:
    """Return top-level manifest values that declare in-package files/directories.

    Core mature outputs remain owned by full_delivery_depth_v3.audit_host_full_package; this helper only
    verifies that paths already declared by DELIVERY_MANIFEST still resolve on the final package bytes.
    """
    rows: list[tuple[str, str]] = []
    for key, raw in manifest.items():
        if key in {'package_dir', 'zip_path'} or not isinstance(raw, str):
            continue
        value = raw.strip()
        if not value or '://' in value:
            continue
        path = Path(value)
        if path.is_absolute():
            continue
        suffix = path.suffix.lower()
        if value.endswith('/') or suffix in {'.json', '.md', '.html', '.txt', '.yaml', '.yml'}:
            rows.append((str(key), value))
    return rows


def _canonical_listing_required(package: Path, manifest: Mapping[str, Any]) -> bool:
    if isinstance(manifest.get('listing_upload_ready'), str) and str(manifest.get('listing_upload_ready')).strip():
        return True
    payload = _read_json(package / CANONICAL_FILE)
    business = payload.get('canonical_business_objects') if isinstance(payload.get('canonical_business_objects'), Mapping) else {}
    human = business.get('human_delivery') if isinstance(business.get('human_delivery'), Mapping) else {}
    task_scope = human.get('task_scope') if isinstance(human.get('task_scope'), Mapping) else {}
    if task_scope.get('listing_active') is True:
        return True
    inactive = {'', 'NOT_ACTIVE', 'NOT_NEEDED', 'MISSING_INPUT', 'TO_VERIFY', 'INACTIVE'}
    for key in ('listing', 'listing_upload', 'listing_ready'):
        value = human.get(key)
        if isinstance(value, Mapping):
            if str(value.get('status') or '').upper() not in inactive:
                return True
        elif value not in (None, '', [], {}, False):
            return True
    return False


def audit_final_mature_package_continuity(package_dir: Path | str) -> dict[str, Any]:
    """Re-run the existing mature Host/FULL package contract on the final mutated package bytes."""
    from .full_delivery_depth_v3 import audit_host_full_package

    package = Path(package_dir)
    base = audit_host_full_package(package)
    issues = [dict(row) for row in (base.get('issues') or []) if isinstance(row, Mapping)]
    manifest = _read_json(package / DELIVERY_MANIFEST_FILE)
    declared_checks: list[dict[str, Any]] = []
    for field, relative in _manifest_declared_package_paths(manifest):
        resolved = package / relative
        exists = resolved.exists()
        declared_checks.append({'manifest_field': field, 'path': relative, 'exists': exists})
        if not exists:
            issues.append({'code': 'FINAL_MATURE_DECLARED_PATH_MISSING', 'manifest_field': field, 'path': relative})

    listing_required = _canonical_listing_required(package, manifest)
    listing_path = str(manifest.get('listing_upload_ready') or '01_LISTING_UPLOAD_READY.md')
    if listing_required and not (package / listing_path).exists():
        issues.append({'code': 'FINAL_MATURE_LISTING_OUTPUT_MISSING', 'path': listing_path})

    deduped: list[dict[str, Any]] = []
    seen: set[str] = set()
    for issue in issues:
        key = json.dumps(issue, ensure_ascii=False, sort_keys=True, default=str)
        if key not in seen:
            seen.add(key)
            deduped.append(issue)
    return {
        'status': 'PASS' if not deduped else 'INCOMPLETE',
        'checker': 'runtime.cbcc.full_delivery_depth_v3.audit_host_full_package',
        'core_contract_reused': True,
        'final_package_bytes': True,
        'base_mature_audit_status': base.get('status'),
        'listing_required': listing_required,
        'listing_path': listing_path if listing_required else None,
        'declared_path_checks': declared_checks,
        'issues': deduped,
        'invariant': 'Final Phase-7 PASS reuses the mature Host/FULL package checker on final bytes; canonical semantic inventory alone cannot satisfy mature package continuity.',
    }
'''
          if text.count(marker) != 1:
              raise SystemExit('final semantic helper insertion marker not found exactly once')
          text = text.replace(marker, '\n' + helper + marker)

          old_sig = '''def materialize_final_package_semantics(\n    package_dir: Path | str,\n    *,\n    zip_path: Path | str | None = None,\n    host_package_dir: Path | str | None = None,\n) -> dict[str, Any]:'''
          new_sig = '''def materialize_final_package_semantics(\n    package_dir: Path | str,\n    *,\n    zip_path: Path | str | None = None,\n    host_package_dir: Path | str | None = None,\n    require_mature_package: bool = False,\n) -> dict[str, Any]:'''
          if text.count(old_sig) != 1:
              raise SystemExit('semantic finalizer signature not found exactly once')
          text = text.replace(old_sig, new_sig)

          old_issues = '''    semantic_issues = audit_final_semantic_inventory(package)\n    actual_output = audit_actual_output_boundary(package)\n'''
          new_issues = '''    semantic_issues = audit_final_semantic_inventory(package)\n    mature = audit_final_mature_package_continuity(package) if require_mature_package else {\n        "status": "NOT_REQUIRED_FOR_SEMANTIC_UTILITY",\n        "checker": "runtime.cbcc.full_delivery_depth_v3.audit_host_full_package",\n        "core_contract_reused": True,\n        "final_package_bytes": True,\n        "issues": [],\n    }\n    mature_issues = list(mature.get("issues") or []) if require_mature_package else []\n    blocking_issues = list(semantic_issues) + mature_issues\n    actual_output = audit_actual_output_boundary(package)\n'''
          if text.count(old_issues) != 1:
              raise SystemExit('semantic issue block not found exactly once')
          text = text.replace(old_issues, new_issues)

          text = text.replace('''        "status": "PASS" if not semantic_issues else "INCOMPLETE",\n''', '''        "status": "PASS" if not blocking_issues else "INCOMPLETE",\n''', 1)
          text = text.replace('''        "issues": semantic_issues,\n''', '''        "final_mature_package_continuity": mature.get("status"),\n        "final_mature_package_audit": mature,\n        "issues": blocking_issues,\n''', 1)
          text = text.replace('''        "phase7_source_closure": "PASS" if not semantic_issues else "INCOMPLETE",\n''', '''        "phase7_source_closure": "PASS" if not blocking_issues else "INCOMPLETE",\n''', 1)
          old_block = '''    if semantic_issues:\n        raise RuntimeError("BLOCKED Phase 7 final semantic inventory failed: " + json.dumps(semantic_issues, ensure_ascii=False))\n'''
          new_block = '''    if blocking_issues:\n        label = "mature package continuity" if mature_issues else "final semantic inventory"\n        raise RuntimeError("BLOCKED Phase 7 " + label + " failed: " + json.dumps(blocking_issues, ensure_ascii=False))\n'''
          if text.count(old_block) != 1:
              raise SystemExit('semantic blocker not found exactly once')
          text = text.replace(old_block, new_block)

          delivery_anchor = '''            "phase7_final_semantic_closure": "PASS",\n            "final_semantic_signature_sha256": inventory["semantic_signature_sha256"],\n'''
          delivery_repl = '''            "phase7_final_semantic_closure": "PASS",\n            "final_mature_package_continuity": mature.get("status"),\n            "final_semantic_signature_sha256": inventory["semantic_signature_sha256"],\n'''
          if text.count(delivery_anchor) != 1:
              raise SystemExit('delivery mature-status anchor not found exactly once')
          text = text.replace(delivery_anchor, delivery_repl)

          workspace_anchor = '''            "phase7_final_semantic_closure": "PASS",\n            "final_semantic_object_inventory_dynamic": True,\n'''
          workspace_repl = '''            "phase7_final_semantic_closure": "PASS",\n            "final_mature_package_continuity": mature.get("status"),\n            "final_semantic_object_inventory_dynamic": True,\n'''
          if text.count(workspace_anchor) != 1:
              raise SystemExit('workspace mature-status anchor not found exactly once')
          text = text.replace(workspace_anchor, workspace_repl)

          return_anchor = '''        "semantic_object_count": inventory["semantic_object_count"],\n        "host_native_runtime_export_parity": parity.get("status"),\n'''
          return_repl = '''        "semantic_object_count": inventory["semantic_object_count"],\n        "final_mature_package_continuity": mature.get("status"),\n        "host_native_runtime_export_parity": parity.get("status"),\n'''
          if text.count(return_anchor) != 1:
              raise SystemExit('return mature-status anchor not found exactly once')
          text = text.replace(return_anchor, return_repl)
          semantic_path.write_text(text, encoding='utf-8')

          orchestrator_path = Path('runtime/cbcc/phase7_lineage_semantic_closure_v0681.py')
          orch = orchestrator_path.read_text(encoding='utf-8')
          old_call = '''    semantic = materialize_final_package_semantics(\n        package,\n        zip_path=zip_path,\n        host_package_dir=host_package_dir,\n    )\n'''
          new_call = '''    semantic = materialize_final_package_semantics(\n        package,\n        zip_path=zip_path,\n        host_package_dir=host_package_dir,\n        require_mature_package=True,\n    )\n'''
          if orch.count(old_call) != 1:
              raise SystemExit('Phase7 orchestrator semantic call not found exactly once')
          orchestrator_path.write_text(orch.replace(old_call, new_call), encoding='utf-8')
          PY
      - name: Commit production wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/cbcc/full_package_semantic_closure_v0681.py runtime/cbcc/phase7_lineage_semantic_closure_v0681.py
          git diff --cached --check
          git commit -m "feat(phase7): re-audit mature package continuity on final bytes"
          git push origin HEAD:repair-04-phase7-full-materialization
