name: phase7-req088-wire-wrapper

permissions:
  contents: write

on:
  push:
    branches: [repair-04-phase7-full-materialization]
    paths:
      - '.github/workflows/phase7-req088-wire-wrapper.yml'

jobs:
  wire-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-04-phase7-full-materialization
      - name: Wire final export through REQ-088 lineage + semantic orchestrator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('runtime/cbcc/commercial_delivery_continuity.py')
          text = path.read_text(encoding='utf-8')
          old = """        from .full_package_semantic_closure_v0681 import materialize_final_package_semantics\n        phase7 = materialize_final_package_semantics(package, zip_path=Path(manifest['zip_path']))\n"""
          new = """        from .phase7_lineage_semantic_closure_v0681 import materialize_phase7_lineage_and_semantics\n        phase7 = materialize_phase7_lineage_and_semantics(package, zip_path=Path(manifest['zip_path']))\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old Phase7 finalizer call, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit wrapper wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/cbcc/commercial_delivery_continuity.py
          git diff --cached --check
          git commit -m "feat(phase7): route final export through REQ-088 lineage closure"
          git push origin HEAD:repair-04-phase7-full-materialization
