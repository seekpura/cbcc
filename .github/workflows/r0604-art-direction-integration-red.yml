name: R06-04 Art Direction Integration Repair

on:
  push:
    branches: [r06-04-art-direction-integration-red]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r06-04-art-direction-integration-red
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest pyyaml openpyxl
      - name: Apply compiler art-direction integration repair
        run: python scripts/apply_r0604_art_direction_integration_patch.py
      - name: Focused autonomy and art-direction verification
        env:
          PYTHONPATH: .:runtime
        run: >-
          python -m pytest -q
          tests/test_v0682_r0604_agent_autonomy_restoration.py
          tests/test_v0630_agent_art_direction_authority.py
          tests/test_v0630_surface_agent_authority.py
          tests/test_v0655_asset_universe_open_world.py
      - name: Commit source repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/cbcc/compiler.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(r06-04): preserve per-asset art direction compiler authority'
          git push origin HEAD:r06-04-art-direction-integration-red
