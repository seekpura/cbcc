name: CBCC v0.6.23 release cleanup

on:
  push:
    branches:
      - work/v0623-task-scoped-delivery

permissions:
  contents: write

jobs:
  release-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen main
        run: test "$(git rev-parse origin/main)" = "aceefb6e87615d126e4e883024c798942bb3ff7f"
      - name: Update release authorities
        run: python .changes/v0623_release.py
      - name: Remove staging and self-delete workflow
        run: |
          rm -rf .changes
          rm -f .github/workflows/v0623-task-scoped-delivery.yml
      - name: Commit clean release tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: finalize CBCC v0.6.23 task-scoped delivery"
          git push origin HEAD:work/v0623-task-scoped-delivery
