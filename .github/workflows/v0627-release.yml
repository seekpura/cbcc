name: CBCC v0.6.27 release cleanup

on:
  push:
    branches:
      - work/v0627-current-scope-completion

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen main and validated source ancestry
        run: |
          test "$(git rev-parse origin/main)" = "8ecb8643c5cbda64d83d10624ac823d91fb99a56"
          git merge-base --is-ancestor 8c1e6f1 HEAD
      - name: Materialize release metadata
        run: python .changes/v0627_release.py
      - name: Verify release metadata
        run: |
          grep -Fx '0.6.27-current-scope-completion' VERSION
          grep -F 'version: 0.6.27-current-scope-completion' SKILL.md
          grep -F '# CBCC v0.6.27 CURRENT HANDOFF' CURRENT_HANDOFF.md
          grep -F 'NEW_FAILURE_COUNT=0' CHANGELOG_V0627.md
          grep -F '0.6.27-current-scope-completion' runtime/cbcc/compiler.py
      - name: Remove staging and temporary workflows
        run: |
          rm -f .changes/v0627_apply.py
          rm -f .changes/v0627_release.py
          rm -f .github/workflows/v0627-verify.yml
          rm -f .github/workflows/v0627-release.yml
          rmdir .changes 2>/dev/null || true
      - name: Commit clean v0.6.27 release tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: finalize CBCC v0.6.27 current-scope completion"
          git push origin HEAD:work/v0627-current-scope-completion
