name: phase4-photography-baseline-diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase4-photography-baseline-diagnostic.yml'
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q pytest pyyaml openpyxl
      - name: Checkout pre-Phase4-production baseline
        run: git checkout 88fc087bc9fe61fc3484a4ceb9a9b4c9d2205a76
      - name: Reproduce photography continuity on baseline
        run: pytest -q tests/test_v069_photography_execution_continuity.py
