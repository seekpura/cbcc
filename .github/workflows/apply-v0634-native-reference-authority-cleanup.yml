name: Apply v0.6.34 native-reference authority cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0634-native-reference-authority-cleanup.yml'
      - 'scripts/apply_v0634_native_reference_authority_cleanup.py'
      - 'tests/test_v0634_native_reference_authority_cleanup.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v0634:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .:runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt pytest
      - name: Apply cleanup
        run: python scripts/apply_v0634_native_reference_authority_cleanup.py
      - name: Compile wrapper
        run: python -m py_compile scripts/build_plugin_dist.py
      - name: Authority cleanup and core regression
        run: |
          pytest -q \
            tests/test_v0634_native_reference_authority_cleanup.py \
            tests/test_v0633_reference_guided_native_asset_universe.py \
            tests/test_v0633_asset_universe_workspace.py \
            tests/test_v0633_plugin_wrapper_authority.py \
            tests/test_v0632_production_parameter_closure.py \
            tests/test_v0631_model_native_prompt_contract.py \
            tests/test_v0630_agent_art_direction_authority.py
      - name: Verify cleaned authority
        run: |
          test "$(cat VERSION)" = "0.6.34-native-reference-authority-cleanup"
          grep -q '^version: 0.6.34-native-reference-authority-cleanup$' SKILL.md
          ! grep -q 'LOCKED_SOURCE_COMPOSITE 不是空背景生成' SKILL.md
          ! grep -q '生成可合成底片' scripts/build_plugin_dist.py
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No cleanup diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION SKILL.md scripts/build_plugin_dist.py
          git commit -m 'release: clean native-reference authority for v0.6.34'
          git push
