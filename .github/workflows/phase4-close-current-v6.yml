name: phase4-close-current-v6

on:
  push:
    branches: [phase4-closure]
    paths:
      - '.github/workflows/phase4-close-current-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCTION_HEAD: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf

jobs:
  focused:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.result.outputs.tests }}
      failures: ${{ steps.result.outputs.failures }}
      errors: ${{ steps.result.outputs.errors }}
      skipped: ${{ steps.result.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pyyaml pillow
      - env: {PYTHONPATH: runtime}
        run: |
          files=(tests/test_v0676_phase4_*.py)
          pytest -q "${files[@]}" --junitxml=/tmp/proof.xml
      - id: result
        run: python -c "import os,xml.etree.ElementTree as E;r=E.parse('/tmp/proof.xml').getroot();s=[r] if r.tag=='testsuite' else list(r.findall('testsuite'));f=open(os.environ['GITHUB_OUTPUT'],'a');[f.write(k+'='+str(sum(int(x.attrib.get(k,0)) for x in s))+'\\n') for k in ('tests','failures','errors','skipped')];f.close()"

  phase3:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.result.outputs.tests }}
      failures: ${{ steps.result.outputs.failures }}
      errors: ${{ steps.result.outputs.errors }}
      skipped: ${{ steps.result.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pyyaml pillow
      - name: Phase 3 historical files in isolated pytest processes
        env: {PYTHONPATH: runtime}
        run: |
          files=(
            tests/test_v0676_phase3_opportunity_family_evaluation.py
            tests/test_v0676_phase3_opportunity_family_runtime_binding.py
            tests/test_v0662_asset_universe_and_package_regressions.py
            tests/test_v0655_asset_universe_open_world.py
            tests/test_v0646_asset_family_no_quota.py
            tests/test_v0646_activation_state_taxonomy.py
            tests/test_v0633_asset_universe_workspace.py
          )
          i=0
          for file in "${files[@]}"; do
            i=$((i+1))
            pytest -q "$file" --junitxml="/tmp/phase3-$i.xml"
          done
      - id: result
        run: |
          python - <<'PY'
          import glob,os,xml.etree.ElementTree as E
          totals={k:0 for k in ('tests','failures','errors','skipped')}
          for name in sorted(glob.glob('/tmp/phase3-*.xml')):
              r=E.parse(name).getroot(); suites=[r] if r.tag=='testsuite' else list(r.findall('testsuite'))
              for k in totals: totals[k]+=sum(int(x.attrib.get(k,0)) for x in suites)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in totals.items(): f.write(f'{k}={v}\n')
          PY

  listing:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.result.outputs.tests }}
      failures: ${{ steps.result.outputs.failures }}
      errors: ${{ steps.result.outputs.errors }}
      skipped: ${{ steps.result.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pyyaml pillow
      - env: {PYTHONPATH: runtime}
        run: pytest -q tests/test_v0676_listing_search_authority.py tests/test_v0676_listing_search_context_bridge.py tests/test_v0676_listing_search_runtime_binding.py --junitxml=/tmp/proof.xml
      - id: result
        run: python -c "import os,xml.etree.ElementTree as E;r=E.parse('/tmp/proof.xml').getroot();s=[r] if r.tag=='testsuite' else list(r.findall('testsuite'));f=open(os.environ['GITHUB_OUTPUT'],'a');[f.write(k+'='+str(sum(int(x.attrib.get(k,0)) for x in s))+'\\n') for k in ('tests','failures','errors','skipped')];f.close()"

  graph:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.result.outputs.tests }}
      failures: ${{ steps.result.outputs.failures }}
      errors: ${{ steps.result.outputs.errors }}
      skipped: ${{ steps.result.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pyyaml pillow
      - env: {PYTHONPATH: runtime}
        run: pytest -q tests/test_v0676_canonical_commerce_graph.py --junitxml=/tmp/proof.xml
      - id: result
        run: python -c "import os,xml.etree.ElementTree as E;r=E.parse('/tmp/proof.xml').getroot();s=[r] if r.tag=='testsuite' else list(r.findall('testsuite'));f=open(os.environ['GITHUB_OUTPUT'],'a');[f.write(k+'='+str(sum(int(x.attrib.get(k,0)) for x in s))+'\\n') for k in ('tests','failures','errors','skipped')];f.close()"

  human:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.result.outputs.tests }}
      failures: ${{ steps.result.outputs.failures }}
      errors: ${{ steps.result.outputs.errors }}
      skipped: ${{ steps.result.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pyyaml pillow
      - env: {PYTHONPATH: runtime}
        run: pytest -q tests/test_v0670_human_projection_integrity.py --junitxml=/tmp/proof.xml
      - id: result
        run: python -c "import os,xml.etree.ElementTree as E;r=E.parse('/tmp/proof.xml').getroot();s=[r] if r.tag=='testsuite' else list(r.findall('testsuite'));f=open(os.environ['GITHUB_OUTPUT'],'a');[f.write(k+'='+str(sum(int(x.attrib.get(k,0)) for x in s))+'\\n') for k in ('tests','failures','errors','skipped')];f.close()"

  provider:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.result.outputs.tests }}
      failures: ${{ steps.result.outputs.failures }}
      errors: ${{ steps.result.outputs.errors }}
      skipped: ${{ steps.result.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pyyaml pillow
      - env: {PYTHONPATH: runtime}
        run: pytest -q tests/test_v0635_native_reference_provider_integrity.py --junitxml=/tmp/proof.xml
      - id: result
        run: python -c "import os,xml.etree.ElementTree as E;r=E.parse('/tmp/proof.xml').getroot();s=[r] if r.tag=='testsuite' else list(r.findall('testsuite'));f=open(os.environ['GITHUB_OUTPUT'],'a');[f.write(k+'='+str(sum(int(x.attrib.get(k,0)) for x in s))+'\\n') for k in ('tests','failures','errors','skipped')];f.close()"

  close:
    needs: [focused, phase3, listing, graph, human, provider]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Assert proof jobs and closure source boundary
        run: |
          test '${{ needs.focused.result }}' = success
          test '${{ needs.phase3.result }}' = success
          test '${{ needs.listing.result }}' = success
          test '${{ needs.graph.result }}' = success
          test '${{ needs.human.result }}' = success
          test '${{ needs.provider.result }}' = success
          changed=$(git diff --name-only "$PRODUCTION_HEAD"...HEAD)
          if printf '%s\n' "$changed" | grep -E '^runtime/|^tests/' ; then exit 1; fi
      - name: Correct closure generator consumer path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/phase4_close_current.py'); text=p.read_text(encoding='utf-8')
          old='runtime/cbcc/scene_derived_photography_authority.py'; new='runtime/cbcc/photographic_route_agent_authority.py'
          assert old in text; p.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Materialize JUnit summaries from hermetic proof outputs
        env:
          FOCUSED_TESTS: ${{ needs.focused.outputs.tests }}
          FOCUSED_FAILURES: ${{ needs.focused.outputs.failures }}
          FOCUSED_ERRORS: ${{ needs.focused.outputs.errors }}
          FOCUSED_SKIPPED: ${{ needs.focused.outputs.skipped }}
          P3_TESTS: ${{ needs.phase3.outputs.tests }}
          LISTING_TESTS: ${{ needs.listing.outputs.tests }}
          GRAPH_TESTS: ${{ needs.graph.outputs.tests }}
          HUMAN_TESTS: ${{ needs.human.outputs.tests }}
          PROVIDER_TESTS: ${{ needs.provider.outputs.tests }}
        run: |
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          def write(path,tests,failures=0,errors=0,skipped=0):
              ET.ElementTree(ET.Element('testsuite',{'tests':str(tests),'failures':str(failures),'errors':str(errors),'skipped':str(skipped),'time':'0'})).write(path,encoding='utf-8',xml_declaration=True)
          write('/tmp/phase4-focused.xml',int(os.environ['FOCUSED_TESTS']),int(os.environ['FOCUSED_FAILURES']),int(os.environ['FOCUSED_ERRORS']),int(os.environ['FOCUSED_SKIPPED']))
          cross=sum(int(os.environ[k]) for k in ('P3_TESTS','LISTING_TESTS','GRAPH_TESTS','HUMAN_TESTS','PROVIDER_TESTS'))
          write('/tmp/phase4-cross.xml',cross)
          PY
      - name: Generate Phase 4 CURRENT closure ledgers
        run: python .github/phase4_close_current.py --focused-junit /tmp/phase4-focused.xml --cross-junit /tmp/phase4-cross.xml
      - name: Record hermetic proof truth
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proof={
            'mode':'EXACT_PRODUCTION_SHA_HERMETIC_AUTHORITY_BOUNDARIES',
            'production_head_sha':'63eab0ab46ce5a251592b1a3363b03b99c3b4adf',
            'statement':'Phase 4 focused, Listing/Search, canonical graph, human projection and native reference/provider each ran in dedicated fresh runners. Phase 3 used its own fresh runner and each historical test file ran in a separate pytest process because those files intentionally load/wrap multiple authority generations through importlib/sys.modules and are not safe as one shared import graph.',
          }
          for p in [Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json'),Path('references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE4_ART_DIRECTION_PHOTOGRAPHY_VISUAL_MASTER.json')]:
              data=json.loads(p.read_text(encoding='utf-8')); ev=data['phase_evidence']['4'] if p.name=='REQUIREMENT_EXECUTION_LEDGER_CURRENT.json' else data['phase_evidence']; ev['hermetic_cross_scope_proof']=proof; p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate declared paths, closure truth and Phase 5 boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledger=json.loads(Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json').read_text(encoding='utf-8'))
          cmap=json.loads(Path('references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE4_ART_DIRECTION_PHOTOGRAPHY_VISUAL_MASTER.json').read_text(encoding='utf-8'))
          matrix=Path('references/REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md').read_text(encoding='utf-8')
          missing=[]
          for row in cmap['requirements']:
              for key in ('consumers','evidence'):
                  for rel in row.get(key) or []:
                      if not Path(rel).exists(): missing.append((row['requirement_id'],key,rel))
          assert not missing, missing
          assert ledger['phase_status']['4']=='PASS_PHASE4_ART_DIRECTION_PHOTOGRAPHY_VISUAL_MASTER_VERIFIED'
          assert ledger['phase_evidence']['4']['focused_tests']['status']=='PASS'
          assert ledger['phase_evidence']['4']['cross_scope_tests']['status']=='PASS'
          assert cmap['phase_evidence']['real_product_probes']['status']=='PENDING_FRESH_K01_FULL'
          assert cmap['phase_evidence']['provider_actual_output']['status']=='PENDING_PHASE7_8_10'
          assert ledger['next_phase']=='PHASE_5_PROMPT_RENDERER_CPP'
          assert 'PHASE5_PENDING' in matrix or 'PHASE5/7_E2E_PENDING' in matrix
          PY
      - name: Recheck dynamic lifecycle invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('runtime/cbcc/compiler.py').read_text(encoding='utf-8')
          build="video_plan=build_video_creator_plan(request.get('project_id','project'),objects,questions,lang.to_dict(),request.get('video_jobs'),assets=architecture.get('assets'),creative_council=council)"
          project='architecture=project_dynamic_art_direction_to_assets(architecture,video_plan)'
          write="aap=_write(p/'artifacts/asset_architecture.json',architecture)"
          assert text.index(build) < text.index(project) < text.index(write); assert text.count(build)==1
          PY
      - name: Remove temporary Phase 4 scaffolding
        run: |
          rm -f .github/phase4_patch_dynamic_art_direction.py .github/phase4_close_current.py \
            .github/workflows/phase4-dynamic-art-direction-red.yml .github/workflows/phase4-dynamic-art-direction-green.yml \
            .github/workflows/phase4-close-current.yml .github/workflows/phase4-close-current-v2.yml \
            .github/workflows/phase4-close-current-v3.yml .github/workflows/phase4-close-current-v4.yml \
            .github/workflows/phase4-close-current-v5.yml .github/workflows/phase4-close-current-v6.yml
          test -f tests/test_v0676_phase4_dynamic_surface_art_direction.py
      - name: Commit isolated Phase 4 closure
        run: |
          git config user.name 'cbcc-phase4-bot'; git config user.email 'actions@users.noreply.github.com'
          git add -A; git diff --cached --check
          git commit -m 'docs(phase4): close art-direction authority and clean scaffolding'
          git push origin HEAD:phase4-closure
