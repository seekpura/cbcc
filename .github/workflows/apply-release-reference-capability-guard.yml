name: Apply release reference-capability guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-release-reference-capability-guard.yml'
      - 'scripts/patch_release_reference_capability_guard.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch release authority
        run: python scripts/patch_release_reference_capability_guard.py
      - name: Verify source contract patch
        run: |
          grep -q 'prompt_consumption_blocks_project_completion' scripts/build_plugin_dist.py
          grep -q 'seven_agent_capability_continuity_required' scripts/build_plugin_dist.py
      - name: Commit normal source authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_plugin_dist.py
          git commit -m 'fix: encode reference-guided capability contract in release manifest'
          git push origin HEAD:main
