name: CBCC v0.6.13 provider transport diagnostics

on:
  push:
    branches:
      - work/v0613-provider-transport

permissions:
  contents: write

jobs:
  summarize-existing-regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build concise failure summary from committed regression evidence
        shell: bash
        run: |
          rc="unknown"
          if [ -f .changes/v0613-full-regression.rc ]; then
            rc="$(tr -d '\r\n' < .changes/v0613-full-regression.rc)"
          fi
          {
            echo "FULL_REGRESSION_RC=$rc"
            echo
            echo "== PYTEST TERMINAL SUMMARY =="
            grep -E '^[=]+ .* (failed|error|errors|passed|skipped|xfailed|xpassed|warning|warnings).* [=]+$' .changes/v0613-full-regression.txt | tail -30 || true
            echo
            echo "== FAILED / ERROR NODE IDS =="
            grep -E '^(FAILED|ERROR) ' .changes/v0613-full-regression.txt | tail -400 || true
            echo
            echo "== SHORT TEST SUMMARY =="
            awk '/short test summary info/{flag=1} flag' .changes/v0613-full-regression.txt | tail -500 || true
            echo
            echo "== LAST 250 LINES =="
            tail -250 .changes/v0613-full-regression.txt || true
          } > .changes/v0613-failures-summary.txt

      - name: Commit concise diagnostic summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changes/v0613-failures-summary.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: summarize v0.6.13 full regression failures"
            git push origin HEAD:work/v0613-provider-transport
          fi
