name: CBCC v0.6.13 provider transport materialize and diagnose

on:
  push:
    branches:
      - work/v0613-provider-transport

permissions:
  contents: write

jobs:
  materialize-and-diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.6.13 transport patch
        run: python .changes/stage_v0613.py

      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml

      - name: Focused provider continuity regression
        run: |
          pytest -q \
            tests/test_v0611_provider_source_binding.py \
            tests/test_v0612_provider_portability_receipt.py \
            tests/test_v0613_provider_transport_integrity.py

      - name: Capture full regression without hiding diagnostics
        shell: bash
        run: |
          set +e
          pytest -q > .changes/v0613-full-regression.txt 2>&1
          rc=$?
          set -e
          echo "$rc" > .changes/v0613-full-regression.rc
          cat .changes/v0613-full-regression.txt
          echo "FULL_REGRESSION_RC=$rc"

      - name: Materialize patch and diagnostic evidence on work branch
        run: |
          rm -f .changes/v0613.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize CBCC v0.6.13 provider transport diagnostics"
          git push origin HEAD:work/v0613-provider-transport
