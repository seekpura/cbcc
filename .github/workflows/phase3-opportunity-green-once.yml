name: one-shot-phase3-opportunity-green

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-opportunity-green-once.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Phase 3 focused GREEN
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_v0676_phase3_opportunity_family_evaluation.py
