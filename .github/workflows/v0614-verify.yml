name: CBCC v0.6.14 provider executor verification

on:
  push:
    branches:
      - work/v0614-provider-executor

permissions:
  contents: read

jobs:
  verify-provider-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Run v0.6.14 executor lifecycle tests
        run: |
          pytest -q \
            tests/test_v0613_provider_transport_integrity.py \
            tests/test_v0614_provider_executor_lifecycle.py
