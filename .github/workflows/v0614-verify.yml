name: CBCC v0.6.14 provider executor verification

on:
  push:
    branches:
      - work/v0614-provider-executor

permissions:
  contents: write

jobs:
  verify-provider-executor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply execution transmission lineage patch
        run: python .changes/v0614_transmission_lineage_patch.py
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Run v0.6.14 executor lifecycle tests and capture diagnostics
        shell: bash
        run: |
          mkdir -p .changes
          set +e
          pytest -q -ra \
            tests/test_v0613_provider_transport_integrity.py \
            tests/test_v0614_provider_executor_lifecycle.py \
            > .changes/v0614-test-output.txt 2>&1
          rc=$?
          set -e
          echo "$rc" > .changes/v0614-test-output.rc
          cat .changes/v0614-test-output.txt
      - name: Commit implementation and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/cbcc/provider_executor.py runtime/cbcc/provider_transport.py .changes/v0614-test-output.txt .changes/v0614-test-output.rc
          if ! git diff --cached --quiet; then
            git commit -m "fix: bind executor transmission to portable parent lineage"
            git push origin HEAD:work/v0614-provider-executor
          fi
      - name: Enforce targeted test result
        if: always()
        shell: bash
        run: test "$(cat .changes/v0614-test-output.rc)" = "0"
