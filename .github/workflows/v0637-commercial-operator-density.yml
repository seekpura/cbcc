name: v0.6.37 Commercial Operator Density

on:
  push:
    branches:
      - v0.6.37-commercial-operator-density
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-test-commit:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply v0.6.37 authority migration
        run: |
          python scripts/apply_v0637_commercial_operator_density.py
          python scripts/apply_v0637_commercial_operator_density.py

      - name: Compile runtime
        run: python -m compileall -q runtime/cbcc

      - name: Run v0.6.37 authority tests
        run: |
          python -m pytest -q tests/test_v0637_commercial_operator_density.py
          python -m pytest -q tests/test_v0637_operator_execution_board.py
          python -m pytest -q tests/test_v0637_video_narrative.py
          python -m pytest -q tests/test_v0637_prompt_activation.py

      - name: Run forward-compatible model-native regression
        run: python -m pytest -q tests/test_v0631_model_native_prompt_contract.py

      - name: Run smoke suites
        run: |
          python tests/run_smoke.py
          python tests/run_toolkit_smoke.py

      - name: Verify authority sources and activation
        run: |
          grep -q '0.6.37-commercial-operator-density' SKILL.md
          grep -q 'PROMPT-SEVEN-TOOLS' prompts/registry.json
          grep -q 'PROMPT-COMMERCIAL-INTEGRATED-VISUAL' prompts/registry.json
          grep -q 'PROMPT-COMMERCIAL-VIDEO' prompts/registry.json
          grep -q 'PROMPT-OPERATOR-EXECUTION-DENSITY' prompts/registry.json
          grep -q 'PROMPT-SEVEN-TOOLS' runtime/cbcc/strategy_sources.py
          grep -q 'PROMPT-COMMERCIAL-INTEGRATED-VISUAL' runtime/cbcc/strategy_sources.py
          grep -q 'PROMPT-OPERATOR-EXECUTION-DENSITY' runtime/cbcc/strategy_sources.py
          grep -q 'PROMPT-COMMERCIAL-VIDEO' runtime/cbcc/strategy_sources.py
          grep -q 'fixed_five_beat_template' runtime/cbcc/video_creator.py
          grep -q 'commercial_operator_density_authority' runtime/cbcc/__init__.py
          grep -q 'build_operator_execution_board' runtime/cbcc/compiler.py
          grep -q 'inject_operator_execution' runtime/cbcc/delivery_workspace.py
          grep -q 'AUTONOMOUS_INTEGRATED_RENDER_DEFAULT' runtime/cbcc/commercial_operator_density_authority.py
          if grep -n "return 'UNRESOLVED_AGENT_DECISION'" runtime/cbcc/model_native_prompt_contract.py; then
            echo 'legacy unresolved copy-render gate still present' >&2
            exit 1
          fi

      - name: Commit applied migration
        run: |
          if git diff --quiet; then
            echo 'No migration diff to commit.'
            exit 0
          fi
          git config user.name 'cbcc-release-bot'
          git config user.email 'cbcc-release-bot@users.noreply.github.com'
          git add SKILL.md prompts/registry.json runtime/cbcc/__init__.py runtime/cbcc/prompt_compiler.py runtime/cbcc/model_native_prompt_contract.py runtime/cbcc/reference_guided_native_authority.py runtime/cbcc/tools/seven_agent.py runtime/cbcc/strategy_sources.py runtime/cbcc/video_creator.py runtime/cbcc/compiler.py runtime/cbcc/delivery_workspace.py
          git commit -m 'release: apply v0.6.37 commercial operator density authority [skip ci]'
          git push origin HEAD:v0.6.37-commercial-operator-density
