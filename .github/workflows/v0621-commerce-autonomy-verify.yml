name: CBCC v0.6.21 Commerce Agent Autonomy release verification

on:
  push:
    branches:
      - work/v0621-commerce-agent-autonomy

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture current main baseline
        shell: bash
        run: |
          git fetch origin main
          mkdir -p .changes
          git rev-parse origin/main > .changes/v0621-main-base.sha
          cat .changes/v0621-main-base.sha
      - name: Apply autonomy implementation and release documentation
        run: |
          python .changes/v0621_commerce_autonomy_patch.py
          python .changes/v0621_commerce_autonomy_round2.py
          python .changes/v0621_release_docs.py
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Verify v0.6.21 autonomy contracts
        shell: bash
        run: |
          set +e
          pytest -q -ra \
            tests/test_v0621_commerce_agent_autonomy.py \
            tests/test_v0621_agent_replan_and_frameworks.py \
            tests/test_v0621_relevance_driven_photography.py \
            > .changes/v0621-targeted.txt 2>&1
          rc=$?
          set -e
          echo "$rc" > .changes/v0621-targeted.rc
          cat .changes/v0621-targeted.txt
          test "$rc" = "0"
      - name: Run full branch regression
        shell: bash
        run: |
          set +e
          pytest -q -ra --tb=no > .changes/v0621-branch-full.txt 2>&1
          rc=$?
          set -e
          echo "$rc" > .changes/v0621-branch-full.rc
          tail -n 80 .changes/v0621-branch-full.txt
      - name: Run full current-main baseline
        shell: bash
        run: |
          BASE_SHA="$(cat .changes/v0621-main-base.sha)"
          git worktree add --detach /tmp/cbcc-main "$BASE_SHA"
          set +e
          (cd /tmp/cbcc-main && PYTHONPATH=runtime pytest -q -ra --tb=no) > "$GITHUB_WORKSPACE/.changes/v0621-main-full.txt" 2>&1
          rc=$?
          set -e
          echo "$rc" > .changes/v0621-main-full.rc
          tail -n 80 .changes/v0621-main-full.txt
      - name: Compare failure node-id sets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          def failure_ids(path):
              out=set()
              for line in Path(path).read_text(encoding='utf-8', errors='replace').splitlines():
                  m=re.match(r'^(?:FAILED|ERROR)\s+([^\s]+)', line.strip())
                  if m:
                      out.add(m.group(1))
              return out

          branch=failure_ids('.changes/v0621-branch-full.txt')
          main=failure_ids('.changes/v0621-main-full.txt')
          branch_rc=int(Path('.changes/v0621-branch-full.rc').read_text().strip())
          main_rc=int(Path('.changes/v0621-main-full.rc').read_text().strip())
          new=sorted(branch-main)
          infrastructure=[]
          if branch_rc not in (0,1):
              infrastructure.append(f'BRANCH_PYTEST_EXIT_{branch_rc}')
          if main_rc not in (0,1):
              infrastructure.append(f'MAIN_PYTEST_EXIT_{main_rc}')
          if branch_rc == 1 and not branch:
              infrastructure.append('BRANCH_FAILURE_WITHOUT_PARSEABLE_NODE_ID')
          report={
              'main_base_sha':Path('.changes/v0621-main-base.sha').read_text().strip(),
              'branch_pytest_rc':branch_rc,
              'main_pytest_rc':main_rc,
              'branch_failure_count':len(branch),
              'main_failure_count':len(main),
              'new_failure_count':len(new),
              'new_failures':new,
              'branch_failures':sorted(branch),
              'main_failures':sorted(main),
              'infrastructure_errors':infrastructure,
          }
          Path('.changes/v0621-regression-delta.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if new or infrastructure:
              raise SystemExit(1)
          PY
      - name: Reject stale main baseline
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(cat .changes/v0621-main-base.sha)"
      - name: Remove temporary staging diagnostics and workflow
        shell: bash
        run: |
          rm -rf .changes
          rm -f .github/workflows/v0621-commerce-autonomy-verify.yml
      - name: Finalize clean v0.6.21 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize CBCC v0.6.21 commerce agent autonomy"
          git push origin HEAD:work/v0621-commerce-agent-autonomy
