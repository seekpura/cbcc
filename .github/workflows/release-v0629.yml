name: CBCC human-delivery release acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0629.yml'
      - 'SKILL.md'
      - 'scripts/build_plugin_dist.py'
      - 'scripts/build_dist.py'
      - 'builders/project_delivery_builder.py'
      - 'runtime/cbcc/delivery_export.py'
      - 'runtime/cbcc/delivery_workspace.py'
      - 'runtime/cbcc/delivery_html.py'
      - 'runtime/cbcc/delivery_contract.py'
      - 'runtime/cbcc/human_delivery.py'
      - 'runtime/cbcc/human_language_delivery.py'
      - 'runtime/cbcc/strategy_depth.py'
      - 'runtime/cbcc/prompt_compiler.py'
      - 'runtime/cbcc/asset_compiler.py'
      - 'runtime/cbcc/creative.py'
      - 'runtime/cbcc/providers.py'
      - 'runtime/cbcc/production.py'
      - 'runtime/cbcc/video_creator.py'
      - 'runtime/cbcc/tools/seven_agent.py'
      - 'runtime/cbcc/cli.py'
      - 'references/FINAL_OUTPUT_CONTRACT.md'
      - 'references/capability_ledger.yaml'
      - 'tests/test_delivery_release_acceptance.py'
      - 'tests/test_human_language_delivery_contract.py'
      - 'tests/test_full_strategy_hard_contract.py'
      - 'tests/test_full_delivery_last_mile.py'
      - 'tests/test_prompt_execution_decision_preservation.py'
      - 'tests/test_v0624_strategy_asset_scope.py'
      - 'tests/test_v0625_decision_question_authority.py'
      - 'tests/test_v066_human_workspace_zh_first.py'
      - 'tests/test_v067_workspace_information_architecture.py'
      - 'tests/test_reference_guided_optional_prompt_and_capability_continuity.py'
      - 'tests/test_reference_guided_video_provider_authority.py'
      - 'tests/test_v060_capability_complete_rebase.py'
      - 'tests/test_v0511_integration_quality_depth.py'
      - 'tests/test_capability_contracts.py'
      - 'tests/run_toolkit_smoke.py'
      - 'README.md'
      - 'INSTALL.md'
      - 'requirements-runtime.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt pytest

      - name: Smoke validators
        run: bash tests/run_smoke.sh

      - name: FULL strategy depth and task-scoped autonomy coexist
        env:
          PYTHONPATH: runtime
        run: |
          pytest -q \
            tests/test_full_strategy_hard_contract.py \
            tests/test_v0624_strategy_asset_scope.py \
            tests/test_v0625_decision_question_authority.py
          grep -q 'FULL vs TASK_SCOPED Delivery Authority' SKILL.md
          grep -q 'FULL Decision-Depth + Prompt Execution Continuity' SKILL.md
          grep -q 'C 级证据不得形成硬宣称' SKILL.md
          grep -q 'RACE=Research → Action → Communication → Evaluation' SKILL.md

      - name: Prompt execution decision preservation
        env:
          PYTHONPATH: runtime
        run: pytest -q tests/test_prompt_execution_decision_preservation.py

      - name: FULL human artifact last-mile acceptance
        env:
          PYTHONPATH: runtime
        run: pytest -q tests/test_full_delivery_last_mile.py

      - name: Chinese-base human language delivery contract
        env:
          PYTHONPATH: runtime
        run: |
          pytest -q tests/test_human_language_delivery_contract.py
          grep -q '人类语言交付 Gate' references/FINAL_OUTPUT_CONTRACT.md
          grep -q 'HUMAN_LANGUAGE_AUDIT.json' runtime/cbcc/delivery_export.py
          grep -q 'FOREIGN_ASSET_COPY_WITHOUT_CN_COMPANION' runtime/cbcc/human_language_delivery.py
          grep -q 'FOREIGN_LISTING_COPY_WITHOUT_CN_COMPANION' runtime/cbcc/human_language_delivery.py
          grep -q 'Listing 人类字段标题必须中文在前' scripts/build_plugin_dist.py
          grep -q '所有英文/马来文/阿语等目标市场外文' scripts/build_plugin_dist.py
          grep -q '宿主原生 Artifact 交付也必须执行同等检查' scripts/build_plugin_dist.py

      - name: Human delivery authority and workspace semantics
        env:
          PYTHONPATH: runtime
        run: |
          pytest -q \
            tests/test_v066_human_workspace_zh_first.py \
            tests/test_v067_workspace_information_architecture.py \
            tests/test_delivery_release_acceptance.py

      - name: Current-scope continuity
        env:
          PYTHONPATH: runtime
        run: |
          pytest -q \
            tests/test_v0627_current_scope_completion.py \
            tests/test_v0628_agent_frontier_scope.py \
            tests/test_v0629_final_stabilization.py

      - name: Reference-guided production and reference-capability continuity
        env:
          PYTHONPATH: runtime
        run: |
          pytest -q \
            tests/test_reference_guided_optional_prompt_and_capability_continuity.py \
            tests/test_reference_guided_video_provider_authority.py \
            tests/test_v060_capability_complete_rebase.py \
            tests/test_v0511_integration_quality_depth.py \
            tests/test_capability_contracts.py
          python tests/run_toolkit_smoke.py
          grep -q 'Product Reference / Fidelity — current authority' SKILL.md
          grep -q 'Prompt Consumption Audit 是生产质量诊断，不是项目或资产完整度的全局阻断 Gate' SKILL.md
          grep -q '七大第一类工具' SKILL.md
          grep -q 'compile_seven_agent_synthesis' runtime/cbcc/tools/seven_agent.py
          grep -q 'OPTIONAL_PRODUCTION_FILES' runtime/cbcc/asset_compiler.py
          grep -q "project_completion_blocking':False" runtime/cbcc/delivery_export.py

      - name: Build Plugin and Skill archives
        run: python scripts/build_plugin_dist.py --output-dir dist

      - name: Build Runtime archive
        run: python scripts/build_dist.py dist/cross-border-commerce-creative-runtime-v0.6.29.zip

      - name: Verify release versions and delivery contract
        run: |
          test "$(cat VERSION)" = "0.6.29-final-stabilization"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('dist/release_manifest.json').read_text(encoding='utf-8'))
          assert d['version']=='0.6.29', d
          assert d['source_version']=='0.6.29-final-stabilization', d
          c=d.get('delivery_contract') or {}
          required={
              'complete_html_required':True,
              'artifact_required_for_full_task':True,
              'object_based_asset_workspace':True,
              'chat_only_completion_forbidden':True,
              'full_nine_domain_decision_depth_required':True,
              'prompt_consumption_audit_required':True,
              'prompt_consumption_blocks_project_completion':False,
              'product_source_default_reference_guided':True,
              'photorealism_default_required':False,
              'seven_agent_capability_continuity_required':True,
              'host_custom_short_report_cannot_substitute_full_delivery':True,
          }
          missing={k:v for k,v in required.items() if c.get(k) is not v}
          assert not missing, {'missing_delivery_contract_flags':missing,'actual':c}
          print('release + FULL depth + reference-guided nonblocking production + capability continuity contract PASS')
          PY

      - name: Verify packaged source contains real delivery and FULL authority
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('dist/cross-border-commerce-creative-plugin-v0.6.29.zip')
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              skill_root='cross-border-commerce-creative/skills/cross-border-commerce-creative/'
              root=skill_root+'resources/'
              required=[
                  skill_root+'SKILL.md',
                  root+'SKILL.md',
                  root+'references/FINAL_OUTPUT_CONTRACT.md',
                  root+'runtime/cbcc/delivery_export.py',
                  root+'runtime/cbcc/delivery_workspace.py',
                  root+'runtime/cbcc/delivery_html.py',
                  root+'runtime/cbcc/delivery_contract.py',
                  root+'runtime/cbcc/human_language_delivery.py',
                  root+'runtime/cbcc/strategy_depth.py',
                  root+'runtime/cbcc/prompt_compiler.py',
                  root+'runtime/cbcc/asset_compiler.py',
                  root+'runtime/cbcc/providers.py',
                  root+'runtime/cbcc/production.py',
                  root+'runtime/cbcc/video_creator.py',
                  root+'runtime/cbcc/tools/seven_agent.py',
                  root+'builders/project_delivery_builder.py',
                  root+'tests/test_delivery_release_acceptance.py',
                  root+'tests/test_human_language_delivery_contract.py',
                  root+'tests/test_full_strategy_hard_contract.py',
                  root+'tests/test_full_delivery_last_mile.py',
                  root+'tests/test_prompt_execution_decision_preservation.py',
                  root+'tests/test_reference_guided_optional_prompt_and_capability_continuity.py',
                  root+'tests/test_reference_guided_video_provider_authority.py',
                  root+'tests/test_v060_capability_complete_rebase.py',
                  root+'tests/test_v0511_integration_quality_depth.py',
                  root+'tests/test_capability_contracts.py',
              ]
              missing=[x for x in required if x not in names]
              assert not missing, missing
              wrapper=z.read(skill_root+'SKILL.md').decode('utf-8')
              skill=z.read(root+'SKILL.md').decode('utf-8')
              final_contract=z.read(root+'references/FINAL_OUTPUT_CONTRACT.md').decode('utf-8')
              export=z.read(root+'runtime/cbcc/delivery_export.py').decode('utf-8')
              language=z.read(root+'runtime/cbcc/human_language_delivery.py').decode('utf-8')
              prompt=z.read(root+'runtime/cbcc/prompt_compiler.py').decode('utf-8')
              asset_compiler=z.read(root+'runtime/cbcc/asset_compiler.py').decode('utf-8')
              production=z.read(root+'runtime/cbcc/production.py').decode('utf-8')
              seven=z.read(root+'runtime/cbcc/tools/seven_agent.py').decode('utf-8')
              assert 'FULL vs TASK_SCOPED Delivery Authority' in skill
              assert 'FULL Decision-Depth + Prompt Execution Continuity' in skill
              assert 'Product Reference / Fidelity — current authority' in skill
              assert 'C 级证据不得形成硬宣称' in skill
              assert 'Listing 人类字段标题必须中文在前' in wrapper
              assert '任何英文/马来文/阿语等目标市场外文内容' in wrapper
              assert '宿主原生 Artifact 交付也必须执行同等检查' in wrapper
              assert 'Product Reference / Production Authority' in wrapper
              assert 'Prompt、生图方案、摄影/灯光/Prelight 是能力与生产准备度，不是项目或资产完整度的全局 Gate' in wrapper
              assert '人类语言交付 Gate' in final_contract
              assert 'HUMAN_LANGUAGE_AUDIT.json' in export
              assert 'FOREIGN_ASSET_COPY_WITHOUT_CN_COMPANION' in language
              assert 'FOREIGN_LISTING_COPY_WITHOUT_CN_COMPANION' in language
              assert 'FULL_DELIVERY_DEPTH_AUDIT.json' in export
              assert 'PROMPT_CONSUMPTION_AUDIT.json' in export
              assert "project_completion_blocking':False" in export
              assert '_prompt_consumption_audit' in prompt
              assert 'CANONICAL_PROMPT_COMPILED_EXECUTION_PRESERVING' in prompt
              assert 'REFERENCE_GUIDED' in prompt
              assert 'OPTIONAL_PRODUCTION_FILES' in asset_compiler
              assert "_REAL_PRODUCT_MODES={'REAL_PHOTO','REAL_PRODUCT_COMPOSITE','AI_ENVIRONMENT_REAL_PRODUCT','AI_HUMAN_REAL_PRODUCT'}" in production
              assert 'compile_seven_agent_synthesis' in seven
          print('packaged delivery + Chinese language + reference-guided nonblocking production + reference capability continuity PASS')
          PY

      - name: Write SHA256 sums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbcc-v0.6.29-reference-guided-capability-repair
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/release_manifest.json
          if-no-files-found: error

      - name: Refresh GitHub Release assets after acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.29 >/dev/null 2>&1; then
            gh release upload v0.6.29 dist/*.zip dist/SHA256SUMS.txt dist/release_manifest.json --clobber
          else
            gh release create v0.6.29 \
              dist/*.zip dist/SHA256SUMS.txt dist/release_manifest.json \
              --target "$GITHUB_SHA" \
              --title "CBCC v0.6.29 — Human Delivery Repaired" \
              --notes-file CHANGELOG_V0629.md
          fi
