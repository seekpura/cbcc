name: CBCC v0.6.29 release package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0629.yml'
      - 'scripts/build_plugin_dist.py'
      - 'README.md'
      - 'INSTALL.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Smoke validators
        run: bash tests/run_smoke.sh

      - name: v0.6.27-v0.6.29 release continuity
        run: |
          pytest -q \
            tests/test_v0627_completion_authority.py \
            tests/test_v0628_agent_frontier.py \
            tests/test_v0629_final_stabilization.py

      - name: Build Plugin and Skill archives
        run: python scripts/build_plugin_dist.py --output-dir dist

      - name: Build Runtime archive
        run: python scripts/build_dist.py dist/cross-border-commerce-creative-runtime-v0.6.29.zip

      - name: Verify release versions
        run: |
          test "$(cat VERSION)" = "0.6.29-final-stabilization"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('dist/release_manifest.json').read_text(encoding='utf-8'))
          assert d['version']=='0.6.29', d
          assert d['source_version']=='0.6.29-final-stabilization', d
          print('release version contract PASS')
          PY

      - name: Write SHA256 sums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbcc-v0.6.29-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/release_manifest.json
          if-no-files-found: error

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.29 >/dev/null 2>&1; then
            gh release upload v0.6.29 dist/*.zip dist/SHA256SUMS.txt dist/release_manifest.json --clobber
          else
            gh release create v0.6.29 \
              dist/*.zip dist/SHA256SUMS.txt dist/release_manifest.json \
              --target "$GITHUB_SHA" \
              --title "CBCC v0.6.29 — Final Stabilization" \
              --notes-file CHANGELOG_V0629.md
          fi
