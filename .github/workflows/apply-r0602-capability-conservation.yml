name: Apply R06-02 capability conservation repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-r0602-capability-conservation.yml'
      - 'scripts/apply_r0602_capability_conservation_patch.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact repair
        run: python scripts/apply_r0602_capability_conservation_patch.py
      - name: Verify syntax and focused RED-to-GREEN behavior
        env:
          PYTHONPATH: '.:runtime'
        run: |
          python -m pip install pyyaml pytest
          python -m py_compile runtime/cbcc/compiler.py
          pytest -q tests/test_v0682_r0602_capability_conservation.py
      - name: Commit repaired runtime only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/cbcc/compiler.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(r06-02): derive culture capability activation from runtime truth'
          git push origin HEAD:main
