name: Phase 5 REQ-083 Temporal Continuity RED

on:
  push:
    branches: [phase5-req083-temporal-continuity]
    paths:
      - '.github/workflows/phase5-req083-red.yml'
      - '.github/phase5_req083_red_trigger.txt'
      - 'tests/test_v0679_phase5_req083_temporal_surface_continuity.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q pytest pyyaml pillow
      - name: Run REQ-083 focused RED
        run: pytest -q tests/test_v0679_phase5_req083_temporal_surface_continuity.py
