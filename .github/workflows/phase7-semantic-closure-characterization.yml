name: phase7-semantic-closure-characterization

on:
  push:
    branches:
      - repair-04-phase7-full-materialization
  workflow_dispatch:

jobs:
  phase7-semantic-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install focused verification dependencies
        run: python -m pip install pyyaml pytest
      - name: Verify Phase 7 final package semantic closure
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: python -m pytest -q tests/test_v0681_phase7_final_package_semantic_closure.py
