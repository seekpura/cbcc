name: one-shot-phase3-runtime-red

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-runtime-red-once.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Phase 3 runtime RED
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_v0676_phase3_opportunity_family_runtime_binding.py
