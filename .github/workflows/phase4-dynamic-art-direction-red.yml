name: phase4-dynamic-art-direction-red

on:
  push:
    paths:
      - 'tests/test_v0676_phase4_dynamic_surface_art_direction.py'
      - '.github/workflows/phase4-dynamic-art-direction-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase4-dynamic-art-direction-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
          python -m pip install -e .
      - name: Run dynamic Surface-native Art Direction RED
        run: pytest -q tests/test_v0676_phase4_dynamic_surface_art_direction.py
