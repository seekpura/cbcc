name: CBCC v0.6.35 Native-Reference Provider Integrity Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0635.yml'
      - 'VERSION'
      - 'SKILL.md'
      - 'CHANGELOG_V0635.md'
      - 'runtime/cbcc/providers.py'
      - 'runtime/cbcc/production.py'
      - 'runtime/cbcc/provider_portability.py'
      - 'runtime/cbcc/provider_executor.py'
      - 'runtime/cbcc/provider_bridge.py'
      - 'runtime/cbcc/reference_guided_native_authority.py'
      - 'runtime/cbcc/asset_universe_authority.py'
      - 'runtime/cbcc/delivery_html.py'
      - 'scripts/build_plugin_dist.py'
      - 'tests/test_v0635_native_reference_provider_integrity.py'
      - 'tests/test_v0612_provider_portability_receipt.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v0635:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:runtime
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt pytest

      - name: Verify active v0.6.35 authority
        run: |
          test "$(cat VERSION)" = "0.6.35-native-reference-provider-integrity"
          grep -q '^version: 0.6.35-native-reference-provider-integrity$' SKILL.md
          ! grep -q '### Product Reference / Fidelity — current authority' SKILL.md
          grep -q 'compatibility note superseded by v0.6.35' SKILL.md
          grep -q 'REFERENCE_GUIDED_NATIVE_LOCK' SKILL.md
          grep -q 'EXACT_PIXEL_COMPOSITE' SKILL.md
          grep -q '资产宇宙没有总数上限' SKILL.md

      - name: Compile active provider and creative authority
        run: |
          python -m py_compile \
            runtime/cbcc/providers.py \
            runtime/cbcc/production.py \
            runtime/cbcc/provider_portability.py \
            runtime/cbcc/provider_executor.py \
            runtime/cbcc/provider_bridge.py \
            runtime/cbcc/reference_guided_native_authority.py \
            runtime/cbcc/asset_universe_authority.py \
            runtime/cbcc/delivery_html.py \
            scripts/build_plugin_dist.py

      - name: v0.6.35 native reference provider integrity acceptance
        run: |
          pytest -q \
            tests/test_v0635_native_reference_provider_integrity.py \
            tests/test_reference_guided_video_provider_authority.py \
            tests/test_reference_guided_optional_prompt_and_capability_continuity.py

      - name: Preserve explicit exact-pixel composite portability
        run: pytest -q tests/test_v0612_provider_portability_receipt.py

      - name: Preserve Asset Universe, prompt closure and Agent Art Direction
        run: |
          pytest -q \
            tests/test_v0634_native_reference_authority_cleanup.py \
            tests/test_v0633_reference_guided_native_asset_universe.py \
            tests/test_v0633_asset_universe_workspace.py \
            tests/test_v0633_plugin_wrapper_authority.py \
            tests/test_v0632_production_parameter_closure.py \
            tests/test_v0632_portfolio_visual_authority.py \
            tests/test_v0632_human_art_direction_visibility.py \
            tests/test_v0631_model_native_prompt_contract.py \
            tests/test_v0630_agent_art_direction_authority.py \
            tests/test_v0630_surface_agent_authority.py \
            tests/test_v0630_prompt_art_direction_projection.py \
            tests/test_v0630_agent_art_direction_e2e.py

      - name: FULL delivery continuity
        run: pytest -q tests/test_full_delivery_last_mile.py tests/test_full_strategy_hard_contract.py

      - name: Build installable Plugin and Skill archives
        run: python scripts/build_plugin_dist.py --output-dir dist
      - name: Build Runtime archive
        run: python scripts/build_dist.py dist/cross-border-commerce-creative-runtime-v0.6.35.zip

      - name: Verify packaged v0.6.35 native-reference provider integrity
        run: |
          python - <<'PY'
          import json,zipfile,re
          from pathlib import Path
          root=Path('dist')
          plugin=root/'cross-border-commerce-creative-plugin-v0.6.35.zip'
          skill=root/'cross-border-commerce-creative-skill-v0.6.35.zip'
          runtime=root/'cross-border-commerce-creative-runtime-v0.6.35.zip'
          for p in (plugin,skill,runtime):
              assert p.exists() and p.stat().st_size > 10000, p
          with zipfile.ZipFile(plugin) as z:
              r='cross-border-commerce-creative/'
              b=r+'skills/cross-border-commerce-creative/'
              manifest=json.loads(z.read(r+'plugin.json'))
              assert manifest['version']=='0.6.35'
              wrapper=z.read(b+'SKILL.md').decode('utf-8')
              authority=z.read(b+'resources/SKILL.md').decode('utf-8')
              production=z.read(b+'resources/runtime/cbcc/production.py').decode('utf-8')
              executor=z.read(b+'resources/runtime/cbcc/provider_executor.py').decode('utf-8')
              bridge=z.read(b+'resources/runtime/cbcc/provider_bridge.py').decode('utf-8')
              providers=z.read(b+'resources/runtime/cbcc/providers.py').decode('utf-8')
              universe=z.read(b+'resources/runtime/cbcc/asset_universe_authority.py').decode('utf-8')
              assert '### Product Reference / Fidelity — current authority' not in authority
              assert 'compatibility note superseded by v0.6.35' in authority
              assert 'REFERENCE_GUIDED_NATIVE_LOCK' in wrapper
              assert 'EXACT_PIXEL_COMPOSITE' in wrapper
              assert 'NATIVE_SUBJECT_REFERENCE' in production
              assert 'MODEL_REFERENCE_INPUT' in production
              assert 'reference_input_required' in production
              assert 'native_generation_required' in production
              assert "'UNVERIFIED'" in executor
              assert 'REFERENCE_IMAGE_INPUT' in bridge
              assert 'AI_REFERENCE_PRODUCT' in bridge
              prefix=providers.split('PROVIDER_REGISTRY=',1)[0]
              assert prefix.count("'AI_REFERENCE_PRODUCT':'AI_IMAGE_PROVIDER'")==1
              assert prefix.count("'AI_REFERENCE_HUMAN_PRODUCT':'AI_IMAGE_PROVIDER'")==1
              assert "'fixed_total_asset_limit':False" in universe
              assert 'Platform gallery capacity limits only the simultaneous live activation set' in universe
              assert '生成可合成底片' not in wrapper
          print('packaged v0.6.35 provider integrity PASS')
          PY

      - name: Write SHA256 sums
        run: |
          cd dist
          sha256sum \
            cross-border-commerce-creative-plugin-v0.6.35.zip \
            cross-border-commerce-creative-skill-v0.6.35.zip \
            cross-border-commerce-creative-runtime-v0.6.35.zip \
            release_manifest.json > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbcc-v0.6.35-native-reference-provider-integrity
          path: |
            dist/cross-border-commerce-creative-plugin-v0.6.35.zip
            dist/cross-border-commerce-creative-skill-v0.6.35.zip
            dist/cross-border-commerce-creative-runtime-v0.6.35.zip
            dist/release_manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release v0.6.35
        run: |
          if gh release view v0.6.35 >/dev/null 2>&1; then
            gh release upload v0.6.35 \
              dist/cross-border-commerce-creative-plugin-v0.6.35.zip \
              dist/cross-border-commerce-creative-skill-v0.6.35.zip \
              dist/cross-border-commerce-creative-runtime-v0.6.35.zip \
              dist/release_manifest.json dist/SHA256SUMS.txt --clobber
            gh release edit v0.6.35 --title 'CBCC v0.6.35 — Native-Reference Provider Integrity' --notes-file CHANGELOG_V0635.md --latest
          else
            gh release create v0.6.35 \
              dist/cross-border-commerce-creative-plugin-v0.6.35.zip \
              dist/cross-border-commerce-creative-skill-v0.6.35.zip \
              dist/cross-border-commerce-creative-runtime-v0.6.35.zip \
              dist/release_manifest.json dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title 'CBCC v0.6.35 — Native-Reference Provider Integrity' \
              --notes-file CHANGELOG_V0635.md --latest
          fi
