name: R06-05 Claim Source Eligibility RED

on:
  push:
    branches: [r06-05-claim-source-boundary-red]

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r06-05-claim-source-boundary-red
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest pyyaml openpyxl
      - name: Reproduce non-product/context claim evidence promotion
        env:
          PYTHONPATH: .:runtime
        run: >-
          python -m pytest -q
          tests/test_v0682_r0605_professional_capability_completeness.py
          tests/test_v065_saas_prompt_integrity.py::test_claim_authority_does_not_trust_labels_without_evidence
