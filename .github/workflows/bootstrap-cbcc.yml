name: Bootstrap CBCC source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check complete payload
        id: ready
        shell: bash
        run: |
          if [ ! -f .bootstrap/manifest.txt ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected_count="$(sed -n 's/^chunks=//p' .bootstrap/manifest.txt)"
          actual_count="$(find .bootstrap -maxdepth 1 -type f -name 'chunk-*' | wc -l | tr -d ' ')"
          if [ -z "$expected_count" ] || [ "$actual_count" != "$expected_count" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Materialize canonical v0.6.6 workspace
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, shutil, zipfile

          root = Path.cwd()
          chunks = sorted((root / '.bootstrap').glob('chunk-*'))
          payload = ''.join(p.read_text(encoding='utf-8') for p in chunks)
          data = base64.b64decode(payload)
          manifest = {}
          for line in (root / '.bootstrap' / 'manifest.txt').read_text(encoding='utf-8').splitlines():
              if '=' in line:
                  k, v = line.split('=', 1)
                  manifest[k.strip()] = v.strip()
          expected = manifest['sha256']
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'archive sha256 mismatch: {actual} != {expected}')

          archive = Path('/tmp/cbcc-v0.6.6.zip')
          archive.write_bytes(data)
          extract = Path('/tmp/cbcc-v0.6.6-extract')
          if extract.exists():
              shutil.rmtree(extract)
          extract.mkdir(parents=True)
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(extract)

          source = extract / 'cross-border-commerce-creative-v0.6.6-human-workspace-zh-first'
          if not source.is_dir():
              raise SystemExit('canonical workspace root not found in archive')

          for child in list(root.iterdir()):
              if child.name == '.git':
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          for child in source.iterdir():
              dest = root / child.name
              if child.is_dir():
                  shutil.copytree(child, dest)
              else:
                  shutil.copy2(child, dest)
          PY
      - name: Commit canonical source tree
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync canonical CBCC v0.6.6 human workspace"
          git push origin HEAD:main
