name: Bootstrap CBCC source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/trigger'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate payload and materialize canonical workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, shutil, tarfile

          repo = Path.cwd()
          manifest_path = repo / '.bootstrap' / 'manifest-hex.txt'
          if not manifest_path.is_file():
              raise SystemExit('missing .bootstrap/manifest-hex.txt')

          manifest = {}
          for raw in manifest_path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid manifest line: {raw!r}')
              key, value = line.split('=', 1)
              manifest[key.strip()] = value.strip()

          required_manifest = {'version', 'format', 'encoding', 'prefix', 'chunks', 'sha256', 'root'}
          missing_manifest = sorted(required_manifest - manifest.keys())
          if missing_manifest:
              raise SystemExit(f'manifest missing keys: {missing_manifest}')
          if manifest['format'] != 'tar.xz':
              raise SystemExit(f"unexpected bootstrap format: {manifest['format']}")
          if manifest['encoding'] not in {'hex', 'base64'}:
              raise SystemExit(f"unexpected bootstrap encoding: {manifest['encoding']}")

          try:
              expected_count = int(manifest['chunks'])
          except ValueError:
              raise SystemExit('manifest chunks must be an integer')
          if expected_count < 1:
              raise SystemExit('manifest chunks must be >= 1')

          prefix = manifest['prefix']
          chunks = [repo / '.bootstrap' / f'{prefix}{i:02d}' for i in range(1, expected_count + 1)]
          missing_chunks = [p.name for p in chunks if not p.is_file()]
          if missing_chunks:
              raise SystemExit(f'missing bootstrap chunks: {missing_chunks}')

          unexpected = sorted(
              p.name for p in (repo / '.bootstrap').glob(f'{prefix}*')
              if p.is_file() and p not in chunks
          )
          if unexpected:
              raise SystemExit(f'unexpected bootstrap chunks: {unexpected}')

          payload = ''.join(p.read_text(encoding='utf-8') for p in chunks)
          payload = ''.join(payload.split())
          try:
              if manifest['encoding'] == 'hex':
                  archive_bytes = bytes.fromhex(payload)
              else:
                  if len(payload) % 4:
                      raise ValueError(f'base64 payload length is not divisible by 4: {len(payload)}')
                  archive_bytes = base64.b64decode(payload, validate=True)
          except Exception as exc:
              raise SystemExit(f"invalid {manifest['encoding']} bootstrap payload: {exc}")

          digest = hashlib.sha256(archive_bytes).hexdigest()
          if digest != manifest['sha256']:
              raise SystemExit(f"archive sha256 mismatch: {digest} != {manifest['sha256']}")
          print(
              f"validated bootstrap version={manifest['version']} "
              f"encoding={manifest['encoding']} chunks={expected_count} "
              f"bytes={len(archive_bytes)} sha256={digest}"
          )

          archive = Path('/tmp/cbcc-bootstrap.tar.xz')
          archive.write_bytes(archive_bytes)
          extract = Path('/tmp/cbcc-bootstrap-extract')
          if extract.exists():
              shutil.rmtree(extract)
          extract.mkdir(parents=True)

          with tarfile.open(archive, mode='r:xz') as tf:
              try:
                  tf.extractall(extract, filter='data')
              except TypeError:
                  tf.extractall(extract)

          source = extract / manifest['root']
          if not source.is_dir():
              raise SystemExit(f"canonical workspace root not found: {manifest['root']}")

          required_source = ['VERSION', 'SKILL.md', 'runtime', 'references', 'tests']
          missing_source = [name for name in required_source if not (source / name).exists()]
          if missing_source:
              raise SystemExit(f'bootstrap workspace missing required paths: {missing_source}')

          version = (source / 'VERSION').read_text(encoding='utf-8').strip()
          if version != manifest['version']:
              raise SystemExit(f"VERSION mismatch: {version} != {manifest['version']}")

          for child in list(repo.iterdir()):
              if child.name == '.git':
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          for child in source.iterdir():
              dest = repo / child.name
              if child.is_dir():
                  shutil.copytree(child, dest)
              else:
                  shutil.copy2(child, dest)
          print(f"materialized canonical workspace: {manifest['root']}")
          PY

      - name: Commit canonical source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: materialize canonical CBCC v0.6.7 source"
          git push origin HEAD:main
