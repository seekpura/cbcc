name: Bootstrap CBCC source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check complete payload
        id: ready
        shell: bash
        run: |
          chunk_count="$(find .bootstrap -maxdepth 1 -type f -name 'chunk-*' | wc -l | tr -d ' ')"
          if [ "$chunk_count" -lt 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "chunk_count=$chunk_count" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Materialize canonical v0.6.6 workspace
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, shutil, tarfile

          root = Path.cwd()
          chunks = sorted((root / '.bootstrap').glob('chunk-*'))
          if not chunks:
              raise SystemExit('no bootstrap chunks found')

          payload = ''.join(p.read_text(encoding='utf-8') for p in chunks)
          try:
              data = base64.b64decode(payload, validate=True)
          except Exception as exc:
              raise SystemExit(f'invalid bootstrap base64 payload: {exc}')

          digest = hashlib.sha256(data).hexdigest()
          print(f'bootstrap archive sha256={digest} chunks={len(chunks)} bytes={len(data)}')

          manifest_path = root / '.bootstrap' / 'manifest.txt'
          if manifest_path.exists():
              manifest = {}
              for line in manifest_path.read_text(encoding='utf-8').splitlines():
                  if '=' in line:
                      k, v = line.split('=', 1)
                      manifest[k.strip()] = v.strip()
              expected_count = manifest.get('chunks')
              if expected_count and int(expected_count) != len(chunks):
                  raise SystemExit(f'chunk count mismatch: {len(chunks)} != {expected_count}')
              expected_sha = manifest.get('sha256')
              if expected_sha and digest != expected_sha:
                  raise SystemExit(f'archive sha256 mismatch: {digest} != {expected_sha}')
              expected_format = manifest.get('format')
              if expected_format and expected_format != 'tar.xz':
                  raise SystemExit(f'unexpected bootstrap format: {expected_format}')

          archive = Path('/tmp/cbcc-v0.6.6.tar.xz')
          archive.write_bytes(data)
          extract = Path('/tmp/cbcc-v0.6.6-extract')
          if extract.exists():
              shutil.rmtree(extract)
          extract.mkdir(parents=True)

          try:
              with tarfile.open(archive, mode='r:xz') as tf:
                  try:
                      tf.extractall(extract, filter='data')
                  except TypeError:
                      tf.extractall(extract)
          except Exception as exc:
              raise SystemExit(f'bootstrap archive is not a readable tar.xz: {exc}')

          preferred = extract / 'cross-border-commerce-creative-v0.6.6-human-workspace-zh-first'
          if preferred.is_dir():
              source = preferred
          else:
              dirs = [p for p in extract.iterdir() if p.is_dir()]
              if len(dirs) != 1:
                  raise SystemExit('canonical workspace root not found in archive')
              source = dirs[0]

          required = ['SKILL.md', 'runtime', 'references']
          missing = [name for name in required if not (source / name).exists()]
          if missing:
              raise SystemExit(f'bootstrap workspace missing required paths: {missing}')

          for child in list(root.iterdir()):
              if child.name == '.git':
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          for child in source.iterdir():
              dest = root / child.name
              if child.is_dir():
                  shutil.copytree(child, dest)
              else:
                  shutil.copy2(child, dest)
          PY

      - name: Commit canonical source tree
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync canonical CBCC v0.6.6 human workspace"
          git push origin HEAD:main
