name: Bootstrap CBCC source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check complete payload
        id: ready
        shell: bash
        run: |
          for f in .bootstrap/chunk-01 .bootstrap/chunk-02 .bootstrap/chunk-03 .bootstrap/chunk-04 .bootstrap/manifest.txt; do
            if [ ! -f "$f" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Materialize canonical v0.6.6 workspace
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, shutil, zipfile

          root = Path.cwd()
          chunks = [root / '.bootstrap' / f'chunk-{i:02d}' for i in range(1, 5)]
          payload = ''.join(p.read_text(encoding='utf-8') for p in chunks)
          data = base64.b64decode(payload)
          expected = (root / '.bootstrap' / 'manifest.txt').read_text(encoding='utf-8').strip().split('=', 1)[1]
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'archive sha256 mismatch: {actual} != {expected}')

          archive = Path('/tmp/cbcc-v0.6.6.zip')
          archive.write_bytes(data)
          extract = Path('/tmp/cbcc-v0.6.6-extract')
          if extract.exists():
              shutil.rmtree(extract)
          extract.mkdir(parents=True)
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(extract)

          source = extract / 'cross-border-commerce-creative-v0.6.6-human-workspace-zh-first'
          if not source.is_dir():
              raise SystemExit('canonical workspace root not found in archive')

          for child in list(root.iterdir()):
              if child.name == '.git':
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          for child in source.iterdir():
              dest = root / child.name
              if child.is_dir():
                  shutil.copytree(child, dest)
              else:
                  shutil.copy2(child, dest)
          PY
      - name: Commit canonical source tree
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync canonical CBCC v0.6.6 human workspace"
          git push origin HEAD:main
