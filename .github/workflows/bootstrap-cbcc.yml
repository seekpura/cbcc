name: Recover CBCC canonical source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/plugin-release-trigger'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download CBCC v0.6.7 plugin release and reconstruct canonical source
        shell: bash
        env:
          PLUGIN_ARCHIVE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-98f0-81fd-bba4-c723f58db414/raw?se=2026-10-28T10%3A24%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=814d00cc-500d-5611-b1a0-c22251f5e028&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T11%3A52%3A42Z&ske=2026-10-28T11%3A52%3A42Z&sks=b&skv=2026-02-06&sig=6cWYnf%2B5ELkKaJeBX0FUmvJnIRzHIQ%2BtGz2x7rpZwBw%3D'
        run: |
          set -euo pipefail
          rm -rf /tmp/cbcc-plugin /tmp/cbcc-source
          mkdir -p /tmp/cbcc-plugin /tmp/cbcc-source
          curl --fail --location --retry 3 --retry-delay 1 "$PLUGIN_ARCHIVE_URL" -o /tmp/cbcc-plugin.tar.gz
          tar -xzf /tmp/cbcc-plugin.tar.gz -C /tmp/cbcc-plugin

          RESOURCES="$(find /tmp/cbcc-plugin -type d -path '*/skills/cross-border-commerce-creative/resources' -print -quit)"
          if [ -z "$RESOURCES" ] || [ ! -d "$RESOURCES" ]; then
            echo 'CBCC resources directory not found in plugin release' >&2
            find /tmp/cbcc-plugin -maxdepth 5 -type d -print
            exit 1
          fi

          cp -a "$RESOURCES"/. /tmp/cbcc-source/
          AUTHORITY=/tmp/cbcc-source/SKILL_AUTHORITY_v0.6.7.md
          if [ ! -f "$AUTHORITY" ]; then
            echo 'missing SKILL_AUTHORITY_v0.6.7.md' >&2
            exit 1
          fi
          cp "$AUTHORITY" /tmp/cbcc-source/SKILL.md
          rm -f "$AUTHORITY"

          test "$(tr -d '\r\n ' < /tmp/cbcc-source/VERSION)" = '0.6.7'
          test -f /tmp/cbcc-source/SKILL.md
          test -f /tmp/cbcc-source/CURRENT_HANDOFF.md
          test -f /tmp/cbcc-source/runtime/cbcc/delivery_html.py
          test -d /tmp/cbcc-source/references
          test -d /tmp/cbcc-source/tests

          python - <<'PY'
          from pathlib import Path
          root = Path('/tmp/cbcc-source')
          files = [p for p in root.rglob('*') if p.is_file()]
          print(f'validated canonical source: files={len(files)} version={(root / "VERSION").read_text().strip()}')
          if len(files) < 490:
              raise SystemExit(f'unexpectedly small canonical source: {len(files)} files')
          PY

      - name: Replace bootstrap repository with canonical source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/cbcc-source/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: recover canonical CBCC v0.6.7 source tree'
          git push origin HEAD:main
