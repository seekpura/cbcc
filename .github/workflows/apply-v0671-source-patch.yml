name: apply-v0671-source-patch

on:
  push:
    branches: [v0671-final-delivery-closure]
    paths:
      - '.github/v0671_patch_chunk_*.b64'
      - '.github/workflows/apply-v0671-source-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0671-final-delivery-closure
          fetch-depth: 0
      - name: Apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v0671_patch_chunk_*.b64 | base64 -d > /tmp/v0671_source_patch.tar.gz
          echo "d8ebae6a7822eb37dc11db842fcb898b3ceebf2174353e3c3628b403b33624e5  /tmp/v0671_source_patch.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v0671_source_patch.tar.gz
          rm .github/v0671_patch_chunk_*.b64
          rm .github/workflows/apply-v0671-source-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.6.71: final delivery closure"
          git push origin HEAD:v0671-final-delivery-closure
