name: phase6-req089-characterization

on:
  push:
    branches:
      - repair-04-phase6-req061
  workflow_dispatch:

jobs:
  req089-characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install focused verification dependencies
        run: python -m pip install pyyaml pytest
      - name: Verify REQ-089 routed canonical Human Workspace
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: python -m pytest -q tests/test_v0680_phase6_req089_routed_canonical_workspace.py
