name: CBCC v0.6.21 release verification

on:
  push:
    branches:
      - work/v0621-mcp-streamable-http

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure shared MCP protocol processor
        run: python .changes/v0621_protocol_refactor.py
      - name: Apply Streamable HTTP protocol hardening
        run: python .changes/v0621_http_hardening.py
      - name: Apply release documentation
        run: python .changes/v0621_release_patch.py
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Verify continuity through v0.6.21
        shell: bash
        run: |
          mkdir -p .changes
          pytest -q -ra \
            tests/test_v0613_provider_transport_integrity.py \
            tests/test_v0614_provider_executor_lifecycle.py \
            tests/test_v0615_provider_executor_bridge.py \
            tests/test_v0615_provider_contract_bridge.py \
            tests/test_v0616_provider_host_surface.py \
            tests/test_v0617_host_action_mapping.py \
            tests/test_v0617_secret_field_patterns.py \
            tests/test_v0618_transport_descriptors.py \
            tests/test_v0619_plugin_http_host.py \
            tests/test_v0619_http_auth_failclosed.py \
            tests/test_v0620_mcp_stdio_host.py \
            tests/test_v0621_mcp_streamable_http.py \
            | tee .changes/v0621-targeted.txt
      - name: Compare full regression against current main
        shell: bash
        run: |
          git fetch origin main
          rm -rf /tmp/cbcc-main
          git worktree add --detach /tmp/cbcc-main origin/main
          set +e
          pytest -q -ra > .changes/v0621-branch-full.txt 2>&1
          branch_rc=$?
          (cd /tmp/cbcc-main && pytest -q -ra > "$GITHUB_WORKSPACE/.changes/v0621-main-full.txt" 2>&1)
          main_rc=$?
          set -e
          echo "$branch_rc" > .changes/v0621-branch-full.rc
          echo "$main_rc" > .changes/v0621-main-full.rc
          grep -E '^(FAILED|ERROR) ' .changes/v0621-branch-full.txt | awk '{print $2}' | sort -u > .changes/v0621-branch-failures.txt || true
          grep -E '^(FAILED|ERROR) ' .changes/v0621-main-full.txt | awk '{print $2}' | sort -u > .changes/v0621-main-failures.txt || true
          comm -13 .changes/v0621-main-failures.txt .changes/v0621-branch-failures.txt > .changes/v0621-new-failures.txt
          echo "MAIN_FAILURE_COUNT=$(wc -l < .changes/v0621-main-failures.txt)"
          echo "BRANCH_FAILURE_COUNT=$(wc -l < .changes/v0621-branch-failures.txt)"
          echo "NEW_FAILURE_COUNT=$(wc -l < .changes/v0621-new-failures.txt)"
          if [ -s .changes/v0621-new-failures.txt ]; then
            cat .changes/v0621-new-failures.txt
          fi
          git worktree remove /tmp/cbcc-main --force
      - name: Persist regression evidence before release decision
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changes/v0621-targeted.txt \
            .changes/v0621-branch-full.txt .changes/v0621-main-full.txt \
            .changes/v0621-branch-full.rc .changes/v0621-main-full.rc \
            .changes/v0621-branch-failures.txt .changes/v0621-main-failures.txt \
            .changes/v0621-new-failures.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: capture v0.6.21 release regression evidence"
            git push origin HEAD:work/v0621-mcp-streamable-http
          fi
      - name: Reject newly introduced regressions
        shell: bash
        run: test ! -s .changes/v0621-new-failures.txt
      - name: Remove temporary diagnostics and release workflow
        run: |
          rm -rf .changes
          git rm .github/workflows/v0621-refactor-verify.yml
      - name: Finalize clean v0.6.21 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize CBCC v0.6.21 MCP Streamable HTTP"
          git push origin HEAD:work/v0621-mcp-streamable-http
