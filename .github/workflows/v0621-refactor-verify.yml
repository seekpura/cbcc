name: CBCC v0.6.21 MCP protocol core refactor verification

on:
  push:
    branches:
      - work/v0621-mcp-streamable-http

permissions:
  contents: write

jobs:
  verify-protocol-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract shared MCP protocol processor
        run: python .changes/v0621_protocol_refactor.py
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Verify v0.6.20 behavior unchanged
        shell: bash
        run: |
          mkdir -p .changes
          set +e
          pytest -q -ra \
            tests/test_v0613_provider_transport_integrity.py \
            tests/test_v0614_provider_executor_lifecycle.py \
            tests/test_v0615_provider_executor_bridge.py \
            tests/test_v0615_provider_contract_bridge.py \
            tests/test_v0616_provider_host_surface.py \
            tests/test_v0617_host_action_mapping.py \
            tests/test_v0617_secret_field_patterns.py \
            tests/test_v0618_transport_descriptors.py \
            tests/test_v0619_plugin_http_host.py \
            tests/test_v0619_http_auth_failclosed.py \
            tests/test_v0620_mcp_stdio_host.py \
            > .changes/v0621-refactor-output.txt 2>&1
          rc=$?
          set -e
          echo "$rc" > .changes/v0621-refactor-output.rc
          cat .changes/v0621-refactor-output.txt
      - name: Commit refactor and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/cbcc/mcp_protocol.py runtime/cbcc/mcp_stdio.py \
            .changes/v0621-refactor-output.txt .changes/v0621-refactor-output.rc
          if ! git diff --cached --quiet; then
            git commit -m "refactor: extract shared MCP protocol processor"
            git push origin HEAD:work/v0621-mcp-streamable-http
          fi
      - name: Enforce refactor tests
        if: always()
        shell: bash
        run: test "$(cat .changes/v0621-refactor-output.rc)" = "0"
