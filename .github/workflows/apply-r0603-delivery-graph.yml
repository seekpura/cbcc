name: Apply R06-03 final delivery graph projection repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-r0603-delivery-graph.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact one-line support projection repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('runtime/cbcc/delivery_export.py')
          text = p.read_text(encoding='utf-8')
          old = "_SUPPORT_FILES=[\n'artifacts/strategy_reasoning_context.json'"
          new = "_SUPPORT_FILES=[\n'artifacts/canonical_commerce_graph.json','artifacts/strategy_reasoning_context.json'"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one support-list anchor, got {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Focused RED-to-GREEN verification
        env:
          PYTHONPATH: .:runtime
        run: |
          python -m pip install pytest pyyaml
          python -m pytest -q tests/test_v0682_r0603_delivery_graph_projection.py tests/test_v0682_r0603_canonical_projection_unification.py
          git diff --check
      - name: Commit repair and remove one-shot workflow
        run: |
          rm .github/workflows/apply-r0603-delivery-graph.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/cbcc/delivery_export.py .github/workflows/apply-r0603-delivery-graph.yml
          git commit -m 'fix(r06-03): preserve canonical graph in final delivery'
          git push origin HEAD:main
