name: Apply final reference-guided consistency repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-reference-consistency.yml'
      - 'scripts/final_consistency_reference_guided.py'
      - 'scripts/run_final_consistency_reference_guided.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply consistency repair
        run: python scripts/run_final_consistency_reference_guided.py
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt pytest
      - name: Validate final consistency
        env:
          PYTHONPATH: runtime
        run: |
          python -m py_compile runtime/cbcc/compiler.py runtime/cbcc/production.py runtime/cbcc/prompt_compiler.py runtime/cbcc/video_creator.py scripts/build_plugin_dist.py
          pytest -q \
            tests/test_final_reference_guided_consistency.py \
            tests/test_reference_guided_optional_prompt_and_capability_continuity.py \
            tests/test_reference_guided_video_provider_authority.py \
            tests/test_v060_capability_complete_rebase.py \
            tests/test_v0511_integration_quality_depth.py
      - name: Commit final consistency
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SKILL.md scripts/build_plugin_dist.py runtime/cbcc/compiler.py runtime/cbcc/production.py runtime/cbcc/prompt_compiler.py runtime/cbcc/video_creator.py tests/test_final_reference_guided_consistency.py
          git commit -m 'fix: remove final hidden pixel-lock and prompt-gate contradictions'
          git push origin HEAD:main
