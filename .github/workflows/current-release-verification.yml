# Final clean-head release verification; no temporary diagnostic workflow is allowed in this release head.
name: current-release-verification

on:
  push:
    paths:
      - 'VERSION'
      - 'scripts/build_plugin_dist_current.py'
      - 'scripts/build_plugin_dist_v*.py'
      - 'scripts/check_current_release_package.py'
      - 'scripts/check_v0670_release_delta.py'
      - 'scripts/check_v0670_positive_projection_package.py'
      - 'scripts/check_v0671_release_delta.py'
      - 'scripts/check_v0672_release_delta.py'
      - 'scripts/check_v0673_release_delta.py'
      - 'scripts/check_v0674_release_delta.py'
      - 'scripts/check_v0675_release_delta.py'
      - 'scripts/check_v0664_requirement_consumer_map.py'
      - 'references/REQUIREMENT_CONSUMER_MAP_CURRENT_OVERRIDES.json'
      - 'references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json'
      - 'references/REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md'
      - 'references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE4_*.json'
      - 'references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE5_*.json'
      - 'references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE6_*.json'
      - 'references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE7_*.json'
      - 'references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE8_*.json'
      - 'references/CURRENT_CANONICAL_SKILL_BUILD.md'
      - 'prompts/canonical_authority_loading_map_CURRENT.md'
      - 'runtime/**'
      - 'tests/test_v0670_positive_canonical_projection.py'
      - 'tests/test_v0671_full_canonical_parity.py'
      - 'tests/test_v0671_canonical_search_security.py'
      - 'tests/test_v0672_*.py'
      - 'tests/test_v0673_*.py'
      - 'tests/test_v0674_*.py'
      - 'tests/test_v0676_phase5_*.py'
      - 'tests/test_v0677_phase5_*.py'
      - 'tests/test_v0678_phase5_*.py'
      - 'tests/test_v0679_phase5_*.py'
      - 'tests/test_v0680_phase6_*.py'
      - 'tests/test_v0681_phase7_*.py'
      - 'tests/test_v0616_provider_host_surface.py'
      - 'tests/test_v0682_*.py'
      - '.github/workflows/current-release-verification.yml'
  workflow_dispatch:

jobs:
  build-verify-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install verification dependencies
        run: python -m pip install pyyaml pytest
      - name: Verify v0.6.75 identity source compiles
        run: python -m py_compile scripts/build_plugin_dist_v0675.py scripts/check_v0675_release_delta.py
      - name: Verify v0.6.74 cross-scope regression closure
        env: {PYTHONHASHSEED: '0', PYTHONPATH: runtime}
        run: python -m pytest -q tests/test_v0674_regression_closure.py
      - name: Verify v0.6.73 bilingual business-object and Prompt closure
        env: {PYTHONHASHSEED: '0', PYTHONPATH: runtime}
        run: |
          python -m pytest -q \
            tests/test_v0673_bilingual_asset_guidance.py \
            tests/test_v0673_chinese_delivery_closure.py \
            tests/test_v0673_model_prompt_route_relevance.py
      - name: Verify v0.6.72 bootstrap import order
        env: {PYTHONHASHSEED: '0'}
        run: |
          PYTHONPATH=runtime python - <<'PY'
          import sys, types
          import cbcc
          assert 'cbcc.compiler' not in sys.modules
          from cbcc import strategy_authority
          def has_marker(fn, marker):
              stack=[fn]; seen=set()
              while stack:
                  cur=stack.pop()
                  if id(cur) in seen: continue
                  seen.add(id(cur))
                  if getattr(cur, marker, False): return True
                  for cell in getattr(cur, '__closure__', None) or ():
                      try: value=cell.cell_contents
                      except ValueError: continue
                      if isinstance(value, types.FunctionType): stack.append(value)
              return False
          fn=strategy_authority.build_master_strategy
          assert has_marker(fn, '_cbcc_v0670_strategy_culture_completion')
          assert has_marker(fn, '_cbcc_v0671_strategy_execution_completion')
          PY
      - name: Verify v0.6.72 fresh K01 regression suite
        env: {PYTHONHASHSEED: '0', PYTHONPATH: runtime}
        run: |
          python -m pytest -q \
            tests/test_v0672_fresh_k01_portfolio_delta.py \
            tests/test_v0672_fresh_k01_projection_closure.py \
            tests/test_v0672_global_language_closure.py \
            tests/test_v0672_canonical_human_compaction.py \
            tests/test_v0672_fresh_k01_materialization_closure.py \
            tests/test_v0672_fresh_k01_final_export_closure.py \
            tests/test_v0672_prompt_relevance_and_nested_execution.py \
            tests/test_v0672_integrated_copy_negative_constraint.py \
            tests/test_v0672_nonblocking_platform_research.py
      - name: Verify v0.6.71 acceptance aggregate
        env: {PYTHONHASHSEED: '0'}
        run: |
          python -m pytest tests/test_v0671_full_canonical_parity.py -q
          python -m pytest tests/test_v0671_canonical_search_security.py -q
      - name: Verify CURRENT Phase 5 canonical dynamic Prompt continuity
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: python -m pytest -q tests/test_v0676_phase5_dynamic_prompt_continuity.py
      - name: Verify CURRENT Phase 5 scene-derived photography Prompt consumption
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: python -m pytest -q tests/test_v0677_phase5_req086_scene_photo_prompt_consumption.py
      - name: Verify CURRENT Phase 5 commercial Prompt density and concrete consumption
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: |
          python -m pytest -q \
            tests/test_v0678_phase5_req082_broad_prompt_density.py \
            tests/test_v0678_phase5_req082_static_ad_prompt_consumption.py \
            tests/test_v0678_phase5_req082_integrated_render_language_purity.py
      - name: Verify CURRENT Phase 5 dynamic temporal surface continuity
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: python -m pytest -q tests/test_v0679_phase5_req083_temporal_surface_continuity.py
      - name: Verify CURRENT Phase 6 canonical JSON Markdown HTML same-source parity
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: python -m pytest -q tests/test_v0680_phase6_req061_same_source_projection.py
      - name: Verify CURRENT Phase 6 routed canonical Human Workspace
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: python -m pytest -q tests/test_v0680_phase6_req089_routed_canonical_workspace.py
      - name: Verify CURRENT Phase 6 activated delivery family routes
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: python -m pytest -q tests/test_v0680_phase6_delivery_family_routes.py
      - name: Verify CURRENT Phase 7 final semantics, REQ-088 lineage, and REQ-090 mature package continuity
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: |
          python -m pytest -q \
            tests/test_v0681_phase7_final_package_semantic_closure.py \
            tests/test_v0681_phase7_final_export_integration.py \
            tests/test_v0681_phase7_req088_lineage_closure.py \
            tests/test_v0681_phase7_req088_lineage_export.py \
            tests/test_v0681_phase7_req088_wrapper_integration.py \
            tests/test_v0681_phase7_req088_mature_authority_regression.py \
            tests/test_v0681_phase7_final_mature_package_continuity.py
      - name: Verify CURRENT Phase 8 Provider actual-output execution, Review, Local Revision and hash lineage
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: |
          python -m pytest -q \
            tests/test_v0616_provider_host_surface.py \
            tests/test_v0682_*.py
      - name: Verify prior maturity and CURRENT requirement accounting
        env: {PYTHONHASHSEED: '0'}
        run: |
          python -m pytest tests/test_v0670_positive_canonical_projection.py -q
          python -m unittest discover -s tests -p 'test_current_requirement_consumer_freshness.py' -v
          python -m unittest discover -s tests -p 'test_current_release_package_checker.py' -v
          python scripts/check_v0664_requirement_consumer_map.py
      - name: Build through stable CURRENT builder
        run: python -m scripts.build_plugin_dist_current --output-dir dist_current
      - name: Resolve exact CURRENT plugin ZIP
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          authority=Path('VERSION').read_text(encoding='utf-8').strip(); version=re.match(r'^(\d+\.\d+\.\d+)',authority).group(1)
          files=sorted(Path('dist_current').glob('cross-border-commerce-creative-plugin-v*.zip')); assert len(files)==1
          assert files[0].name==f'cross-border-commerce-creative-plugin-v{version}.zip'
          Path('dist_current/CURRENT_PLUGIN_PATH.txt').write_text(str(files[0])+'\n',encoding='utf-8')
          print(json.dumps({'version':version,'authority':authority,'plugin_zip':str(files[0])},ensure_ascii=False))
          PY
      - name: Check exact ZIP — CURRENT
        run: python scripts/check_current_release_package.py "$(cat dist_current/CURRENT_PLUGIN_PATH.txt)"
      - name: Check exact ZIP — v0.6.70 floor
        run: python scripts/check_v0670_release_delta.py "$(cat dist_current/CURRENT_PLUGIN_PATH.txt)"
      - name: Check exact ZIP — v0.6.70 positive projection
        run: python scripts/check_v0670_positive_projection_package.py "$(cat dist_current/CURRENT_PLUGIN_PATH.txt)"
      - name: Check exact ZIP — v0.6.71 cumulative floor
        run: python scripts/check_v0671_release_delta.py "$(cat dist_current/CURRENT_PLUGIN_PATH.txt)" --floor-mode
      - name: Check exact ZIP — v0.6.72 cumulative floor
        run: python scripts/check_v0672_release_delta.py "$(cat dist_current/CURRENT_PLUGIN_PATH.txt)" --floor-mode
      - name: Check exact ZIP — v0.6.73 cumulative floor
        run: python scripts/check_v0673_release_delta.py "$(cat dist_current/CURRENT_PLUGIN_PATH.txt)" --floor-mode
      - name: Check exact ZIP — v0.6.74 cumulative floor
        run: python scripts/check_v0674_release_delta.py "$(cat dist_current/CURRENT_PLUGIN_PATH.txt)" --floor-mode
      - name: Check exact ZIP — v0.6.75 release
        run: python scripts/check_v0675_release_delta.py "$(cat dist_current/CURRENT_PLUGIN_PATH.txt)"
      - name: Write exact verified artifact metadata
        run: |
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          authority=Path('VERSION').read_text(encoding='utf-8').strip();version=re.match(r'^(\d+\.\d+\.\d+)',authority).group(1)
          plugin=Path(Path('dist_current/CURRENT_PLUGIN_PATH.txt').read_text(encoding='utf-8').strip())
          payload={'file':plugin.name,'version':version,'authority_version':authority,'bytes':plugin.stat().st_size,'sha256':hashlib.sha256(plugin.read_bytes()).hexdigest(),'verified':True,'verified_by':['v0675 identity source','v0674 regression suite','v0674/v0673/v0672 floors','v0671/v0670 floors','CURRENT package checker','v0675 exact ZIP checker','Phase5 canonical dynamic Prompt continuity','Phase5 scene-derived photography Prompt consumption','Phase5 commercial Prompt density and concrete consumption','Phase5 dynamic temporal surface continuity','Phase6 canonical JSON/Markdown/HTML same-source parity','Phase6 routed canonical Human Workspace','Phase6 activated Longform/Store-Landing/CRM delivery family routes and final ZIP consumption','Phase7 final package semantic inventory + host/runtime comparator contract + actual-output E2E boundary + final export ordering + REQ-088 resolvable lineage authority bindings/no-copy invariant + mature information-audit regression + REQ-090 final-byte mature package continuity','Phase8 provider-boundary actual-output bytes + machine quality/reference evidence + human output Review + bounded Local Revision execution + second Review + production receipt/output/revision hash lineage reaching E2E_PROVEN']}
          Path('dist_current/VERIFIED_CURRENT_ARTIFACT.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False))
          PY
      - name: Stage exact verified files
        run: |
          mkdir -p verified_current_artifact
          cp "$(cat dist_current/CURRENT_PLUGIN_PATH.txt)" verified_current_artifact/
          cp dist_current/VERIFIED_CURRENT_ARTIFACT.json verified_current_artifact/
          cp dist_current/release_manifest.json verified_current_artifact/
      - name: Upload exact verified CURRENT plugin
        uses: actions/upload-artifact@v4
        with:
          name: cbcc-plugin-current-verified
          path: verified_current_artifact/
          if-no-files-found: error
          compression-level: 0
          overwrite: true