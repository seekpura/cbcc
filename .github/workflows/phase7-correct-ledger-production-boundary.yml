name: phase7-correct-ledger-production-boundary

permissions:
  contents: write

on:
  push:
    branches: [repair-04-phase7-full-materialization]
    paths:
      - '.github/workflows/phase7-correct-ledger-production-boundary.yml'

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-04-phase7-full-materialization
          fetch-depth: 0
      - name: Correct Phase 7 production and deferred-plan boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          p7 = data['phase_evidence']['7']
          p7['deferred_by_plan'] = [
              'Phase 8 owns real Provider Result / Review / smallest Local Revision / lineage-hash actual-output proof.',
              'Phase 10 owns Fresh K01 FULL public-path proof.',
              'Phase 11 owns installed-plugin readback and final independent release verification.'
          ]
          p7['production_head_sha'] = 'c56e6c19043ebc3dabe1bc7f2b45d9e3ac123f0f'
          p7['mature_continuity_module_commit'] = 'bf4071049193ecd710bd65c4ce8349b66f7b4df9'
          p7['mature_continuity_orchestrator_commit'] = 'c56e6c19043ebc3dabe1bc7f2b45d9e3ac123f0f'
          data['current_head_sha'] = 'c56e6c19043ebc3dabe1bc7f2b45d9e3ac123f0f'
          data['current_head_sha_semantics'] = 'Latest Phase 7 production-code boundary: final mature continuity module is present and the Phase 7 orchestrator gates the definitive ZIP on that final-byte audit. Later tests, CI, maps and ledger commits do not change production semantics.'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Self-clean and commit
        run: |
          rm -f .github/workflows/phase7-correct-ledger-production-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(phase7): correct production and deferred-plan boundaries"
          git push origin HEAD:repair-04-phase7-full-materialization
