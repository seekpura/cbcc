name: v0672-materialization-b-isolate
on:
  push:
    branches: [v0.6.72-fresh-k01-e2e-closure]
  workflow_dispatch:
jobs:
  presence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml pytest
      - env: {PYTHONPATH: runtime, PYTHONHASHSEED: '0'}
        run: python -m pytest -q tests/test_v0672_fresh_k01_materialization_closure.py::test_final_manifest_presence_overrides_stale_universe_count
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml pytest
      - env: {PYTHONPATH: runtime, PYTHONHASHSEED: '0'}
        run: python -m pytest -q tests/test_v0672_fresh_k01_materialization_closure.py::test_cbcc_commercial_workspace_not_fixed_taxonomy_failure
  positive-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml pytest
      - env: {PYTHONPATH: runtime, PYTHONHASHSEED: '0'}
        run: python -m pytest -q tests/test_v0672_fresh_k01_materialization_closure.py::test_positive_materialization_runs_before_legacy_audit
  lazy-human:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml pytest
      - env: {PYTHONPATH: runtime, PYTHONHASHSEED: '0'}
        run: python -m pytest -q tests/test_v0672_fresh_k01_materialization_closure.py::test_legacy_materialization_accepts_already_materialized_lazy_human_workspace
