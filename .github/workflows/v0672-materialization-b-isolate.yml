name: v0672-materialization-b-isolate
on:
  push:
    branches: [v0.6.72-fresh-k01-e2e-closure]
  workflow_dispatch:
jobs:
  no-copy-typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml pytest
      - env: {PYTHONPATH: runtime, PYTHONHASHSEED: '0'}
        run: python -m pytest -q tests/test_v0672_prompt_relevance_and_nested_execution.py::test_no_visible_copy_overrides_global_typography_to_not_needed
  model-fields-not-needed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml pytest
      - env: {PYTHONPATH: runtime, PYTHONHASHSEED: '0'}
        run: python -m pytest -q tests/test_v0672_prompt_relevance_and_nested_execution.py::test_model_fields_do_not_require_global_typography_or_inclusive_contract_when_asset_relevance_says_not_needed
  nested-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml pytest
      - env: {PYTHONPATH: runtime, PYTHONHASHSEED: '0'}
        run: python -m pytest -q tests/test_v0672_prompt_relevance_and_nested_execution.py::test_nested_camera_focus_and_lighting_values_are_selected_for_prompt_closure
  graphic-carrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml pytest
      - env: {PYTHONPATH: runtime, PYTHONHASHSEED: '0'}
        run: python -m pytest -q tests/test_v0672_prompt_relevance_and_nested_execution.py::test_graphic_carrier_is_not_misclassified_as_photo_by_compatibility_focal_length_slot
  visible-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml pytest
      - env: {PYTHONPATH: runtime, PYTHONHASHSEED: '0'}
        run: python -m pytest -q tests/test_v0672_prompt_relevance_and_nested_execution.py::test_canonical_visible_copy_projects_exact_language_slots_and_integrated_route_is_model_render
  motion-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml pytest
      - env: {PYTHONPATH: runtime, PYTHONHASHSEED: '0'}
        run: python -m pytest -q tests/test_v0672_prompt_relevance_and_nested_execution.py::test_creator_motion_timing_alias_is_consumed_as_duration_timing
