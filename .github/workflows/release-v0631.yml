name: CBCC v0.6.31 Model-Native Prompt Integrity Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0631.yml'
      - 'VERSION'
      - 'SKILL.md'
      - 'CHANGELOG_V0631.md'
      - 'runtime/cbcc/**'
      - 'prompts/**'
      - 'scripts/build_plugin_dist.py'
      - 'scripts/build_dist.py'
      - 'tests/test_v0631_*.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v0631:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt pytest

      - name: Verify active v0.6.31 authority
        run: |
          test "$(cat VERSION)" = "0.6.31-model-native-prompt-integrity"
          grep -q '^version: 0.6.31-model-native-prompt-integrity$' SKILL.md
          grep -q 'Model-Native Prompt + Human Depth Authority' SKILL.md
          grep -q '英文生成提示词必须是英文执行语言' SKILL.md
          grep -q 'FULL 人类交付禁止“上游缩水、下游 Prompt 膨胀”' SKILL.md
          grep -q "runtime_version']='0.6.31-model-native-prompt-integrity'" runtime/cbcc/compiler.py
          grep -q 'Model Prompt CN' scripts/build_plugin_dist.py
          grep -q 'Visible Copy Block' scripts/build_plugin_dist.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('prompts/registry.json').read_text(encoding='utf-8'))
          assert d['version']=='0.6.31-model-native-prompt-integrity'
          rows={x['id']:x for x in d['prompts']}
          assert 'separate Model Prompt CN/EN' in rows['PROMPT-CREATIVE-SURFACE-CANONICAL']['purpose']
          print('v0.6.31 authority metadata PASS')
          PY

      - name: Compile critical runtime modules
        env:
          PYTHONPATH: .:runtime
        run: |
          python -m py_compile \
            runtime/cbcc/__init__.py \
            runtime/cbcc/model_native_prompt_contract.py \
            runtime/cbcc/model_native_prompt_audit_fix.py \
            runtime/cbcc/human_delivery_art_direction_projection.py \
            runtime/cbcc/photographic_route_agent_authority.py \
            runtime/cbcc/agent_authority_prompt_compiler.py \
            runtime/cbcc/art_direction_projection.py \
            runtime/cbcc/agent_art_direction_authority.py \
            runtime/cbcc/asset_compiler.py \
            runtime/cbcc/delivery_html.py \
            runtime/cbcc/delivery_contract.py

      - name: v0.6.31 model-native prompt integrity
        env:
          PYTHONPATH: .:runtime
        run: |
          pytest -q \
            tests/test_v0631_model_native_prompt_contract.py \
            tests/test_v0631_human_delivery_output.py \
            tests/test_v0631_capability_layering_continuity.py

      - name: Preserve v0.6.30 Agent Art Direction authority
        env:
          PYTHONPATH: .:runtime
        run: |
          pytest -q \
            tests/test_v0630_agent_art_direction_authority.py \
            tests/test_v0630_surface_agent_authority.py \
            tests/test_v0630_agent_art_direction_e2e.py \
            tests/test_v0630_prompt_art_direction_projection.py

      - name: FULL and human-delivery continuity
        env:
          PYTHONPATH: .:runtime
        run: |
          pytest -q \
            tests/test_full_strategy_hard_contract.py \
            tests/test_full_delivery_last_mile.py \
            tests/test_human_language_delivery_contract.py \
            tests/test_v066_human_workspace_zh_first.py \
            tests/test_v067_workspace_information_architecture.py \
            tests/test_v0624_strategy_asset_scope.py \
            tests/test_v0625_decision_question_authority.py \
            tests/test_v0627_current_scope_completion.py \
            tests/test_v0628_agent_frontier_scope.py

      - name: Reference-guided and provider continuity
        env:
          PYTHONPATH: .:runtime
        run: |
          pytest -q \
            tests/test_reference_guided_optional_prompt_and_capability_continuity.py \
            tests/test_reference_guided_video_provider_authority.py \
            tests/test_final_reference_guided_consistency.py \
            tests/test_v060_capability_complete_rebase.py \
            tests/test_v0511_integration_quality_depth.py \
            tests/test_capability_contracts.py
          python tests/run_toolkit_smoke.py

      - name: Build installable Plugin and Skill archives
        run: python scripts/build_plugin_dist.py --output-dir dist

      - name: Build Runtime archive
        run: python scripts/build_dist.py dist/cross-border-commerce-creative-runtime-v0.6.31.zip

      - name: Verify packaged model-native authority and depth
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, zipfile, re
          dist=Path('dist')
          manifest=json.loads((dist/'release_manifest.json').read_text(encoding='utf-8'))
          assert manifest['version']=='0.6.31', manifest
          assert manifest['source_version']=='0.6.31-model-native-prompt-integrity', manifest
          plugin=dist/'cross-border-commerce-creative-plugin-v0.6.31.zip'
          skill=dist/'cross-border-commerce-creative-skill-v0.6.31.zip'
          runtime=dist/'cross-border-commerce-creative-runtime-v0.6.31.zip'
          assert plugin.exists() and skill.exists() and runtime.exists()
          required=[
            'runtime/cbcc/model_native_prompt_contract.py',
            'runtime/cbcc/model_native_prompt_audit_fix.py',
            'runtime/cbcc/human_delivery_art_direction_projection.py',
            'runtime/cbcc/photographic_route_agent_authority.py',
            'runtime/cbcc/agent_art_direction_authority.py',
            'runtime/cbcc/asset_compiler.py',
            'runtime/cbcc/delivery_html.py',
            'runtime/cbcc/delivery_contract.py',
            'prompts/creative_direction_surface_prompt_compiler.md',
            'CHANGELOG_V0631.md',
            'tests/test_v0631_model_native_prompt_contract.py',
            'tests/test_v0631_human_delivery_output.py',
            'tests/test_v0631_capability_layering_continuity.py',
          ]
          with zipfile.ZipFile(plugin) as z:
            names=set(z.namelist())
            skill_root='cross-border-commerce-creative/skills/cross-border-commerce-creative/'
            root=skill_root+'resources/'
            for rel in required:
              assert root+rel in names, rel
            wrapper=z.read(skill_root+'SKILL.md').decode('utf-8')
            authority=z.read(root+'SKILL.md').decode('utf-8')
            native=z.read(root+'runtime/cbcc/model_native_prompt_contract.py').decode('utf-8')
            audit=z.read(root+'runtime/cbcc/model_native_prompt_audit_fix.py').decode('utf-8')
            html=z.read(root+'runtime/cbcc/delivery_html.py').decode('utf-8')
            compiler=z.read(root+'runtime/cbcc/asset_compiler.py').decode('utf-8')
            assert '## Model-Native Prompt Contract' in wrapper
            assert 'Model-Native Prompt + Human Depth Authority' in authority
            assert 'BILINGUAL_RENDER_SEMANTICS_REQUIRED' in native
            assert 'MODEL_NATIVE_PROMPT_CONSUMPTION_V2' in audit
            assert 'Model Prompt CN｜中文模型提示词' in html
            assert 'Model Prompt EN｜英文模型提示词' in html
            assert '生产 / 装配说明' in html
            assert '确定性排版规则' not in html
            assert 'Prompt 是执行合同' not in html
            assert '14_visible_copy_block.json' in compiler
            assert '15_production_assembly_notes.json' in compiler
          print('v0.6.31 packaged authority PASS')
          PY

      - name: Write SHA256 sums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbcc-v0.6.31-model-native-prompt-integrity
          path: |
            dist/cross-border-commerce-creative-plugin-v0.6.31.zip
            dist/cross-border-commerce-creative-skill-v0.6.31.zip
            dist/cross-border-commerce-creative-runtime-v0.6.31.zip
            dist/release_manifest.json
            dist/SHA256SUMS.txt

      - name: Publish or refresh GitHub Release v0.6.31
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.31 >/dev/null 2>&1; then
            gh release upload v0.6.31 \
              dist/cross-border-commerce-creative-plugin-v0.6.31.zip \
              dist/cross-border-commerce-creative-skill-v0.6.31.zip \
              dist/cross-border-commerce-creative-runtime-v0.6.31.zip \
              dist/release_manifest.json \
              dist/SHA256SUMS.txt --clobber
          else
            gh release create v0.6.31 \
              dist/cross-border-commerce-creative-plugin-v0.6.31.zip \
              dist/cross-border-commerce-creative-skill-v0.6.31.zip \
              dist/cross-border-commerce-creative-runtime-v0.6.31.zip \
              dist/release_manifest.json \
              dist/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --title 'CBCC v0.6.31 — Model-Native Prompt Integrity' \
              --notes-file CHANGELOG_V0631.md
          fi
