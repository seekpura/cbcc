name: cleanup-phase4-temporary-workflows

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove completed Phase 4 one-shot CI scaffolding
        run: |
          rm -f .github/phase4_patch_scene_photography.py
          rm -f .github/workflows/phase4-*.yml
          rm -f .github/workflows/cleanup-phase4-temporary-workflows.yml
          git config user.name 'cbcc-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A .github
          git commit -m 'chore: remove completed Phase 4 one-shot workflows'
          git push origin HEAD:main
