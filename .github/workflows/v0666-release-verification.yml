name: v0666-release-verification

on:
  push:
    paths:
      - 'VERSION'
      - 'scripts/build_plugin_dist_v0666.py'
      - 'scripts/check_v0664_requirement_consumer_map.py'
      - 'references/CURRENT_PACKAGED_SKILL_BASELINE_V0665.md'
      - 'references/CURRENT_CANONICAL_SKILL_BUILD_V0666.md'
      - 'references/REQUIREMENT_CONSUMER_MAP_V0664.json'
      - 'references/REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md'
      - 'references/SOURCE_REQUIREMENT_NON_REGRESSION_LOCK.md'
      - 'references/HOST_SKILL_SNAPSHOT_PARITY_LOCK_V0664.md'
      - 'prompts/canonical_authority_loading_map_v0665_addendum.md'
      - '.github/workflows/v0666-release-verification.yml'
  workflow_dispatch:

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen current packaged Skill baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('references/CURRENT_PACKAGED_SKILL_BASELINE_V0665.md')
          data = p.read_bytes()
          text = data.decode('utf-8')
          # Installed raw Skill is 38,152 bytes; Plugin Creator exposes decoded text without the
          # 3-byte UTF-8 BOM. Canonical source stores the BOM-normalized 38,149-byte text.
          assert len(data) == 38149, len(data)
          assert 'version: 0.6.65-current-release-text-parity' in text
          assert '# Cross-Border Commerce Creative v0.6.65' in text
          for marker in (
              '## 0.4 Open-world Asset Opportunity Universe',
              '## 0.5 Model Prompt Semantic Membrane',
              '## 0.10 One-to-One Long-Requirement Runtime Enforcement',
              '## 0.12 Real K01 Host-Shortcut Audit Closure',
              '## 0.14 Current-Release Text Parity',
              '## 1. FULL depth remains mandatory',
          ):
              assert marker in text, marker
          print({'status':'PASS','normalized_baseline_bytes':len(data),'installed_raw_bytes':38152,'bom_bytes':3})
          PY
      - name: Verify 60 concrete requirement consumers
        run: python scripts/check_v0664_requirement_consumer_map.py
      - name: Verify builder has no historical canonical chain
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/build_plugin_dist_v0666.py').read_text(encoding='utf-8')
          assert 'from scripts import build_plugin_dist as base' in text
          assert 'build_plugin_dist_v066' not in text
          assert 'BASE_COPY_REPO_RESOURCES = base.copy_repo_resources' in text
          assert 'CURRENT_PACKAGED_SKILL_BASELINE_V0665.md' in text
          print({'status':'PASS','historical_chain':False})
          PY
      - name: Build v0.6.66 package
        run: python -m scripts.build_plugin_dist_v0666 --output-dir dist_v0666
      - name: Verify final packaged authority and Runtime parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('dist_v0666')
          plugin_zip = next(root.glob('cross-border-commerce-creative-plugin-v*.zip'))
          import zipfile, tempfile
          with tempfile.TemporaryDirectory() as td:
              with zipfile.ZipFile(plugin_zip) as z:
                  z.extractall(td)
              plugin = Path(td) / 'cross-border-commerce-creative'
              skill_root = plugin / 'skills' / 'cross-border-commerce-creative'
              res = skill_root / 'resources'
              top = skill_root / 'SKILL.md'
              deep = res / 'SKILL.md'
              manifest = json.loads((plugin / 'plugin.json').read_text(encoding='utf-8'))
              assert manifest['version'] == '0.6.66', manifest['version']
              assert top.read_bytes() == deep.read_bytes(), 'top/deep Skill drift'
              text = top.read_text(encoding='utf-8')
              assert 'version: 0.6.66-strict-consumer-current-baseline-build' in text
              assert '# Cross-Border Commerce Creative v0.6.66' in text
              assert '## 0.15 Strict Requirement Consumer Accounting + Current Baseline Build' in text
              assert 'HOST_SKILL_SNAPSHOT_STALE' in text
              assert (res / 'VERSION').read_text(encoding='utf-8').strip() == '0.6.66-strict-consumer-current-baseline-build'
              required = [
                  res / 'references' / 'CONVERSATION_REQUIREMENT_AUDIT.md',
                  res / 'references' / 'CONVERSATION_REQUIREMENT_LEDGER_EXTENSION_01.md',
                  res / 'references' / 'USER_LONG_REQUIREMENTS_STRATEGY_CULTURE_EXECUTION_CN.md',
                  res / 'references' / 'CURRENT_PACKAGED_SKILL_BASELINE_V0665.md',
                  res / 'references' / 'CURRENT_CANONICAL_SKILL_BUILD_V0666.md',
                  res / 'references' / 'REQUIREMENT_CONSUMER_MAP_V0664.json',
                  res / 'references' / 'REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md',
                  res / 'references' / 'SOURCE_REQUIREMENT_NON_REGRESSION_LOCK.md',
                  res / 'references' / 'HOST_SKILL_SNAPSHOT_PARITY_LOCK_V0664.md',
                  res / 'references' / 'REAL_K01_HOST_SHORTCUT_AUDIT_CLOSURE_V0663.md',
                  res / 'prompts' / 'canonical_authority_loading_map_v0665_addendum.md',
                  res / 'scripts' / 'check_v0664_requirement_consumer_map.py',
                  res / 'runtime' / 'cbcc' / 'long_requirement_runtime.py',
                  res / 'runtime' / 'cbcc' / 'long_requirement_human_projection.py',
                  res / 'runtime' / 'cbcc' / 'asset_universe_family_audit.py',
                  res / 'runtime' / 'cbcc' / 'integrated_render_route_authority.py',
                  res / 'runtime' / 'cbcc' / 'long_requirement_full_audit.py',
                  res / 'runtime' / 'cbcc' / 'full_art_direction_preservation.py',
                  res / 'runtime' / 'cbcc' / 'commercial_continuity_bootstrap.py',
              ]
              missing = [str(p) for p in required if not p.exists()]
              assert not missing, missing
              consumer = json.loads((res / 'references' / 'REQUIREMENT_CONSUMER_MAP_V0664.json').read_text(encoding='utf-8'))
              assert len(consumer['requirements']) == 60
              audit = (res / 'runtime' / 'cbcc' / 'long_requirement_full_audit.py').read_text(encoding='utf-8')
              assert '_project_shortcut_audit' in audit
              assert 'PRODUCTION_OBJECTS_INCOMPLETE' in audit
              integrated = (res / 'runtime' / 'cbcc' / 'integrated_render_route_authority.py').read_text(encoding='utf-8')
              assert 'MODEL_RENDER_INTEGRATED' in integrated
              assert 'REFERENCE_GUIDED_NATIVE_LOCK' in integrated
              print(json.dumps({
                  'status':'PASS',
                  'requirements':60,
                  'top_skill_bytes':len(top.read_bytes()),
                  'required_files':len(required),
                  'historical_canonical_chain':False,
              }, ensure_ascii=False))
          PY
