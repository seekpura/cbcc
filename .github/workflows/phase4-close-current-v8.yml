name: phase4-close-current-v8

on:
  push:
    branches: [phase4-closure]
    paths: ['.github/workflows/phase4-close-current-v8.yml']
  workflow_dispatch:

permissions: {contents: write}
env: {PRODUCTION_HEAD: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf}

jobs:
  focused:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.result.outputs.tests }}
      failures: ${{ steps.result.outputs.failures }}
      errors: ${{ steps.result.outputs.errors }}
      skipped: ${{ steps.result.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pyyaml pillow
      - name: Phase 4 focused exact production proof
        env: {PYTHONPATH: runtime}
        run: |
          files=(tests/test_v0676_phase4_*.py)
          test -e "${files[0]}"
          pytest -q "${files[@]}" --junitxml=/tmp/proof.xml
      - id: result
        run: python -c "import os,xml.etree.ElementTree as E;r=E.parse('/tmp/proof.xml').getroot();s=[r] if r.tag=='testsuite' else list(r.findall('testsuite'));f=open(os.environ['GITHUB_OUTPUT'],'a');[f.write(k+'='+str(sum(int(x.attrib.get(k,0)) for x in s))+'\\n') for k in ('tests','failures','errors','skipped')];f.close()"

  listing:
    runs-on: ubuntu-latest
    outputs: {tests: "${{ steps.result.outputs.tests }}", failures: "${{ steps.result.outputs.failures }}", errors: "${{ steps.result.outputs.errors }}", skipped: "${{ steps.result.outputs.skipped }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pyyaml pillow
      - name: Listing Search direct upstream consumer proof
        env: {PYTHONPATH: runtime}
        run: pytest -q tests/test_v0676_listing_search_authority.py tests/test_v0676_listing_search_context_bridge.py tests/test_v0676_listing_search_runtime_binding.py --junitxml=/tmp/proof.xml
      - id: result
        run: python -c "import os,xml.etree.ElementTree as E;r=E.parse('/tmp/proof.xml').getroot();s=[r] if r.tag=='testsuite' else list(r.findall('testsuite'));f=open(os.environ['GITHUB_OUTPUT'],'a');[f.write(k+'='+str(sum(int(x.attrib.get(k,0)) for x in s))+'\\n') for k in ('tests','failures','errors','skipped')];f.close()"

  graph:
    runs-on: ubuntu-latest
    outputs: {tests: "${{ steps.result.outputs.tests }}", failures: "${{ steps.result.outputs.failures }}", errors: "${{ steps.result.outputs.errors }}", skipped: "${{ steps.result.outputs.skipped }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pyyaml pillow
      - name: Canonical commerce graph adjacent proof
        env: {PYTHONPATH: runtime}
        run: pytest -q tests/test_v0676_canonical_commerce_graph.py --junitxml=/tmp/proof.xml
      - id: result
        run: python -c "import os,xml.etree.ElementTree as E;r=E.parse('/tmp/proof.xml').getroot();s=[r] if r.tag=='testsuite' else list(r.findall('testsuite'));f=open(os.environ['GITHUB_OUTPUT'],'a');[f.write(k+'='+str(sum(int(x.attrib.get(k,0)) for x in s))+'\\n') for k in ('tests','failures','errors','skipped')];f.close()"

  provider:
    runs-on: ubuntu-latest
    outputs: {tests: "${{ steps.result.outputs.tests }}", failures: "${{ steps.result.outputs.failures }}", errors: "${{ steps.result.outputs.errors }}", skipped: "${{ steps.result.outputs.skipped }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pyyaml pillow
      - name: Native reference provider-boundary proof
        env: {PYTHONPATH: runtime}
        run: pytest -q tests/test_v0635_native_reference_provider_integrity.py --junitxml=/tmp/proof.xml
      - id: result
        run: python -c "import os,xml.etree.ElementTree as E;r=E.parse('/tmp/proof.xml').getroot();s=[r] if r.tag=='testsuite' else list(r.findall('testsuite'));f=open(os.environ['GITHUB_OUTPUT'],'a');[f.write(k+'='+str(sum(int(x.attrib.get(k,0)) for x in s))+'\\n') for k in ('tests','failures','errors','skipped')];f.close()"

  close:
    needs: [focused, listing, graph, provider]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: phase4-closure, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Assert proof jobs and source boundary
        run: |
          test '${{ needs.focused.result }}' = success
          test '${{ needs.listing.result }}' = success
          test '${{ needs.graph.result }}' = success
          test '${{ needs.provider.result }}' = success
          changed=$(git diff --name-only "$PRODUCTION_HEAD"...HEAD)
          if printf '%s\n' "$changed" | grep -E '^runtime/|^tests/' ; then
            echo 'Closure branch changed runtime/tests after verified Phase 4 production head.' >&2
            exit 1
          fi
      - name: Correct closure generator consumer path from production diff
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/phase4_close_current.py')
          text=p.read_text(encoding='utf-8')
          old='runtime/cbcc/scene_derived_photography_authority.py'
          new='runtime/cbcc/photographic_route_agent_authority.py'
          assert old in text
          p.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Materialize focused and direct-cross JUnit summaries
        env:
          FOCUSED_TESTS: ${{ needs.focused.outputs.tests }}
          FOCUSED_FAILURES: ${{ needs.focused.outputs.failures }}
          FOCUSED_ERRORS: ${{ needs.focused.outputs.errors }}
          FOCUSED_SKIPPED: ${{ needs.focused.outputs.skipped }}
          LISTING_TESTS: ${{ needs.listing.outputs.tests }}
          GRAPH_TESTS: ${{ needs.graph.outputs.tests }}
          PROVIDER_TESTS: ${{ needs.provider.outputs.tests }}
        run: |
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          def w(path,t,f=0,e=0,s=0):
              ET.ElementTree(ET.Element('testsuite',{'tests':str(t),'failures':str(f),'errors':str(e),'skipped':str(s),'time':'0'})).write(path,encoding='utf-8',xml_declaration=True)
          w('/tmp/phase4-focused.xml',int(os.environ['FOCUSED_TESTS']),int(os.environ['FOCUSED_FAILURES']),int(os.environ['FOCUSED_ERRORS']),int(os.environ['FOCUSED_SKIPPED']))
          cross=sum(int(os.environ[k]) for k in ('LISTING_TESTS','GRAPH_TESTS','PROVIDER_TESTS'))
          w('/tmp/phase4-cross.xml',cross)
          print({'focused':os.environ['FOCUSED_TESTS'],'direct_cross':cross})
          PY
      - name: Generate Phase 4 CURRENT closure ledgers
        run: python .github/phase4_close_current.py --focused-junit /tmp/phase4-focused.xml --cross-junit /tmp/phase4-cross.xml
      - name: Record exact proof scope and historical-test boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proof={
            'mode':'EXACT_PRODUCTION_SHA_PHASE4_PLUS_DIRECT_CONSUMERS',
            'production_head_sha':'63eab0ab46ce5a251592b1a3363b03b99c3b4adf',
            'focused_scope':'All persistent tests/test_v0676_phase4_*.py on exact production SHA.',
            'cross_scope':'Listing/Search authority+bridge+runtime binding, canonical commerce graph, and native reference/provider integrity on exact production SHA.',
            'inclusion_scope':'Concrete inclusion is covered by the Phase 4 focused inclusion authority test; legacy Human Workspace HTML projection is outside Phase 4 closure.',
            'historical_test_boundary':'Older Phase 3 multi-generation wrapper/import tests were diagnostically exercised and shown to be isolation-sensitive when combined. They are not used as Phase 4 completion evidence; Phase 3 remains governed by its own prior closure evidence.',
          }
          for p in [Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json'),Path('references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE4_ART_DIRECTION_PHOTOGRAPHY_VISUAL_MASTER.json')]:
              d=json.loads(p.read_text(encoding='utf-8'))
              ev=d['phase_evidence']['4'] if p.name=='REQUIREMENT_EXECUTION_LEDGER_CURRENT.json' else d['phase_evidence']
              ev['hermetic_cross_scope_proof']=proof
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate every declared consumer/evidence path and Phase 5 boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledger=json.loads(Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json').read_text(encoding='utf-8'))
          cmap=json.loads(Path('references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE4_ART_DIRECTION_PHOTOGRAPHY_VISUAL_MASTER.json').read_text(encoding='utf-8'))
          matrix=Path('references/REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md').read_text(encoding='utf-8')
          missing=[]
          for row in cmap['requirements']:
              for key in ('consumers','evidence'):
                  for rel in row.get(key) or []:
                      if not Path(rel).exists(): missing.append((row['requirement_id'],key,rel))
          assert not missing, missing
          assert ledger['phase_status']['4']=='PASS_PHASE4_ART_DIRECTION_PHOTOGRAPHY_VISUAL_MASTER_VERIFIED'
          assert ledger['phase_evidence']['4']['focused_tests']['status']=='PASS'
          assert ledger['phase_evidence']['4']['cross_scope_tests']['status']=='PASS'
          assert cmap['phase_evidence']['focused_result']['status']=='PASS'
          assert cmap['phase_evidence']['cross_scope_result']['status']=='PASS'
          assert cmap['phase_evidence']['real_product_probes']['status']=='PENDING_FRESH_K01_FULL'
          assert cmap['phase_evidence']['provider_actual_output']['status']=='PENDING_PHASE7_8_10'
          assert ledger['next_phase']=='PHASE_5_PROMPT_RENDERER_CPP'
          assert 'PHASE5_PENDING' in matrix or 'PHASE5/7_E2E_PENDING' in matrix
          PY
      - name: Recheck dynamic lifecycle invariant on production bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('runtime/cbcc/compiler.py').read_text(encoding='utf-8')
          b="video_plan=build_video_creator_plan(request.get('project_id','project'),objects,questions,lang.to_dict(),request.get('video_jobs'),assets=architecture.get('assets'),creative_council=council)"
          p='architecture=project_dynamic_art_direction_to_assets(architecture,video_plan)'
          w="aap=_write(p/'artifacts/asset_architecture.json',architecture)"
          assert t.index(b)<t.index(p)<t.index(w)
          assert t.count(b)==1
          PY
      - name: Remove all temporary Phase 4 scaffolding
        run: |
          rm -f \
            .github/phase4_patch_dynamic_art_direction.py \
            .github/phase4_close_current.py \
            .github/workflows/phase4-dynamic-art-direction-red.yml \
            .github/workflows/phase4-dynamic-art-direction-green.yml \
            .github/workflows/phase4-close-current.yml \
            .github/workflows/phase4-close-current-v2.yml \
            .github/workflows/phase4-close-current-v3.yml \
            .github/workflows/phase4-close-current-v4.yml \
            .github/workflows/phase4-close-current-v5.yml \
            .github/workflows/phase4-close-current-v6.yml \
            .github/workflows/phase4-close-current-v7.yml \
            .github/workflows/phase4-close-current-v8.yml
          test -f tests/test_v0676_phase4_dynamic_surface_art_direction.py
      - name: Commit isolated Phase 4 closure
        run: |
          git config user.name 'cbcc-phase4-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(phase4): close art-direction authority and clean scaffolding'
          git push origin HEAD:phase4-closure
