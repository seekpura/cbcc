name: CBCC v0.6.18 transport descriptor verification

on:
  push:
    branches:
      - work/v0618-transport-descriptors

permissions:
  contents: write

jobs:
  verify-transport-descriptors:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply portable transport defaults
        run: python .changes/v0618_transport_patch.py
      - name: Materialize canonical transport descriptors
        run: python .changes/v0618_materialize.py
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Run provider continuity and transport descriptor tests
        shell: bash
        run: |
          mkdir -p .changes
          set +e
          pytest -q -ra \
            tests/test_v0613_provider_transport_integrity.py \
            tests/test_v0614_provider_executor_lifecycle.py \
            tests/test_v0615_provider_executor_bridge.py \
            tests/test_v0615_provider_contract_bridge.py \
            tests/test_v0616_provider_host_surface.py \
            tests/test_v0617_host_action_mapping.py \
            tests/test_v0617_secret_field_patterns.py \
            tests/test_v0618_transport_descriptors.py \
            > .changes/v0618-test-output.txt 2>&1
          rc=$?
          set -e
          echo "$rc" > .changes/v0618-test-output.rc
          cat .changes/v0618-test-output.txt
      - name: Commit implementation descriptors and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/cbcc/action_transports.py transport .changes/v0618-test-output.txt .changes/v0618-test-output.rc
          if ! git diff --cached --quiet; then
            git commit -m "feat: materialize v0.6.18 canonical transport descriptors"
            git push origin HEAD:work/v0618-transport-descriptors
          fi
      - name: Enforce targeted test result
        if: always()
        shell: bash
        run: test "$(cat .changes/v0618-test-output.rc)" = "0"
