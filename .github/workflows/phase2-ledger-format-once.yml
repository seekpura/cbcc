name: one-shot-phase2-ledger-format-repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2-ledger-format-once.yml'

permissions:
  contents: write

jobs:
  repair-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore readable ledger formatting without semantic change
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          path = Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json')
          current_text = path.read_text(encoding='utf-8')
          current = json.loads(current_text)
          template_text = subprocess.check_output([
              'git','show','df40d54982d43715c32b99ee649a61bf5a0182ae:references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json'
          ], text=True)
          decoder = json.JSONDecoder()

          def locate(src, key, start=0):
              pos = src.find(json.dumps(key), start)
              if pos < 0: raise RuntimeError(f'key not found: {key}')
              colon = src.find(':', pos)
              vstart = colon + 1
              while src[vstart].isspace(): vstart += 1
              _, used = decoder.raw_decode(src[vstart:])
              return vstart, vstart + used

          def replace_raw(src, key, raw, start=0):
              a,b = locate(src,key,start)
              return src[:a] + raw + src[b:]

          def q(v): return json.dumps(v, ensure_ascii=False, separators=(',', ':'))
          def one_line_obj(d): return json.dumps(d, ensure_ascii=False, separators=(',', ':'))
          def list_lines(vals, indent=6):
              pad=' ' * indent; inner=' ' * (indent+2)
              if not vals: return '[]'
              return '[\n' + ',\n'.join(inner + q(v) for v in vals) + '\n' + pad + ']'
          def obj_lines(d, indent=6):
              pad=' ' * indent; inner=' ' * (indent+2)
              if not d: return '{}'
              return '{\n' + ',\n'.join(inner + q(str(k)) + ':' + q(v) for k,v in d.items()) + '\n' + pad + '}'

          text = template_text
          nr = current['new_requirements']
          nr_raw = '[\n' + ',\n'.join('    ' + one_line_obj(x) for x in nr) + '\n  ]'
          text = replace_raw(text, 'new_requirements', nr_raw)

          ps = current['phase_status']
          ps_raw = '{\n' + ',\n'.join('    ' + q(k) + ':' + q(v) for k,v in ps.items()) + '\n  }'
          text = replace_raw(text, 'phase_status', ps_raw)

          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          p2 = current['phase_evidence']['2']
          text = replace_raw(text, 'status', q(p2['status']), p2_start)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_raw(text, 'verified_subtasks', list_lines(p2['verified_subtasks'], 6), p2_start)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_raw(text, 'focused_tests', obj_lines(p2['focused_tests'], 6), p2_start)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_raw(text, 'cross_scope_tests', q(p2['cross_scope_tests']), p2_start)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_raw(text, 'proof_objects', list_lines(p2['proof_objects'], 6), p2_start)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_raw(text, 'verified_behaviors', list_lines(p2['verified_behaviors'], 6), p2_start)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_raw(text, 'produced_object_inspection', q(p2['produced_object_inspection']), p2_start)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_raw(text, 'deferred_boundaries', list_lines(p2['deferred_boundaries'], 6), p2_start)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_raw(text, 'remaining_phase2', q(p2['remaining_phase2']), p2_start)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_raw(text, 'source_commits', list_lines(p2['source_commits'], 6), p2_start)

          # Insert the newly added CI boundary after source_commits; template predates it.
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          a,b = locate(text, 'source_commits', p2_start)
          if '"ci_status"' not in text[b:text.find('\n    }', b)+6]:
              text = text[:b] + ',\n      "ci_status": ' + q(p2['ci_status']) + text[b:]

          restored = json.loads(text)
          assert restored == current, 'format repair changed ledger semantics'
          assert restored['phase_status']['2'] == 'PASS_PHASE2_FULL_BUSINESS_OBJECT_DENSITY_VERIFIED'
          assert len(restored['phase_evidence']['2']['verified_subtasks']) == 12
          assert restored['phase_status']['3'] == 'NOT_STARTED'
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit formatting-only repair
        shell: bash
        run: |
          git config user.name 'cbcc-phase2-closure'
          git config user.email 'actions@users.noreply.github.com'
          git add references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: restore readable CURRENT ledger formatting'
          git push origin HEAD:main
