name: CBCC v0.6.21 final safety release

on:
  push:
    branches:
      - work/v0621-mcp-streamable-http

concurrency:
  group: cbcc-v0621-final-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final protocol safety hardening
        run: python .changes/v0621_safety_release.py
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Verify continuity through final v0.6.21
        shell: bash
        run: |
          pytest -q -ra \
            tests/test_v0613_provider_transport_integrity.py \
            tests/test_v0614_provider_executor_lifecycle.py \
            tests/test_v0615_provider_executor_bridge.py \
            tests/test_v0615_provider_contract_bridge.py \
            tests/test_v0616_provider_host_surface.py \
            tests/test_v0617_host_action_mapping.py \
            tests/test_v0617_secret_field_patterns.py \
            tests/test_v0618_transport_descriptors.py \
            tests/test_v0619_plugin_http_host.py \
            tests/test_v0619_http_auth_failclosed.py \
            tests/test_v0620_mcp_stdio_host.py \
            tests/test_v0621_mcp_streamable_http.py
      - name: Compare full regression against current main
        shell: bash
        run: |
          git fetch origin main
          rm -rf /tmp/cbcc-main
          git worktree add --detach /tmp/cbcc-main origin/main
          set +e
          pytest -q -ra > /tmp/v0621-branch-full.txt 2>&1
          branch_rc=$?
          (cd /tmp/cbcc-main && pytest -q -ra > /tmp/v0621-main-full.txt 2>&1)
          main_rc=$?
          set -e
          grep -E '^(FAILED|ERROR) ' /tmp/v0621-branch-full.txt | awk '{print $2}' | sort -u > /tmp/v0621-branch-failures.txt || true
          grep -E '^(FAILED|ERROR) ' /tmp/v0621-main-full.txt | awk '{print $2}' | sort -u > /tmp/v0621-main-failures.txt || true
          comm -13 /tmp/v0621-main-failures.txt /tmp/v0621-branch-failures.txt > /tmp/v0621-new-failures.txt
          echo "MAIN_FAILURE_COUNT=$(wc -l < /tmp/v0621-main-failures.txt)"
          echo "BRANCH_FAILURE_COUNT=$(wc -l < /tmp/v0621-branch-failures.txt)"
          echo "NEW_FAILURE_COUNT=$(wc -l < /tmp/v0621-new-failures.txt)"
          cat /tmp/v0621-new-failures.txt
          test ! -s /tmp/v0621-new-failures.txt
          git worktree remove /tmp/cbcc-main --force
      - name: Remove temporary staging and workflow
        run: |
          rm -rf .changes
          git rm .github/workflows/v0621-safety-release.yml
      - name: Finalize clean v0.6.21 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize CBCC v0.6.21 MCP Streamable HTTP safety"
          git push origin HEAD:work/v0621-mcp-streamable-http
