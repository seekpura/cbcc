name: phase7-close-authority-once

on:
  push:
    branches: [repair-04-phase7-full-materialization]
    paths:
      - '.github/workflows/phase7-close-authority-once.yml'

permissions:
  contents: write

jobs:
  close-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-04-phase7-full-materialization
          fetch-depth: 0
      - name: Update Phase 7 authority records exactly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ledger_path = Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json')
          data = json.loads(ledger_path.read_text(encoding='utf-8'))

          reqs = {row['req']: row for row in data['new_requirements']}
          reqs['REQ-061']['status'] = 'PASS_PHASE1_GRAPH_AUTHORITY_PHASE6_JSON_MD_HTML_SAME_SOURCE_PROJECTION_PHASE7_FINAL_SEMANTIC_TARGETED_VERIFIED'
          reqs['REQ-070']['status'] = 'PARTIAL_PHASE3_OPPORTUNITY_FAMILY_PHASE6_LONGFORM_DELIVERY_ROUTE_PHASE7_FINAL_PACKAGE_CONTINUITY_TARGETED_VERIFIED_REAL_FAMILY_E2E_PENDING'
          reqs['REQ-090']['status'] = 'PARTIAL_PHASE7_SOURCE_PACKAGE_CLOSURE_TARGETED_VERIFIED_HOST_FALSE_PASS_GUARD_VERIFIED_INSTALLED_HOST_E2E_PHASE11_REAL_PROVIDER_OUTPUT_PHASE8_AND_FRESH_K01_PHASE10_PENDING'

          data['phase_status']['7'] = 'PASS_PHASE7_FINAL_PACKAGE_SEMANTIC_REQ088_LINEAGE_FINAL_BYTE_MATURE_PACKAGE_CONTINUITY_AND_HOST_FALSE_PASS_GUARD_TARGETED_VERIFIED_INSTALLED_HOST_E2E_DEFERRED_PHASE11'

          p7 = data['phase_evidence']['7']
          p7['status'] = data['phase_status']['7']
          p7['verified_subtasks'] = [
              'Final semantic object inventory is dynamically derived from final canonical business objects and production packages.',
              'REQ-088 source/evidence/assumption/decision lineage resolves to final semantic identities without copying business payload.',
              'Final-byte mature FULL-package continuity reuses full_delivery_depth_v3.audit_host_full_package after all Phase 6/7 mutations and before the definitive ZIP.',
              'Activated Listing and DELIVERY_MANIFEST-declared paths are revalidated on final bytes.',
              'Host/Runtime semantic comparator uses canonical object IDs and semantic SHA-256 values, while production finalization treats any caller-supplied candidate directory as UNAUTHENTICATED_CANDIDATE_DIRECTORY rather than installed Host-native proof.',
              'A Runtime twin can no longer self-certify Host-native parity; installed Host provenance/readback remains E2E_PENDING_INSTALLED_HOST_EXPORT until Phase 11.',
              'Provider planning/job templates cannot self-certify actual-output QA; actual Provider Result/Review/Revision evidence remains Phase 8.'
          ]
          p7['host_false_pass_red'] = {
              'commit': '2f73e410ae90c7c332f2b28df7ad46e02c220bac',
              'current_run': 41427949535,
              'result': 'Permanent CURRENT failed in the Phase 7 verifier after the new regression test rejected authenticating a semantically identical Runtime twin as Host-native.'
          }
          p7['host_false_pass_green'] = {
              'commit': '2e0ead508b3d3a9e4e7ac3c6f6b31bdda1bd5b7d',
              'current_run': 41428154926,
              'result': 'Permanent CURRENT passed Phase 7, requirement accounting, CURRENT build, exact ZIP checks, v0.6.70-v0.6.75 floors and artifact upload.'
          }
          p7['current_release_regression'] = 'GitHub Actions run 41428154926: SUCCESS on production head 2e0ead508b3d3a9e4e7ac3c6f6b31bdda1bd5b7d; Phase 7 verifier, requirement accounting, CURRENT build, exact ZIP checker, v0.6.70-v0.6.75 floors and artifact upload all passed.'
          p7['remaining_phase7'] = []
          p7['deferred_by_plan'] = [
              'Phase 8 owns real Provider Result / Review / smallest Local Revision / lineage-hash actual-output proof.',
              'Phase 10 owns Fresh K01 FULL public-path proof.',
              'Phase 11 owns authenticated installed Host-native export/readback semantic parity, built-plugin readback and final independent release verification.'
          ]
          p7['source_truth'] = 'GITHUB_BRANCH_PHASE7_SOURCE_PACKAGE_TARGETED_VERIFIED'
          p7['production_head_sha'] = '2e0ead508b3d3a9e4e7ac3c6f6b31bdda1bd5b7d'
          p7['current_gate_head_sha'] = '2e0ead508b3d3a9e4e7ac3c6f6b31bdda1bd5b7d'
          p7['remaining_boundary'] = 'NONE inside Phase 7 source/package scope. Real Provider Result/Review/Revision is Phase 8, Fresh K01 FULL is Phase 10, and authenticated installed Host-native provenance/readback semantic parity is Phase 11.'
          p7['host_native_runtime_semantic_parity'] = 'E2E_PENDING_INSTALLED_HOST_EXPORT_PHASE11'
          p7['host_candidate_directory_policy'] = 'UNAUTHENTICATED_CANDIDATE_DIRECTORY_DIAGNOSTIC_ONLY'
          p7['phase7_boundary'] = 'Phase 7 source/package scope is targeted verified: final semantic inventory, REQ-088 lineage, final-byte mature package continuity, and Host false-pass protection are closed. Installed Host-native E2E is intentionally not claimed and is deferred to Phase 11.'
          p7['host_false_pass_guard_commit'] = '2e0ead508b3d3a9e4e7ac3c6f6b31bdda1bd5b7d'

          data['version'] = '2026-11-02-phase7-source-package-closure-v3'
          data['current_phase'] = 'PHASE_7_COMPLETE_SOURCE_PACKAGE_TARGETED_NEXT_PHASE_8'
          data['previous_phase'] = 'PHASE_6_COMPLETE'
          data['next_phase'] = 'PHASE_8_PROVIDER_RESULT_REVIEW_REVISION'
          data['current_head_sha'] = '2e0ead508b3d3a9e4e7ac3c6f6b31bdda1bd5b7d'
          data['current_head_sha_semantics'] = 'Latest Phase 7 production boundary closes the unauthenticated Host-candidate false-pass path while preserving E2E_PENDING_INSTALLED_HOST_EXPORT for authenticated Phase 11 readback. Final semantic inventory, REQ-088 lineage and final-byte mature continuity remain intact.'
          ledger_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          matrix_path = Path('references/REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md')
          text = matrix_path.read_text(encoding='utf-8')
          replacements = {
              'Fresh K01 FULL, Provider actual-output QA, installed-plugin readback, and Phase 7 FULL materialization/lineage remain separate and are not implied by this Phase 6 closure.': 'Phase 7 source/package closure is now complete at targeted proof level; Fresh K01 FULL, Provider actual-output QA, and authenticated installed-plugin/Host-native readback remain later-phase evidence and are not implied by Phase 6 or Phase 7 source/package closure.',
              '| REQ-061 | Canonical commerce object graph | JSON authority → complete MD/HTML projection with stable semantic signature | PHASE1_GRAPH_AUTHORITY + PHASE6_SAME_SOURCE_TARGETED_PROOF + PHASE7_PENDING |': '| REQ-061 | Canonical commerce object graph | JSON authority → complete MD/HTML projection with stable semantic signature | PHASE1_GRAPH_AUTHORITY + PHASE6_SAME_SOURCE_TARGETED_PROOF + PHASE7_FINAL_SEMANTIC_TARGETED_PROOF |',
              '| REQ-070 | A+/PDP/Longform/Specification/Source-document | activated long-form family gets a routed Human Delivery lens and final ZIP continuity | PHASE3 + PHASE6_TARGETED_PROOF + PHASE7_PACKAGE_CONTINUITY_PENDING |': '| REQ-070 | A+/PDP/Longform/Specification/Source-document | activated long-form family gets a routed Human Delivery lens and final ZIP continuity | PHASE3 + PHASE6_TARGETED_PROOF + PHASE7_PACKAGE_CONTINUITY_TARGETED_PROOF |',
              '| REQ-090 | FULL package lineage + actual-output boundary | final semantic inventory + REQ-088 lineage + final-byte mature FULL-package continuity + honest Host/Provider actual-output boundary | PHASE7_SEMANTIC_LINEAGE_AND_FINAL_BYTE_MATURE_PACKAGE_CONTINUITY_TARGETED_PROOF + HOST_PARITY/REAL_PROVIDER_OUTPUT_PENDING |': '| REQ-090 | FULL package lineage + actual-output boundary | final semantic inventory + REQ-088 lineage + final-byte mature FULL-package continuity + honest Host/Provider actual-output boundary | PHASE7_SOURCE_PACKAGE_CLOSURE_AND_HOST_FALSE_PASS_GUARD_TARGETED_PROOF + REAL_PROVIDER_OUTPUT_PHASE8_PENDING + FRESH_K01_PHASE10_PENDING + INSTALLED_HOST_E2E_PHASE11_PENDING |',
              'Phase 7 itself remains IN_PROGRESS only because independently materialized Host-native versus Runtime semantic parity is not yet proven. Provider Result/Review/Revision actual-output evidence remains Phase 8, Fresh positive K01 FULL remains Phase 10, and installed-plugin readback remains Phase 11; none is pulled forward or implied by this Phase 7 targeted closure.': 'Phase 7 source/package scope is now COMPLETE at targeted proof level. The Host/Runtime comparator remains a mechanical semantic comparator, and an arbitrary supplied directory is explicitly diagnostic-only rather than authenticated Host-native proof. Real Provider Result/Review/Revision actual-output evidence remains Phase 8, Fresh positive K01 FULL remains Phase 10, and authenticated installed-plugin/Host-native readback semantic parity remains Phase 11; none is pulled forward or implied by this Phase 7 closure.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'matrix replacement anchor missing: {old}')
              text = text.replace(old, new, 1)
          matrix_path.write_text(text, encoding='utf-8')
          PY
      - name: Validate authority files
        run: |
          python -m json.tool references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json').read_text())
          assert d['phase_status']['7'].startswith('PASS_PHASE7_')
          assert d['phase_evidence']['7']['remaining_phase7'] == []
          assert d['phase_evidence']['7']['host_false_pass_red']['current_run'] == 41427949535
          assert d['phase_evidence']['7']['host_false_pass_green']['current_run'] == 41428154926
          m=Path('references/REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md').read_text()
          assert 'Phase 7 source/package scope is now COMPLETE at targeted proof level.' in m
          assert 'INSTALLED_HOST_E2E_PHASE11_PENDING' in m
          PY
      - name: Commit authority closure and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase7-close-authority-once.yml
          git add references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json references/REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md
          git commit -m 'docs(phase7): close source-package scope fail-honestly'
          git push origin HEAD:repair-04-phase7-full-materialization
