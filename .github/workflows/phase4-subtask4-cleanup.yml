name: phase4-subtask4-cleanup

# One-shot cleanup after committed subtask 4 verification.
on:
  push:
    paths:
      - '.github/workflows/phase4-subtask4-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
      - name: Remove Phase 4 subtask 4 temporary scaffolding
        run: |
          rm -f \
            .github/workflows/phase4-inclusion-red.yml \
            .github/phase4_patch_inclusion.py \
            .github/workflows/phase4-inclusion-green.yml \
            .github/phase4_verify_inclusion.py \
            .github/workflows/phase4-inclusion-postcommit-verify.yml \
            .github/phase4_patch_reference_continuity.py \
            .github/workflows/phase4-reference-continuity-green.yml \
            .github/workflows/phase4-subtask4-cleanup.yml
      - name: Post-clean production smoke
        run: |
          pytest -q \
            tests/test_v0676_phase4_inclusion_execution_authority.py \
            tests/test_reference_guided_optional_prompt_and_capability_continuity.py::test_seven_first_class_capabilities_are_synthesized_from_real_outputs \
            tests/test_v0635_native_reference_provider_integrity.py \
            tests/test_v0676_phase4_scene_derived_photography_authority.py \
            tests/test_v0676_phase4_visual_master_authority.py \
            tests/test_v0676_phase4_visual_master_runtime_binding.py
      - name: Commit cleanup
        run: |
          git config user.name 'cbcc-phase4-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A .github
          git diff --cached --check
          git commit -m 'chore(phase4): remove subtask4 temporary verification scaffolding'
          git push origin HEAD:main
