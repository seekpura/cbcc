name: phase5-prompt-root-cause

on:
  push:
    branches: [phase5-prompt-compiler]
    paths:
      - '.github/workflows/phase5-prompt-root-cause.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localize:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused deps
        run: python -m pip install -q pytest pyyaml
      - name: Locate the exact emitted label in source
        run: |
          set -euxo pipefail
          grep -RIn --exclude-dir='__pycache__' -E 'Typography/layout execution|Typography.*execution|layout execution' runtime tests || true
      - name: Reproduce Phase 5 language-purity RED
        run: pytest -q tests/test_v0631_model_native_prompt_contract.py -x
