name: Apply host-level Chinese delivery contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-host-language-contract.yml'
      - 'scripts/patch_host_language_contract.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch plugin host wrapper authority
        run: python scripts/patch_host_language_contract.py
      - name: Verify patch
        run: |
          grep -q 'Listing 人类字段标题必须中文在前' scripts/build_plugin_dist.py
          grep -q 'HUMAN_LANGUAGE_AUDIT.json' scripts/build_plugin_dist.py
          grep -q '所有英文/马来文/阿语等目标市场外文' scripts/build_plugin_dist.py
      - name: Commit source authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_plugin_dist.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: enforce Chinese-base language contract at plugin host entry'
          git push origin HEAD:main
