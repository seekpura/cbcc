name: CBCC v0.6.17 release verification

on:
  push:
    branches:
      - work/v0617-host-action-mapping

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply action security hardening when needed
        run: python .changes/v0617_security_patch.py

      - name: Apply release documentation
        run: python .changes/v0617_docs_patch.py

      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml

      - name: Verify provider continuity through v0.6.17
        run: |
          pytest -q \
            tests/test_v0613_provider_transport_integrity.py \
            tests/test_v0614_provider_executor_lifecycle.py \
            tests/test_v0615_provider_executor_bridge.py \
            tests/test_v0615_provider_contract_bridge.py \
            tests/test_v0616_provider_host_surface.py \
            tests/test_v0617_host_action_mapping.py \
            tests/test_v0617_secret_field_patterns.py

      - name: Compare full regression against current main
        shell: bash
        run: |
          git fetch origin main
          git worktree add /tmp/cbcc-main origin/main

          set +e
          python -m pytest -q -ra --tb=no > /tmp/v0617-head.txt 2>&1
          head_rc=$?
          (cd /tmp/cbcc-main && python -m pytest -q -ra --tb=no > /tmp/v0616-main.txt 2>&1)
          main_rc=$?
          set -e

          extract_failures() {
            grep -E '^(FAILED|ERROR) ' "$1" \
              | sed -E 's/^(FAILED|ERROR) //' \
              | sed -E 's/ - .*//' \
              | sort -u || true
          }

          extract_failures /tmp/v0617-head.txt > /tmp/head-failures.txt
          extract_failures /tmp/v0616-main.txt > /tmp/main-failures.txt
          comm -23 /tmp/head-failures.txt /tmp/main-failures.txt > /tmp/new-failures.txt
          comm -13 /tmp/head-failures.txt /tmp/main-failures.txt > /tmp/fixed-failures.txt

          head_count=$(wc -l < /tmp/head-failures.txt | tr -d ' ')
          main_count=$(wc -l < /tmp/main-failures.txt | tr -d ' ')
          new_count=$(wc -l < /tmp/new-failures.txt | tr -d ' ')
          fixed_count=$(wc -l < /tmp/fixed-failures.txt | tr -d ' ')

          mkdir -p .changes
          {
            echo "BASE_REF=origin/main"
            echo "BASE_SHA=$(git -C /tmp/cbcc-main rev-parse HEAD)"
            echo "HEAD_SHA=$(git rev-parse HEAD)"
            echo "MAIN_PYTEST_RC=$main_rc"
            echo "HEAD_PYTEST_RC=$head_rc"
            echo "MAIN_FAILURE_COUNT=$main_count"
            echo "HEAD_FAILURE_COUNT=$head_count"
            echo "NEW_FAILURE_COUNT=$new_count"
            echo "FIXED_FAILURE_COUNT=$fixed_count"
            echo
            echo "== NEW FAILURES IN v0.6.17 =="
            cat /tmp/new-failures.txt
            echo
            echo "== FAILURES FIXED BY v0.6.17 =="
            cat /tmp/fixed-failures.txt
            echo
            echo "== MAIN BASELINE FAILURES =="
            cat /tmp/main-failures.txt
            echo
            echo "== v0.6.17 BRANCH FAILURES =="
            cat /tmp/head-failures.txt
            echo
            echo "== MAIN TERMINAL TAIL =="
            tail -30 /tmp/v0616-main.txt
            echo
            echo "== HEAD TERMINAL TAIL =="
            tail -30 /tmp/v0617-head.txt
          } > .changes/v0617-baseline-comparison.txt

          echo "NEW_FAILURE_COUNT=$new_count" >> "$GITHUB_ENV"
          echo "MAIN_FAILURE_COUNT=$main_count" >> "$GITHUB_ENV"
          echo "HEAD_FAILURE_COUNT=$head_count" >> "$GITHUB_ENV"
          echo "FIXED_FAILURE_COUNT=$fixed_count" >> "$GITHUB_ENV"

      - name: Persist regression evidence before release decision
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changes/v0617-baseline-comparison.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: compare v0.6.17 failures against v0.6.16 main"
            git push origin HEAD:work/v0617-host-action-mapping
          fi

      - name: Reject newly introduced regressions
        shell: bash
        run: test "${NEW_FAILURE_COUNT:-unknown}" = "0"

      - name: Record successful release verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CURRENT_HANDOFF.md')
          text = p.read_text(encoding='utf-8')
          needle = '10. v0.6.13–v0.6.17 provider continuity + host-action 定向联测：33 passed。'
          replacement = needle + '\n11. 全量回归与 v0.6.16 main 按失败 node-id 对比：`NEW_FAILURE_COUNT=0`；Action transport 发布不以固定失败数量阈值放行。'
          if replacement not in text:
              text = text.replace(needle, replacement, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('CHANGELOG_V0617.md')
          text = p.read_text(encoding='utf-8')
          line = '- Release regression rule: compare full-suite failure node IDs with current main and ship only when `NEW_FAILURE_COUNT=0`.\n'
          if line not in text:
              text += '\n' + line
          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary diagnostics and release workflow
        run: |
          rm -rf .changes
          git rm -f .github/workflows/v0617-verify.yml

      - name: Finalize clean v0.6.17 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize CBCC v0.6.17 host action mapping"
          git push origin HEAD:work/v0617-host-action-mapping
