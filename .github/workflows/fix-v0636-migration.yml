name: Repair v0.6.36 Migration Quoting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v0636-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair migration source
        run: |
          python scripts/repair_v0636_migration_quotes.py
          python -m py_compile scripts/apply_v0636_seven_tool_continuity.py
      - name: Commit repaired migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_v0636_seven_tool_continuity.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: repair v0.6.36 migration quoting'
            git push origin HEAD:main
          fi
