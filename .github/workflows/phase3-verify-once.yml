name: one-shot-phase3-verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml pillow
      - name: Run Phase 3 plus adjacent regression suites
        run: |
          python -m pytest -q \
            tests/test_v0676_phase3_opportunity_family_evaluation.py \
            tests/test_v0676_phase3_opportunity_family_runtime_binding.py \
            tests/test_v0662_asset_universe_and_package_regressions.py \
            tests/test_v0655_asset_universe_open_world.py \
            tests/test_v0646_asset_family_no_quota.py \
            tests/test_v0646_activation_state_taxonomy.py \
            tests/test_v0633_asset_universe_workspace.py \
            tests/test_v0676_measurement_authority.py \
            tests/test_v0676_measurement_runtime_binding.py \
            tests/test_v0676_measurement_review_regressions.py
      - name: Inspect produced Phase 3 objects
        run: |
          python - <<'PY'
          import json
          from cbcc.opportunity_family_authority import (
              OPPORTUNITY_FAMILY_REGISTRY,
              compile_opportunity_family_evaluation,
              compile_asset_universe_matrix,
              wrap_build_asset_architecture,
          )
          from cbcc.asset_portfolio_workspace import render_asset_portfolio_workspace

          decisions={}
          for row in OPPORTUNITY_FAMILY_REGISTRY:
              fid=row['family_id']
              decisions[fid]={'status':'NOT_NEEDED','why':f'{fid} evaluated','why_not':f'{fid} deliberately omitted for this fixture'}
          decisions['F01_HERO_IDENTITY']={'status':'NEEDED','why':'Truthful first impression required','satisfying_objects':['ASSET-HERO-01']}
          decisions['F02_SELLING_POINT']={'status':'NEEDED','why':'Primary selling point shares the same object','satisfying_objects':['ASSET-HERO-01']}

          def base(project_id,target,questions,content_objects,asset_jobs=None,decision_context=None,category_family='GENERAL_COMMERCE'):
              assert target['phase3_opportunity_family_evaluation']['evaluation_stage']=='PRE_ASSET_ARCHITECTURE'
              return {'status':'DYNAMIC_ASSET_ARCHITECTURE','assets':[{'asset_id':'ASSET-HERO-01','asset_family':'HERO','surface':'GALLERY','deployment_state':'LIVE_CANDIDATE'}], 'asset_universe':{'status':'OPEN_WORLD_ASSET_OPPORTUNITY_UNIVERSE','fixed_total_asset_limit':False}}

          out=wrap_build_asset_architecture(base)('P1',{'delivery_mode':'FULL_PROJECT','opportunity_family_decisions':decisions},[],[])
          matrix=compile_asset_universe_matrix(out['phase3_opportunity_family_evaluation'],out['asset_universe'],out['opportunity_family_fulfillment'])
          portfolio={'summary':{'total_asset_candidates':1,'fixed_total_asset_limit':False},'assets':out['assets'],'phase3_opportunity_family_evaluation':out['phase3_opportunity_family_evaluation'],'opportunity_family_fulfillment':out['opportunity_family_fulfillment']}
          human=render_asset_portfolio_workspace(portfolio)

          missing=dict(decisions); missing.pop('F03_LIFESTYLE_SCENARIO')
          missing_eval=compile_opportunity_family_evaluation(missing,{'delivery_mode':'FULL_PROJECT'})

          summary={
              'status':out['phase3_opportunity_family_evaluation']['status'],
              'family_count':out['phase3_opportunity_family_evaluation']['family_count'],
              'needed_family_ids':out['phase3_opportunity_family_evaluation']['needed_family_ids'],
              'shared_object':out['phase3_opportunity_family_evaluation']['families'][0]['satisfying_objects']==out['phase3_opportunity_family_evaluation']['families'][1]['satisfying_objects'],
              'fulfillment_status':out['opportunity_family_fulfillment']['status'],
              'fulfilled_needed_family_count':out['opportunity_family_fulfillment']['fulfilled_needed_family_count'],
              'matrix_status':matrix['status'],
              'matrix_stage':matrix['evaluation_stage'],
              'fixed_asset_quota_per_family':matrix['fixed_asset_quota_per_family'],
              'human_has_family_workspace':'机会族评估' in human and 'F01_HERO_IDENTITY' in human and 'FULFILLED' in human,
              'missing_family_status':missing_eval['status'],
              'missing_family_visible':any(x['family_id']=='F03_LIFESTYLE_SCENARIO' and x['status']=='TO_VERIFY' for x in missing_eval['families']),
          }
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          assert summary=={
              'status':'READY','family_count':23,'needed_family_ids':['F01_HERO_IDENTITY','F02_SELLING_POINT'],
              'shared_object':True,'fulfillment_status':'READY','fulfilled_needed_family_count':2,
              'matrix_status':'READY','matrix_stage':'PRE_ASSET_ARCHITECTURE_WITH_POST_ASSET_FULFILLMENT',
              'fixed_asset_quota_per_family':False,'human_has_family_workspace':True,
              'missing_family_status':'TO_VERIFY','missing_family_visible':True,
          }
          PY
