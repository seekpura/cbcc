name: CBCC v0.6.20 MCP host verification

on:
  push:
    branches:
      - work/v0620-mcp-host

permissions:
  contents: write

jobs:
  verify-mcp-host:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test and official MCP dependencies
        run: |
          python -m pip install -q pytest pyyaml
          python -m pip install -q -r requirements-mcp.txt
      - name: Run provider continuity through real MCP transports
        shell: bash
        run: |
          mkdir -p .changes
          set +e
          pytest -q -ra \
            tests/test_v0613_provider_transport_integrity.py \
            tests/test_v0614_provider_executor_lifecycle.py \
            tests/test_v0615_provider_executor_bridge.py \
            tests/test_v0615_provider_contract_bridge.py \
            tests/test_v0616_provider_host_surface.py \
            tests/test_v0617_host_action_mapping.py \
            tests/test_v0617_secret_field_patterns.py \
            tests/test_v0618_transport_descriptors.py \
            tests/test_v0619_plugin_http_host.py \
            tests/test_v0619_http_auth_failclosed.py \
            tests/test_v0620_mcp_host.py \
            tests/test_v0620_mcp_transports.py \
            tests/test_v0620_mcp_http_security.py \
            > .changes/v0620-test-output.txt 2>&1
          rc=$?
          set -e
          echo "$rc" > .changes/v0620-test-output.rc
          cat .changes/v0620-test-output.txt
      - name: Capture installed MCP version
        if: always()
        shell: bash
        run: |
          python - <<'PY' > .changes/v0620-mcp-version.txt
          from importlib.metadata import version
          print(version('mcp'))
          PY
      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changes/v0620-test-output.txt .changes/v0620-test-output.rc .changes/v0620-mcp-version.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: capture v0.6.20 MCP host diagnostics"
            git push origin HEAD:work/v0620-mcp-host
          fi
      - name: Enforce targeted test result
        if: always()
        shell: bash
        run: test "$(cat .changes/v0620-test-output.rc)" = "0"
