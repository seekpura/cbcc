name: CBCC FULL strategy hard-contract repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_full_strategy_contract.py'
      - 'scripts/repair_full_skill_authority.py'
      - '.github/workflows/repair-full-strategy-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic runtime and Skill repairs
        run: |
          python scripts/repair_full_strategy_contract.py
          python scripts/repair_full_skill_authority.py
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt pytest
      - name: Verify FULL and task-scoped semantics together
        env:
          PYTHONPATH: runtime
        run: |
          pytest -q \
            tests/test_full_strategy_hard_contract.py \
            tests/test_v0624_strategy_asset_scope.py \
            tests/test_v0625_decision_question_authority.py
          grep -q 'FULL vs TASK_SCOPED Delivery Authority' SKILL.md
          grep -q 'C 级证据不得形成硬宣称' SKILL.md
          grep -q '自包含 `index.html`' SKILL.md
      - name: Commit repaired authority if changed
        run: |
          if git diff --quiet -- runtime/cbcc/strategy_depth.py SKILL.md; then
            echo 'Runtime and Skill authority already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/cbcc/strategy_depth.py SKILL.md
          git commit -m 'fix: reconcile FULL hard contract with task-scoped autonomy'
          git push origin HEAD:main
