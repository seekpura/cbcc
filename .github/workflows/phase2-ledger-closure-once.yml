name: one-shot-phase2-ledger-closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2-ledger-closure-once.yml'

permissions:
  contents: write

jobs:
  close-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch CURRENT ledger from verified Measurement consumer map
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ledger_path = Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json')
          map_path = Path('references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE2_MEASUREMENT.json')
          text = ledger_path.read_text(encoding='utf-8')
          ledger = json.loads(text)
          measurement = json.loads(map_path.read_text(encoding='utf-8'))
          decoder = json.JSONDecoder()

          def replace_value(src, key, value, start=0):
              token = json.dumps(key) + ':'
              pos = src.find(token, start)
              if pos < 0:
                  token = json.dumps(key) + ': '
                  pos = src.find(token, start)
              if pos < 0:
                  raise RuntimeError(f'key not found: {key}')
              colon = src.find(':', pos)
              vstart = colon + 1
              while vstart < len(src) and src[vstart].isspace():
                  vstart += 1
              _, used = decoder.raw_decode(src[vstart:])
              vend = vstart + used
              encoded = json.dumps(value, ensure_ascii=False, separators=(',', ':'))
              return src[:vstart] + encoded + src[vend:]

          # REQ status accounting remains partial globally where later phases still own work.
          reqs = ledger['new_requirements']
          status_by_req = {
              'REQ-062': 'PARTIAL_PHASE2_INFORMATION_AUDIT_PRODUCT_TRUTH_MARKET_RESEARCH_CONTEXT_WHY_INTERSECTIONALITY_CULTURE_STRATEGY_FRAMEWORKS_ECONOMICS_OFFER_LISTING_SEARCH_CONTENT_MATRIX_RACE_ADS_OPTIMIZATION_REVIEW_ANALYSIS_AND_MEASUREMENT_VERIFIED',
              'REQ-078': 'PARTIAL_PHASE2_ADS_AND_MEASUREMENT_TEST_CONTRACTS_VERIFIED',
              'REQ-088': 'PARTIAL_PHASE2_INFORMATION_AUDIT_PRODUCT_TRUTH_RESEARCH_CONTEXT_WHY_INTERSECTIONALITY_CULTURE_STRATEGY_FRAMEWORK_ECONOMICS_LISTING_SEARCH_CONTENT_MATRIX_RACE_ADS_OPTIMIZATION_REVIEW_ANALYSIS_AND_MEASUREMENT_LINEAGE_VERIFIED',
          }
          for row in reqs:
              if row.get('req') in status_by_req:
                  row['status'] = status_by_req[row['req']]
          text = replace_value(text, 'new_requirements', reqs)

          phase_status = dict(ledger['phase_status'])
          phase_status['2'] = 'PASS_PHASE2_FULL_BUSINESS_OBJECT_DENSITY_VERIFIED'
          text = replace_value(text, 'phase_status', phase_status)

          # Reparse after the two outer replacements, then patch only Phase 2 fields.
          current = json.loads(text)
          p2 = current['phase_evidence']['2']
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          if p2_start < 0:
              raise RuntimeError('phase_evidence.2 not found')

          text = replace_value(text, 'status', 'PASS_PHASE2_FULL_BUSINESS_OBJECT_DENSITY_VERIFIED', p2_start)

          subtasks = list(p2['verified_subtasks'])
          measurement_subtask = 'Measurement / A-B / P0-P1-P2 / next-input first-class authority with metric truth, isolated test contracts, REQ-088 lineage, compatible Strategy section09 projection and post-result learning boundary'
          if measurement_subtask not in subtasks:
              subtasks.append(measurement_subtask)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_value(text, 'verified_subtasks', subtasks, p2_start)

          focused = dict(p2['focused_tests'])
          focused['measurement_authority'] = '9 passed core first-class Measurement authority'
          focused['measurement_runtime_binding'] = '3 passed Strategy projection, delivery validation and v0.6.76 installation/no-eighth-tool binding'
          focused['measurement_review_regressions'] = '10 passed decision-contract, lineage, projection-compatibility, duplicate-ID, sibling-preservation and canonical-preference false-pass guards'
          focused['runtime_bindings'] = 'GitHub main source readback verified for Market Research and the v0.6.76 Information Audit + Context WHY + Intersectionality/Culture + Strategy/Frameworks + Economics/Offer + Complete Listing/Search + Content Matrix/RACE + Advertising Optimization + Review Analysis + Measurement closure; Measurement installs only as Strategy/delivery wrappers, creates no eighth Seven-tool capability, and canonical MEASUREMENT prefers Strategy section09 over experiment_analysis.json.'
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_value(text, 'focused_tests', focused, p2_start)

          cross = p2['cross_scope_tests']
          measurement_cross = ' The final Measurement batch passed 22/22 fresh focused tests: Measurement authority 9 + runtime binding 3 + review/false-pass/canonical checks 10. No GitHub CI status/workflow run exists for the final #12 code commit, so prior #10/#11 regression counts are not claimed as rerun. Fresh #12 adjacent verification proves Measurement preserves unrelated Strategy 04/06/07 plus Review/Economics siblings, canonical MEASUREMENT remains Strategy section09 ahead of experiment_analysis.json, and GitHub compare from #11 ledger closure 3b6eb5bcabb0cfca5eb1783ca98d9b044d9788f1 through 757d97e57101bb436c6b4d8378dde86de926c282 changes only five #12 files with v0676_phase2_closure.py additive +20/-0.'
          if 'The final Measurement batch passed 22/22' not in cross:
              cross += measurement_cross
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_value(text, 'cross_scope_tests', cross, p2_start)

          proof = list(p2['proof_objects'])
          for item in [
              'runtime/cbcc/measurement_authority.py',
              'runtime/cbcc/tools/experiment.py',
              'runtime/cbcc/learning_loop.py',
              'tests/test_v0676_measurement_authority.py',
              'tests/test_v0676_measurement_runtime_binding.py',
              'tests/test_v0676_measurement_review_regressions.py',
              'references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE2_MEASUREMENT.json',
          ]:
              if item not in proof:
                  proof.append(item)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_value(text, 'proof_objects', proof, p2_start)

          behaviors = list(p2['verified_behaviors'])
          for item in measurement['verified_behavior']:
              if item not in behaviors:
                  behaviors.append(item)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_value(text, 'verified_behaviors', behaviors, p2_start)

          inspection = p2['produced_object_inspection']
          measurement_inspection = " Measurement inspection produced READY for M-01 with row_status=READY, baseline=0.21, target_or_mde=0.03, metric_source_ref=SRC-MEASURE, attribution_method=FIRST_PARTY_SESSION_EXPERIMENT, changed_variable=FIRST_IMPRESSION_PROPOSITION, held_constants=[PRICE, SKU, AUDIENCE, PLACEMENT, PDP_BODY], two distinct variants, priority_order=[P0,P1,P2], priority_status=READY, next_input_status=READY, experiment_decision=INCONCLUSIVE and post_production_learning_status=DEFERRED_TO_LEARNING_LOOP_WHEN_REAL_RESULTS_EXIST with issue_count=0. Adding the changed variable to held_constants changed status to TO_VERIFY with FULL_MEASUREMENT_AB_TEST_CONTRACT_INVALID_V0676; replacing P0 decision_ref with M-NOT-REAL produced FULL_MEASUREMENT_PRIORITY_PLAN_INCOMPLETE_V0676; generic 'need more data' plus an unresolved decision_ref produced FULL_MEASUREMENT_NEXT_INPUT_PLAN_INCOMPLETE_V0676; duplicate measurement_id=M-01 produced FULL_MEASUREMENT_ID_DUPLICATE_V0676; removing baseline kept baseline=null and produced FULL_MEASUREMENT_BUSINESS_OBJECT_INCOMPLETE_V0676."
          if 'Measurement inspection produced READY for M-01' not in inspection:
              inspection += measurement_inspection
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_value(text, 'produced_object_inspection', inspection, p2_start)

          deferred = [
              'Post-production strategy learning/revision remains runtime/cbcc/learning_loop.py and requires real measured result evidence; Phase 2 Measurement readiness alone does not claim that learning has run.',
              'Production actual-output QA, Provider Result review and local production revision remain separate later execution/review authorities and are not claimed by customer Review Analysis.',
              'Paid Campaign Architecture and asset-level paid creative remain later asset/production consumers; Phase 2 business authorities do not make them prerequisites for business readiness.',
              'Deep-skin exposure, reflector/diffusion, hair/body/disability/age/AI-bias production execution remains later Visual/Art Direction work and is not claimed by these Phase 2 business objects.',
              'JSON→MD→HTML same-source Human projection remains Phase 6; no HTML was modified by Phase 2 Measurement closure.',
              'Fresh real K01 FULL remains Phase 10; built plugin readback remains Phase 11.',
              'Provider Result / actual-output QA remains E2E_PENDING.',
          ]
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_value(text, 'deferred_boundaries', deferred, p2_start)

          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_value(text, 'remaining_phase2', 'NONE — Phase 2 subtasks 1–12 verified against the locked acceptance rule; later phases and Phase 6/10/11 release boundaries remain separate.', p2_start)

          commits = list(p2['source_commits'])
          for sha in measurement['source_commits']:
              if sha not in commits:
                  commits.append(sha)
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          text = replace_value(text, 'source_commits', commits, p2_start)

          # ci_status is new in Phase 2; insert it after source_commits if absent.
          p2_start = text.find('"2":', text.find('"phase_evidence"'))
          p2_end_obj, p2_used = decoder.raw_decode(text[text.find('{', p2_start):])
          p2_end = text.find('{', p2_start) + p2_used
          if '"ci_status"' not in text[p2_start:p2_end]:
              sc_pos = text.find('"source_commits"', p2_start)
              colon = text.find(':', sc_pos)
              vstart = colon + 1
              while text[vstart].isspace(): vstart += 1
              _, used = decoder.raw_decode(text[vstart:])
              vend = vstart + used
              text = text[:vend] + ',\n      "ci_status": "NO_GITHUB_COMMIT_STATUS_OR_WORKFLOW_RUN_AVAILABLE_FOR_FINAL_PHASE2_CODE_COMMIT"' + text[vend:]

          # Semantic verification before writing.
          final = json.loads(text)
          p2f = final['phase_evidence']['2']
          assert final['phase_status']['2'] == 'PASS_PHASE2_FULL_BUSINESS_OBJECT_DENSITY_VERIFIED'
          assert p2f['status'] == 'PASS_PHASE2_FULL_BUSINESS_OBJECT_DENSITY_VERIFIED'
          assert len(p2f['verified_subtasks']) == 12
          assert p2f['remaining_phase2'].startswith('NONE')
          assert final['phase_status']['3'] == 'NOT_STARTED'
          assert p2f['real_k01_full'] == 'PENDING_PHASE10'
          assert p2f['built_plugin_readback'] == 'PENDING_PHASE11'
          assert p2f['provider_actual_output'] == 'E2E_PENDING'
          assert '5f374894f5424b5ff5336022b9591abf55833367' in p2f['source_commits']
          assert final['phase_evidence']['0']['source_commits'] == ledger['phase_evidence']['0']['source_commits']
          assert final['phase_evidence']['1'] == ledger['phase_evidence']['1']
          ledger_path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified ledger closure
        shell: bash
        run: |
          git config user.name 'cbcc-phase2-closure'
          git config user.email 'actions@users.noreply.github.com'
          git add references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs: close verified Phase 2 Measurement and business density'
          git push origin HEAD:main
