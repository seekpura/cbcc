name: v0.6.47 FULL delivery depth recovery

on:
  pull_request:
    paths:
      - 'runtime/cbcc/**'
      - 'prompts/**'
      - 'scripts/build_plugin_dist_v0647.py'
      - 'scripts/check_v0647_full_delivery_depth.py'
      - 'tests/test_v0647_*.py'
      - 'SKILL.md'
      - 'VERSION'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed runtime
        run: python -m compileall -q runtime/cbcc
      - name: Focused regression tests
        run: >-
          pytest -q
          tests/test_v0647_full_delivery_depth_materialization.py
          tests/test_v0647_real_package_contract_regression.py
          tests/test_v0647_full_package_content_hardening.py
          tests/test_v0647_video_html_and_language_consumer.py
      - name: Build plugin release
        run: python scripts/build_plugin_dist_v0647.py --output-dir dist_v0647
      - name: Release guard
        run: python scripts/check_v0647_full_delivery_depth.py dist_v0647
