name: phase7-req088-sync-ledger-matrix

permissions:
  contents: write

on:
  push:
    branches: [repair-04-phase7-full-materialization]
    paths:
      - '.github/workflows/phase7-req088-sync-ledger-matrix.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-04-phase7-full-materialization
      - name: Sync REQ-088 targeted status without completing Phase 7
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ledger_path = Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json')
          data = json.loads(ledger_path.read_text(encoding='utf-8'))
          rows = {row['req']: row for row in data.get('new_requirements', []) if isinstance(row, dict) and row.get('req')}
          if 'REQ-088' not in rows or 'REQ-090' not in rows:
              raise SystemExit('REQ-088/REQ-090 missing from execution ledger')
          rows['REQ-088']['status'] = 'PASS_PHASE2_PHASE7_RESOLVABLE_SOURCE_EVIDENCE_ASSUMPTION_DECISION_LINEAGE_TARGETED_VERIFIED'
          rows['REQ-090']['status'] = 'PARTIAL_PHASE7_FINAL_PACKAGE_SEMANTIC_INVENTORY_REQ088_LINEAGE_AND_ACTUAL_OUTPUT_BOUNDARY_TARGETED_VERIFIED_HOST_PARITY_AND_REAL_PROVIDER_OUTPUT_PENDING'
          data.setdefault('phase_status', {})['7'] = 'IN_PROGRESS_FINAL_PACKAGE_SEMANTIC_AND_REQ088_LINEAGE_TARGETED_VERIFIED_REQ090_HOST_PARITY_AND_REAL_PROVIDER_OUTPUT_PENDING'
          phase7 = data.setdefault('phase_evidence', {}).setdefault('7', {})
          phase7['req088_lineage_status'] = 'PASS_TARGETED_RESOLVABLE_LINEAGE'
          phase7['req088_authority_contract'] = 'runtime/cbcc/information_audit_authority.py::LINEAGE_FIELDS'
          phase7['req088_runtime'] = [
              'runtime/cbcc/lineage_normalization_v0681.py',
              'runtime/cbcc/phase7_lineage_semantic_closure_v0681.py',
              'runtime/cbcc/commercial_delivery_continuity.py',
          ]
          phase7['req088_proof_objects'] = [
              'LINEAGE_CLOSURE_INDEX.json',
              'LINEAGE_CLOSURE_AUDIT.json',
              'DELIVERY_MANIFEST.json lineage_closure_*',
              'references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE7_REQ088_LINEAGE.json',
          ]
          phase7['req088_verification'] = {
              'normalization_red_run': 41409131132,
              'normalization_first_green_run': 41409310465,
              'final_export_red_run': 41409419368,
              'orchestrator_green_run': 41409620978,
              'production_wrapper_red_run': 41409703978,
              'production_wrapper_green_run': 41409955437,
              'mature_authority_scanner_red_run': 41410109202,
              'focused_final_green_run': 41410264207,
              'permanent_current_green_run': 41410654676,
          }
          phase7['req088_verified_behavior'] = [
              'Canonical LINEAGE_FIELDS are normalized as authority bindings/resolution evidence rather than a second business payload.',
              'Unresolved source/proof/downstream lineage cannot fake PASS.',
              'Explicit TO_VERIFY/assumption boundaries remain explicit.',
              'Nested evidence descriptors are not double-counted as independent business lineage records.',
              'Production export materializes lineage before final semantic inventory/Manifest/ZIP rebuild.',
          ]
          phase7['remaining_boundary'] = 'Phase 7 remains IN_PROGRESS. Independently materialized Host-native parity and real Provider Result→Review→Revision/hash evidence are not claimed by REQ-088 and remain pending under REQ-090/later planned proof.'
          ledger_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          matrix_path = Path('references/REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md')
          text = matrix_path.read_text(encoding='utf-8')
          old88 = '| REQ-088 | Source/Evidence/Assumption/Decision lineage | exact source→interpretation→decision→proof trace | PHASE2_LINEAGE_TARGETED_PROOF + PHASE7_FULL_LINEAGE_PENDING |'
          new88 = '| REQ-088 | Source/Evidence/Assumption/Decision lineage | exact source→authority/type→recency→fact→interpretation→confidence→assumption→downstream→conflict→decision/tradeoff→proof trace with resolvable final semantic targets | PASS_PHASE2_PHASE7_RESOLVABLE_LINEAGE_TARGETED_PROOF |'
          old90 = '| REQ-090 | FULL package lineage + actual-output boundary | machine/human/editable/production package + honest E2E_PENDING | PHASE7/8/10_PENDING |'
          new90 = '| REQ-090 | FULL package lineage + actual-output boundary | final semantic inventory + REQ-088 lineage + honest Host/Provider actual-output boundary | PHASE7_SEMANTIC_AND_LINEAGE_TARGETED_PROOF + HOST_PARITY/REAL_PROVIDER_OUTPUT_PENDING |'
          if text.count(old88) != 1 or text.count(old90) != 1:
              raise SystemExit('expected REQ-088/REQ-090 matrix rows not found exactly once')
          text = text.replace(old88, new88).replace(old90, new90)
          old_boundary = 'This does **not** close Phase 7 source/evidence/assumption/decision lineage and FULL package continuity, Fresh positive K01 FULL, Provider/Result/Review/Revision, installed-plugin readback, or actual-output QA.'
          new_boundary = 'Phase 7 REQ-088 source/evidence/assumption/decision lineage is now closed at targeted source/CURRENT-package proof level by `REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE7_REQ088_LINEAGE.json`; Phase 7 itself remains IN_PROGRESS because independently materialized Host-native parity, real Provider/Result/Review/Revision actual-output evidence, remaining FULL package continuity, Fresh positive K01 FULL and installed-plugin readback are still separate pending proof.'
          if text.count(old_boundary) != 1:
              raise SystemExit('matrix evidence-boundary sentence not found exactly once')
          matrix_path.write_text(text.replace(old_boundary, new_boundary), encoding='utf-8')
          PY
      - name: Commit targeted ledger and matrix sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json references/REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md
          git diff --cached --check
          git commit -m "docs(phase7): mark REQ-088 lineage targeted verified"
          git push origin HEAD:repair-04-phase7-full-materialization
