name: phase7-mature-package-characterization

on:
  push:
    branches: [repair-04-phase7-full-materialization]
    paths:
      - 'runtime/cbcc/full_package_semantic_closure_v0681.py'
      - 'runtime/cbcc/phase7_lineage_semantic_closure_v0681.py'
      - 'tests/test_v0681_phase7_final_mature_package_continuity.py'
      - '.github/workflows/phase7-mature-package-characterization.yml'
  workflow_dispatch:

jobs:
  mature-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install focused dependencies
        run: python -m pip install pyyaml pytest
      - name: Characterize final-byte mature package continuity
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: python -m pytest -q tests/test_v0681_phase7_final_mature_package_continuity.py
