name: R06-05 Professional Completeness RED

on:
  push:
    branches: [r06-05-professional-completeness-red]

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r06-05-professional-completeness-red
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest pyyaml openpyxl
      - name: Reproduce explicit C claim escalation
        env:
          PYTHONPATH: .:runtime
        run: python -m pytest -q tests/test_v0682_r0605_professional_capability_completeness.py
