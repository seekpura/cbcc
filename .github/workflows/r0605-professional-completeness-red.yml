name: R06-05 Professional Completeness Verification

on:
  push:
    branches: [r06-05-professional-completeness-red]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r06-05-professional-completeness-red
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest pyyaml openpyxl
      - name: Verify A-K professional input-analysis-decision-downstream behavior
        env:
          PYTHONPATH: .:runtime
        run: >-
          python -m pytest -q
          tests/test_v0682_r0605_professional_capability_completeness.py
          tests/test_v0682_r0605_professional_capability_matrix.py
          tests/test_v065_saas_prompt_integrity.py::test_claim_authority_does_not_trust_labels_without_evidence
          tests/test_v0676_product_truth_evidence_authority.py
      - name: Verify v0.6.76 professional authority suite
        env:
          PYTHONPATH: .:runtime
        run: python -m pytest -q tests/test_v0676_*.py
      - name: Verify Repair-06 cumulative task suites
        env:
          PYTHONPATH: .:runtime
        run: python -m pytest -q tests/test_v0682_r060*.py
