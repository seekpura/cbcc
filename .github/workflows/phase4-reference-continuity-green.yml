name: phase4-reference-continuity-green

on:
  push:
    paths:
      - '.github/phase4_patch_reference_continuity.py'
      - '.github/workflows/phase4-reference-continuity-green.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
      - name: Apply reference continuity patch
        run: python .github/phase4_patch_reference_continuity.py
      - name: Focused reference-continuity GREEN
        run: |
          pytest -q \
            tests/test_reference_guided_optional_prompt_and_capability_continuity.py::test_seven_first_class_capabilities_are_synthesized_from_real_outputs \
            tests/test_v0635_native_reference_provider_integrity.py \
            tests/test_v0646_subject_*.py
      - name: Phase 4 cross-scope regression
        run: |
          pytest -q \
            tests/test_reference_guided_optional_prompt_and_capability_continuity.py \
            tests/test_v0676_phase4_inclusion_execution_authority.py \
            tests/test_v0676_intersectionality_culture_authority.py \
            tests/test_v0670_human_projection_integrity.py \
            tests/test_v0676_phase4_visual_route_art_direction.py \
            tests/test_v0676_phase4_scene_derived_photography_authority.py \
            tests/test_v0676_phase4_visual_master_authority.py \
            tests/test_v0676_phase4_visual_master_runtime_binding.py \
            tests/test_v0635_native_reference_provider_integrity.py \
            tests/test_v0646_subject_*.py
      - name: Runtime proof
        run: |
          python - <<'PY'
          from cbcc.tools.seven_agent import compile_seven_agent_synthesis
          syn=compile_seven_agent_synthesis(
              domain={'market':{'status':'READY'},'economics':{'status':'READY','currency':'MYR'},'listing':{'status':'READY','compiled':{}},'ads':{},'feedback':{}},
              architecture={'assets':[]},
              source_product_assets=[{'asset_id':'P','source_usage':'DESIGN_REFERENCE'}],
          )
          assert syn['asset_inputs']['status']=='COMMERCE_DECISION_CONTEXT_COMPILED'
          assert syn['asset_inputs']['product_sources']=={'count':1,'default_usage':'DESIGN_REFERENCE'}
          assert syn['asset_input_summary']['product_sources']=={'count':1,'default_usage':'DESIGN_REFERENCE'}
          print(syn['asset_inputs']['product_sources'])
          PY
      - name: Commit production GREEN
        run: |
          git config user.name 'cbcc-phase4-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/cbcc/commercial_continuity_authority.py
          git diff --cached --check
          git commit -m 'fix(phase4): preserve product reference continuity through commerce wrapper'
          git push origin HEAD:main
