name: CBCC v0.6.29 final stabilization

on:
  push:
    branches:
      - work/v0629-final-stabilization

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen v0.6.28 main
        run: test "$(git rev-parse origin/main)" = "7b100b483ba2428fae57d3410baddf3ad9675e3e"

      - name: Apply only the three real-defect fixes and release metadata
        run: |
          python .changes/v0629_final_fix.py
          python .changes/v0629_compliance_route_fix.py
          python .changes/v0629_prepare_release.py
          python -m py_compile runtime/cbcc/tools/listing.py runtime/cbcc/compliance.py runtime/cbcc/prompt_compiler.py runtime/cbcc/compiler.py

      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml

      - name: Targeted real-defect fixes and recent autonomy continuity
        env:
          PYTHONPATH: runtime
        run: |
          pytest -q \
            tests/test_v0629_final_stabilization.py \
            tests/test_v0513_real_product_strategy_quality.py::test_v0513_final_copy_allows_extra_number_only_when_field_claim_ref_authorizes_it \
            tests/test_alpha4_production_video_compliance.py::test_compliance_binds_assets_to_approved_claim_ids_and_research \
            tests/test_alpha3_platform_listing_assets.py::test_kiyuu_alpha3_compiles_asset_packages \
            tests/test_v065_saas_prompt_integrity.py \
            tests/test_v0625_decision_question_authority.py \
            tests/test_v0626_scope_readiness.py \
            tests/test_v0627_current_scope_completion.py \
            tests/test_v0628_agent_frontier_scope.py

      - name: Full regression node-id diff and require real fixes
        env:
          PYTHONPATH: runtime
        run: |
          set +e
          pytest -q > /tmp/branch.txt 2>&1
          branch_rc=$?
          git worktree add /tmp/cbcc-main 7b100b483ba2428fae57d3410baddf3ad9675e3e
          (cd /tmp/cbcc-main && PYTHONPATH=runtime pytest -q > /tmp/main.txt 2>&1)
          main_rc=$?
          set -e
          echo "BRANCH_PYTEST_RC=$branch_rc"
          echo "MAIN_PYTEST_RC=$main_rc"
          python - <<'PY'
          from pathlib import Path
          import re
          def failed(path):
              text=Path(path).read_text(encoding='utf-8',errors='replace')
              return sorted(set(re.findall(r'^FAILED\s+([^\s]+)',text,re.M)))
          branch=failed('/tmp/branch.txt')
          main=failed('/tmp/main.txt')
          new=sorted(set(branch)-set(main))
          fixed=sorted(set(main)-set(branch))
          print('MAIN_FAILURE_COUNT=',len(main))
          print('BRANCH_FAILURE_COUNT=',len(branch))
          print('NEW_FAILURE_COUNT=',len(new))
          print('FIXED_FAILURE_COUNT=',len(fixed))
          if fixed:
              print('FIXED_FAILURES:')
              print('\n'.join(fixed))
          if new:
              print('NEW_FAILURES:')
              print('\n'.join(new))
              raise SystemExit(1)
          if not fixed:
              raise SystemExit('v0.6.29 must fix at least one baseline failure; refusing no-op release')
          PY

      - name: Create clean final release commit
        run: |
          rm -f .changes/v0629_final_fix.py .changes/v0629_compliance_route_fix.py .changes/v0629_prepare_release.py
          rmdir .changes 2>/dev/null || true
          rm -f .github/workflows/v0629-final-stabilization.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: finalize CBCC v0.6.29 stabilization"
          git push origin HEAD:work/v0629-final-stabilization
