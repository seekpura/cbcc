name: phase4-close-current-v2

on:
  push:
    branches: [phase4-closure]
    paths:
      - '.github/workflows/phase4-close-current-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase4-close-current:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: runtime
      PRODUCTION_HEAD: 63eab0ab46ce5a251592b1a3363b03b99c3b4adf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -q pytest pyyaml pillow
      - name: Prepare Phase 4 CURRENT consumer map and ledgers
        run: python .github/phase4_close_current.py
      - name: Focused committed Phase 4 verification
        run: |
          files=(tests/test_v0676_phase4_*.py)
          test -e "${files[0]}"
          pytest -q "${files[@]}" --junitxml=/tmp/phase4-focused.xml
      - name: Explicit adjacent consumer cross-scope proof
        run: |
          pytest -q \
            tests/test_v0676_phase3_opportunity_family_evaluation.py \
            tests/test_v0676_phase3_opportunity_family_runtime_binding.py \
            tests/test_v0662_asset_universe_and_package_regressions.py \
            tests/test_v0655_asset_universe_open_world.py \
            tests/test_v0646_asset_family_no_quota.py \
            tests/test_v0646_activation_state_taxonomy.py \
            tests/test_v0633_asset_universe_workspace.py \
            tests/test_v0676_listing_search_authority.py \
            tests/test_v0676_listing_search_context_bridge.py \
            tests/test_v0676_listing_search_runtime_binding.py \
            tests/test_v0676_canonical_commerce_graph.py \
            tests/test_v0670_human_projection_integrity.py \
            tests/test_v0635_native_reference_provider_integrity.py \
            --junitxml=/tmp/phase4-cross.xml
      - name: Finalize CURRENT ledgers with actual JUnit counts
        run: |
          python .github/phase4_close_current.py \
            --focused-junit /tmp/phase4-focused.xml \
            --cross-junit /tmp/phase4-cross.xml
      - name: Validate closure truth and Phase 5 boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledger=json.loads(Path('references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json').read_text(encoding='utf-8'))
          cmap=json.loads(Path('references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE4_ART_DIRECTION_PHOTOGRAPHY_VISUAL_MASTER.json').read_text(encoding='utf-8'))
          matrix=Path('references/REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md').read_text(encoding='utf-8')
          assert ledger['phase_status']['4']=='PASS_PHASE4_ART_DIRECTION_PHOTOGRAPHY_VISUAL_MASTER_VERIFIED'
          assert ledger['phase_evidence']['4']['focused_tests']['status']=='PASS'
          assert ledger['phase_evidence']['4']['cross_scope_tests']['status']=='PASS'
          assert cmap['phase_evidence']['focused_result']['status']=='PASS'
          assert cmap['phase_evidence']['cross_scope_result']['status']=='PASS'
          assert cmap['phase_evidence']['real_product_probes']['status']=='PENDING_FRESH_K01_FULL'
          assert ledger['next_phase']=='PHASE_5_PROMPT_RENDERER_CPP'
          assert 'PHASE5_PENDING' in matrix or 'PHASE5/7_E2E_PENDING' in matrix
          PY
          changed=$(git diff --name-only "$PRODUCTION_HEAD"...HEAD)
          if printf '%s\n' "$changed" | grep -E '^runtime/|^tests/' ; then
            echo 'Closure branch changed runtime/tests after verified Phase 4 production head.' >&2
            exit 1
          fi
      - name: Recheck dynamic lifecycle invariants on committed production bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('runtime/cbcc/compiler.py').read_text(encoding='utf-8')
          build="video_plan=build_video_creator_plan(request.get('project_id','project'),objects,questions,lang.to_dict(),request.get('video_jobs'),assets=architecture.get('assets'),creative_council=council)"
          project='architecture=project_dynamic_art_direction_to_assets(architecture,video_plan)'
          write="aap=_write(p/'artifacts/asset_architecture.json',architecture)"
          assert text.index(build) < text.index(project) < text.index(write)
          assert text.count(build)==1
          PY
      - name: Remove temporary Phase 4 verification scaffolding
        run: |
          rm -f \
            .github/phase4_patch_dynamic_art_direction.py \
            .github/phase4_close_current.py \
            .github/workflows/phase4-dynamic-art-direction-red.yml \
            .github/workflows/phase4-dynamic-art-direction-green.yml \
            .github/workflows/phase4-close-current.yml \
            .github/workflows/phase4-close-current-v2.yml
          test -f tests/test_v0676_phase4_dynamic_surface_art_direction.py
      - name: Commit isolated Phase 4 closure
        run: |
          git config user.name 'cbcc-phase4-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(phase4): close art-direction authority and clean scaffolding'
          git push origin HEAD:phase4-closure
