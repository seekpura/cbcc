name: phase5-dynamic-prompt-red

on:
  push:
    branches: [phase5-dynamic-prompt-continuity]
    paths:
      - 'tests/test_v0676_phase5_dynamic_prompt_continuity.py'
      - '.github/workflows/phase5-dynamic-prompt-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5-dynamic-prompt-continuity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest pyyaml openpyxl
      - name: Reproduce Phase 4 canonical dynamic schema loss in Prompt compiler
        run: pytest -q tests/test_v0676_phase5_dynamic_prompt_continuity.py
