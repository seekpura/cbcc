name: phase4-inclusion-green

on:
  push:
    paths:
      - '.github/phase4_patch_inclusion.py'
      - '.github/workflows/phase4-inclusion-green.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase4-inclusion-green:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
      - name: Normalize known creative import formatting for deterministic patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('runtime/cbcc/compiler.py')
          t=p.read_text(encoding='utf-8')
          spaced='from .creative import compile_curation, compile_creative_council, compile_cmf, compile_inclusive_photography, apply_creative_system_to_assets'
          compact='from .creative import compile_curation,compile_creative_council,compile_cmf,compile_inclusive_photography,apply_creative_system_to_assets'
          if spaced not in t and compact not in t:
              raise SystemExit('unexpected creative import shape')
          p.write_text(t.replace(spaced, compact, 1),encoding='utf-8')
          PY
      - name: Apply Phase 4 inclusion patch
        run: python .github/phase4_patch_inclusion.py
      - name: Focused Phase 4 inclusion verification
        run: |
          pytest -q \
            tests/test_v0676_phase4_inclusion_execution_authority.py \
            tests/test_v0676_intersectionality_culture_authority.py \
            tests/test_v0670_human_projection_integrity.py
      - name: Adjacent Phase 4 and fidelity regression verification
        run: |
          pytest -q \
            tests/test_v0676_phase4_visual_route_art_direction.py \
            tests/test_v0676_phase4_scene_derived_photography_authority.py \
            tests/test_v0676_phase4_visual_master_authority.py \
            tests/test_v0676_phase4_visual_master_runtime_binding.py \
            tests/test_v0635_native_reference_provider_integrity.py
      - name: Commit production GREEN
        run: |
          git config user.name 'cbcc-phase4-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/cbcc/creative.py runtime/cbcc/compiler.py
          git diff --cached --check
          git commit -m 'feat(phase4): project concrete inclusion authority into human assets'
          git push origin HEAD:main
