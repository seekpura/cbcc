name: phase4-cross-scope-probe2

on:
  push:
    branches: [phase4-closure-debug]
    paths:
      - '.github/workflows/phase4-cross-scope-probe2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split-probe:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-closure-debug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pyyaml pillow
      - name: P3 core evaluation
        continue-on-error: true
        run: pytest -q tests/test_v0676_phase3_opportunity_family_evaluation.py
      - name: P3 runtime binding
        continue-on-error: true
        run: pytest -q tests/test_v0676_phase3_opportunity_family_runtime_binding.py
      - name: Asset universe package regressions
        continue-on-error: true
        run: pytest -q tests/test_v0662_asset_universe_and_package_regressions.py
      - name: Asset universe open world
        continue-on-error: true
        run: pytest -q tests/test_v0655_asset_universe_open_world.py
      - name: Asset family no quota
        continue-on-error: true
        run: pytest -q tests/test_v0646_asset_family_no_quota.py
      - name: Activation taxonomy
        continue-on-error: true
        run: pytest -q tests/test_v0646_activation_state_taxonomy.py
      - name: Asset universe workspace
        continue-on-error: true
        run: pytest -q tests/test_v0633_asset_universe_workspace.py
      - name: Canonical graph
        continue-on-error: true
        run: pytest -q tests/test_v0676_canonical_commerce_graph.py
      - name: Human projection
        continue-on-error: true
        run: pytest -q tests/test_v0670_human_projection_integrity.py
      - name: Native reference/provider integrity
        continue-on-error: true
        run: pytest -q tests/test_v0635_native_reference_provider_integrity.py
