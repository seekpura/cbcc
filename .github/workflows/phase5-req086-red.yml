name: Phase 5 REQ-086 RED

on:
  push:
    branches:
      - phase5-req086-scene-photo-prompt
  workflow_dispatch:

jobs:
  req086-red:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run REQ-086 focused RED
        run: pytest -q tests/test_v0677_phase5_req086_scene_photo_prompt_consumption.py
