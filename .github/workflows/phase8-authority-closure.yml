name: phase8-authority-closure

on:
  push:
    branches:
      - repair-05-phase8-provider-true-e2e
    paths:
      - .github/workflows/phase8-authority-closure.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  close-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: repair-05-phase8-provider-true-e2e
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Phase 8 authorities
        run: python scripts/phase8_authority_closure_once.py
      - name: Install verification dependencies
        run: python -m pip install pytest pyyaml
      - name: Verify provider boundary and Phase 8 suite
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: '.:runtime'
        run: python -m pytest -q tests/test_v0616_provider_host_surface.py tests/test_v0682_*.py
      - name: Commit authority closure
        run: |
          git config user.name seekpura
          git config user.email ercnet@live.cn
          git rm .github/workflows/phase8-authority-closure.yml scripts/phase8_authority_closure_once.py
          git add references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json
          git add references/REQUIREMENT_IMPLEMENTATION_MATRIX_CURRENT.md
          git add .github/workflows/current-release-verification.yml
          git commit -m 'docs(phase8): close actual-output authority ledger'
          git push origin HEAD:repair-05-phase8-provider-true-e2e
