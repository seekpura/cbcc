name: phase7-ledger-sync-once

on:
  push:
    branches: [repair-04-phase7-full-materialization]
    paths:
      - 'scripts/phase7_ledger_sync_once.py'

permissions:
  contents: write

jobs:
  sync-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-04-phase7-full-materialization
          fetch-depth: 1
      - name: Apply bounded Phase 7 in-progress ledger patch
        run: python scripts/phase7_ledger_sync_once.py
      - name: Commit only the CURRENT ledger
        run: |
          git config user.name 'cbcc-phase7-ledger-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "references/REQUIREMENT_EXECUTION_LEDGER_CURRENT.json"
          git commit -m 'docs(phase7): record final semantic closure progress'
          git push origin HEAD:repair-04-phase7-full-materialization
