name: v0.6.48 final ZIP hard-rule lock

on:
  push:
    paths:
      - 'prompts/full_delivery_final_zip_hard_rule_lock.md'
      - 'scripts/check_v0648_user_hard_rule_final_zip.py'
      - 'scripts/check_host_skill_release_version_sync.py'
      - 'scripts/build_plugin_dist_v0648.py'
      - 'tests/test_v0648_final_zip_user_hard_rule_lock.py'
      - '.github/workflows/v0648-final-zip-hard-rule.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'prompts/full_delivery_final_zip_hard_rule_lock.md'
      - 'scripts/check_v0648_user_hard_rule_final_zip.py'
      - 'scripts/check_host_skill_release_version_sync.py'
      - 'scripts/build_plugin_dist_v0648.py'
      - 'tests/test_v0648_final_zip_user_hard_rule_lock.py'
      - '.github/workflows/v0648-final-zip-hard-rule.yml'
      - 'VERSION'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile validator, release guard and builder
        run: python -m py_compile scripts/check_v0648_user_hard_rule_final_zip.py scripts/check_host_skill_release_version_sync.py scripts/build_plugin_dist_v0648.py
      - name: Focused regression tests
        run: pytest -q tests/test_v0648_final_zip_user_hard_rule_lock.py
      - name: Build plugin release
        run: python scripts/build_plugin_dist_v0648.py --output-dir dist_v0648
      - name: Inspect the actual packaged plugin bytes
        run: |
          rm -rf dist_v0648/unpacked
          mkdir -p dist_v0648/unpacked
          unzip -q dist_v0648/cross-border-commerce-creative-plugin-v0.6.48.zip -d dist_v0648/unpacked
          python scripts/check_host_skill_release_version_sync.py dist_v0648/unpacked/cross-border-commerce-creative
          grep -q 'FULL Final ZIP Hard-Rule Completion Lock' dist_v0648/unpacked/cross-border-commerce-creative/skills/cross-border-commerce-creative/SKILL.md
          grep -q 'final_zip_reextract_validation_required' dist_v0648/release_manifest.json
