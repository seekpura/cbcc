name: CBCC v0.6.32 historical release acceptance (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-v0632-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Historical release note
        run: |
          echo 'v0.6.32 is a frozen historical release.'
          echo 'Its release/version assertions do not validate v0.6.33+ main.'
          echo 'Use tag/release v0.6.32 and its archived assets for historical inspection.'
