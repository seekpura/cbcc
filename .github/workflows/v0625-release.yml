name: CBCC v0.6.25 release cleanup

on:
  push:
    branches:
      - work/v0625-decision-question-authority

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen main and validated source commit ancestry
        run: |
          test "$(git rev-parse origin/main)" = "86af331bd13226abb87f1c62e6ac240fb87e4228"
          git merge-base --is-ancestor 3a563581d3ff96c592dd00685b14a5e1571fa41a HEAD
      - name: Materialize release metadata
        run: python .changes/v0625_release.py
      - name: Verify release source metadata
        run: |
          grep -Fx '0.6.25-decision-question-authority' VERSION
          grep -F 'version: 0.6.25-decision-question-authority' SKILL.md
          grep -F '# CBCC v0.6.25 CURRENT HANDOFF' CURRENT_HANDOFF.md
          grep -F 'NEW_FAILURE_COUNT=0' CHANGELOG_V0625.md
          grep -F '0.6.25-decision-question-authority' runtime/cbcc/compiler.py
      - name: Remove staging and temporary workflows
        run: |
          rm -f .changes/v0625_apply.py
          rm -f .changes/v0625_fix_regressions.py
          rm -f .changes/v0625_release.py
          rm -f .github/workflows/v0625-verify.yml
          rm -f .github/workflows/v0625-release.yml
          rmdir .changes 2>/dev/null || true
      - name: Commit clean v0.6.25 release tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: finalize CBCC v0.6.25 decision question authority"
          git push origin HEAD:work/v0625-decision-question-authority
