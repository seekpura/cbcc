name: Apply v0.6.32 production-parameter closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0632-production-parameter-closure.yml'
      - 'runtime/cbcc/portfolio_visual_authority.py'
      - 'runtime/cbcc/__init__.py'
      - 'tests/test_v0632_portfolio_visual_authority.py'
      - 'tests/test_v0632_human_art_direction_visibility.py'
      - 'scripts/patch_v0632_human_art_direction_visibility.py'
      - 'scripts/apply_v0632_production_parameter_closure.py'
      - 'scripts/patch_v0632_closure_language_and_status.py'
      - 'scripts/patch_v0631_prompt_fixture_for_v0632.py'
      - 'scripts/patch_v0632_graphic_test_diagnostics.py'
      - 'scripts/patch_v0632_route_value_detection.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v0632:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt pytest

      - name: Apply v0.6.32 authority metadata and closure fixes
        run: |
          python scripts/apply_v0632_production_parameter_closure.py
          python scripts/patch_v0632_closure_language_and_status.py
          python scripts/patch_v0631_prompt_fixture_for_v0632.py
          python scripts/patch_v0632_graphic_test_diagnostics.py
          python scripts/patch_v0632_route_value_detection.py
          python scripts/patch_v0632_human_art_direction_visibility.py

      - name: Compile production, portfolio and human-delivery authority
        env:
          PYTHONPATH: .:runtime
        run: |
          python -m py_compile \
            runtime/cbcc/production_parameter_closure.py \
            runtime/cbcc/portfolio_visual_authority.py \
            runtime/cbcc/delivery_html.py \
            runtime/cbcc/__init__.py \
            runtime/cbcc/model_native_prompt_contract.py \
            runtime/cbcc/agent_authority_prompt_compiler.py

      - name: Targeted prompt, portfolio, human-workspace and Agent-authority regression
        env:
          PYTHONPATH: .:runtime
        run: |
          pytest -q \
            tests/test_v0632_production_parameter_closure.py \
            tests/test_v0632_portfolio_visual_authority.py \
            tests/test_v0632_human_art_direction_visibility.py \
            tests/test_v0631_model_native_prompt_contract.py \
            tests/test_v0630_agent_art_direction_authority.py \
            tests/test_v0630_prompt_art_direction_projection.py

      - name: Verify promoted version
        run: |
          test "$(cat VERSION)" = "0.6.32-production-parameter-closure"
          grep -q '^version: 0.6.32-production-parameter-closure$' SKILL.md

      - name: Commit applied authority
        run: |
          if git diff --quiet; then
            echo 'No migration diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            VERSION SKILL.md runtime/cbcc/compiler.py prompts/registry.json scripts/build_plugin_dist.py \
            runtime/cbcc/production_parameter_closure.py runtime/cbcc/delivery_html.py \
            tests/test_v0631_model_native_prompt_contract.py tests/test_v0632_production_parameter_closure.py
          git commit -m 'release: promote production-parameter closure to v0.6.32'
          git push
