name: one-shot-phase3-green-patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-green-patch-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply additive Phase 3 bindings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Matrix helper: same pre-asset authority, optionally joined to post-asset fulfillment.
          path = Path('runtime/cbcc/opportunity_family_authority.py')
          text = path.read_text(encoding='utf-8')
          if 'def compile_asset_universe_matrix(' not in text:
              marker = '\ndef wrap_build_asset_architecture'
              assert marker in text
              helper = '''\n\ndef compile_asset_universe_matrix(\n    evaluation: Mapping[str, Any] | None,\n    asset_universe: Mapping[str, Any] | None = None,\n    fulfillment: Mapping[str, Any] | None = None,\n) -> dict[str, Any]:\n    evaluation = deepcopy(dict(evaluation or {}))\n    asset_universe = deepcopy(dict(asset_universe or {}))\n    fulfillment_obj = deepcopy(dict(fulfillment or {})) if fulfillment is not None else None\n    status = 'READY' if evaluation.get('status') == 'READY' else 'TO_VERIFY'\n    stage = 'PRE_ASSET_ARCHITECTURE'\n    if fulfillment_obj is not None:\n        stage = 'PRE_ASSET_ARCHITECTURE_WITH_POST_ASSET_FULFILLMENT'\n        if fulfillment_obj.get('status') != 'READY':\n            status = 'TO_VERIFY'\n    return {\n        'schema_version':'cbcc-asset-universe-matrix-phase3-v0.6.76',\n        'status':status,\n        'evaluation_stage':stage,\n        'opportunity_family_evaluation':evaluation,\n        'opportunity_family_fulfillment':fulfillment_obj,\n        'asset_universe':asset_universe,\n        'fixed_total_asset_limit':False,\n        'fixed_asset_quota_per_family':False,\n        'platform_capacity_is_activation_constraint_only':True,\n        'principle':'The matrix records the 23-family decision authority before asset creation, then joins actual architecture fulfillment without turning families into quotas.',\n    }\n'''
              text = text.replace(marker, helper + marker, 1)
              path.write_text(text, encoding='utf-8')

          # 2) Install Phase 3 only after the complete Phase 2 closure.
          path = Path('runtime/cbcc/__init__.py')
          text = path.read_text(encoding='utf-8')
          if 'v0676_phase3_closure' not in text:
              marker = '_v0676_phase2_closure.apply_v0676_phase2_patches()\n'
              assert marker in text
              addition = '''\n# v0.6.76 Phase 3 evaluates the locked opportunity-family universe before asset creation.\n# It is additive: the mature open-world architecture, legacy 12-axis audit and activation model remain intact.\nfrom . import v0676_phase3_closure as _v0676_phase3_closure\n_v0676_phase3_closure.apply_v0676_phase3_patches()\n'''
              text = text.replace(marker, marker + addition, 1)
              path.write_text(text, encoding='utf-8')

          # 3) Compiler materializes the pre-asset matrix before architecture and finalizes the same artifact after build.
          path = Path('runtime/cbcc/compiler.py')
          text = path.read_text(encoding='utf-8')
          import_marker = 'from .asset_architecture import build_asset_architecture\n'
          import_add = 'from .opportunity_family_authority import compile_opportunity_family_evaluation, compile_asset_universe_matrix\n'
          if import_add not in text:
              assert import_marker in text
              text = text.replace(import_marker, import_marker + import_add, 1)
          old = '''    category_family=infer_category_family(request)\n    architecture=build_asset_architecture(request.get('project_id','project'),tc,questions,objects,request.get('asset_jobs'),{'listing_objections':((domain.get('listing') or {}).get('compiled') or {}).get('objection_resolution_plan',[]),'feedback_issues':(domain.get('feedback') or {}).get('issues',[]),'market_theme_jobs':market_theme_jobs},category_family)\n    surface_architecture=compile_surface_architecture(tc,objects,architecture.get('assets') or [],pc)\n'''
          new = '''    category_family=infer_category_family(request)\n    phase3_decisions=request.get('opportunity_family_decisions') or (request.get('target') or {}).get('opportunity_family_decisions') or {}\n    phase3_context=dict(tc); phase3_context['delivery_mode']=request.get('delivery_mode') or request.get('scope_mode')\n    phase3_opportunity_family_evaluation=compile_opportunity_family_evaluation(phase3_decisions,context=phase3_context)\n    _write(p/'artifacts/asset_universe_matrix.json',compile_asset_universe_matrix(phase3_opportunity_family_evaluation))\n    architecture_target=dict(tc); architecture_target['phase3_opportunity_family_evaluation']=phase3_opportunity_family_evaluation\n    architecture=build_asset_architecture(request.get('project_id','project'),architecture_target,questions,objects,request.get('asset_jobs'),{'listing_objections':((domain.get('listing') or {}).get('compiled') or {}).get('objection_resolution_plan',[]),'feedback_issues':(domain.get('feedback') or {}).get('issues',[]),'market_theme_jobs':market_theme_jobs},category_family)\n    phase3_opportunity_family_evaluation=architecture.get('phase3_opportunity_family_evaluation') or phase3_opportunity_family_evaluation\n    opportunity_family_fulfillment=architecture.get('opportunity_family_fulfillment') or {}\n    _write(p/'artifacts/asset_universe_matrix.json',compile_asset_universe_matrix(phase3_opportunity_family_evaluation,architecture.get('asset_universe') or {},opportunity_family_fulfillment))\n    surface_architecture=compile_surface_architecture(tc,objects,architecture.get('assets') or [],pc)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          else:
              assert 'compile_opportunity_family_evaluation' in text and text.count("artifacts/asset_universe_matrix.json") >= 2
          path.write_text(text, encoding='utf-8')

          # 4) Human commerce context carries the same architecture authority; no second business payload is invented.
          path = Path('runtime/cbcc/commercial_delivery_continuity.py')
          text = path.read_text(encoding='utf-8')
          old = "        'commercial_curation_continuity': architecture.get('commercial_curation_continuity'),\n        'asset_universe': architecture.get('asset_universe'),\n"
          new = "        'commercial_curation_continuity': architecture.get('commercial_curation_continuity'),\n        'asset_universe': architecture.get('asset_universe'),\n        'phase3_opportunity_family_evaluation': architecture.get('phase3_opportunity_family_evaluation'),\n        'opportunity_family_fulfillment': architecture.get('opportunity_family_fulfillment'),\n"
          if "'phase3_opportunity_family_evaluation': architecture.get('phase3_opportunity_family_evaluation')" not in text:
              assert old in text
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          # 5) Existing Asset Universe workspace gets a 23-family decision/fulfillment table; shell/navigation stays unchanged.
          path = Path('runtime/cbcc/asset_portfolio_workspace.py')
          text = path.read_text(encoding='utf-8')
          if '机会族评估' not in text:
              marker = '''    return (\n        '<section class="asset-portfolio-intelligence searchable">'\n'''
              assert marker in text
              insertion = '''    family_eval = portfolio.get('phase3_opportunity_family_evaluation') if isinstance(portfolio.get('phase3_opportunity_family_evaluation'), dict) else {}\n    family_fulfillment = portfolio.get('opportunity_family_fulfillment') if isinstance(portfolio.get('opportunity_family_fulfillment'), dict) else {}\n    fulfillment_by_id = {str(x.get('family_id')): x for x in (family_fulfillment.get('rows') or []) if isinstance(x, dict)}\n    family_rows = []\n    for row in family_eval.get('families') or []:\n        if not isinstance(row, dict):\n            continue\n        fid = str(row.get('family_id') or '')\n        frow = fulfillment_by_id.get(fid) or {}\n        status = str(row.get('status') or 'TO_VERIFY')\n        fulfill_status = str(frow.get('fulfillment_status') or ('NOT_REQUIRED_DELIBERATE_OMISSION' if status == 'NOT_NEEDED' else 'TO_VERIFY'))\n        satisfiers = _text(row.get('satisfying_objects'), 320)\n        matched = _text(frow.get('matched_asset_ids'), 240)\n        family_rows.append(\n            '<tr>'\n            f'<td>{html.escape(fid)}</td>'\n            f'<td>{html.escape(_text(row.get("family"), 140))}</td>'\n            f'<td>{html.escape(status)}</td>'\n            f'<td>{html.escape(_text(row.get("why"), 360))}</td>'\n            f'<td>{html.escape(_text(row.get("why_not"), 360))}</td>'\n            f'<td>{html.escape(satisfiers)}</td>'\n            f'<td>{html.escape(fulfill_status)}</td>'\n            f'<td>{html.escape(matched)}</td>'\n            '</tr>'\n        )\n    family_table = ''\n    if family_rows:\n        family_table = (\n            '<h3>机会族评估</h3>'\n            '<div class="cbcc-commerce-note">23 类机会族必须在资产创建前逐一判断；NOT_NEEDED 必须是有理由的主动省略。一个对象可以满足多个机会族，不形成固定配额。</div>'\n            '<div class="ap-table"><table><thead><tr><th>ID</th><th>机会族</th><th>决策</th><th>为什么</th><th>为什么不做</th><th>计划满足对象</th><th>履约</th><th>实际资产</th></tr></thead><tbody>'\n            + ''.join(family_rows) + '</tbody></table></div>'\n        )\n\n'''
              text = text.replace(marker, insertion + marker, 1)
              old_tail = "        + table + '</section>'\n"
              new_tail = "        + family_table + table + '</section>'\n"
              assert old_tail in text
              text = text.replace(old_tail, new_tail, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Run Phase 3 focused GREEN
        run: |
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_v0676_phase3_opportunity_family_evaluation.py \
            tests/test_v0676_phase3_opportunity_family_runtime_binding.py
      - name: Commit additive Phase 3 GREEN
        shell: bash
        run: |
          git config user.name 'cbcc-phase3-green'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/cbcc/opportunity_family_authority.py runtime/cbcc/v0676_phase3_closure.py runtime/cbcc/__init__.py runtime/cbcc/compiler.py runtime/cbcc/commercial_delivery_continuity.py runtime/cbcc/asset_portfolio_workspace.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: bind Phase 3 opportunity-family evaluation before asset architecture'
          git push origin HEAD:main
