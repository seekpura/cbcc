name: CBCC v0.6.24 release cleanup

on:
  push:
    branches:
      - work/v0624-strategy-asset-scope

permissions:
  contents: write

jobs:
  release-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen v0.6.23 main
        run: test "$(git rev-parse origin/main)" = "48b801022efdbbf577b663019f39f481a94a36ff"
      - name: Update release authorities
        run: python .changes/v0624_release.py
      - name: Remove staging and self-delete workflow
        run: |
          rm -rf .changes
          rm -f .github/workflows/v0624-baseline-audit.yml
      - name: Commit clean release tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: finalize CBCC v0.6.24 task-scoped strategy and asset authority"
          git push origin HEAD:work/v0624-strategy-asset-scope
