name: CBCC v0.6.24 strategy asset autonomy verify

on:
  push:
    branches:
      - work/v0624-strategy-asset-scope

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen v0.6.23 main
        run: test "$(git rev-parse origin/main)" = "48b801022efdbbf577b663019f39f481a94a36ff"
      - name: Apply v0.6.24 patch
        run: python .changes/v0624_patch.py
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Targeted strategy asset autonomy and continuity
        env:
          PYTHONPATH: runtime
        run: |
          python -m py_compile runtime/cbcc/strategy_depth.py runtime/cbcc/asset_architecture.py runtime/cbcc/compiler.py
          pytest -q \
            tests/test_v0624_strategy_asset_scope.py \
            tests/test_v0623_task_scoped_delivery.py \
            tests/test_v0622_dynamic_workspace.py \
            tests/test_v0622_relevance_driven_prompt_projection.py \
            tests/test_v068_asset_production_workspace.py
      - name: Full regression node-id diff against v0.6.23 main
        env:
          PYTHONPATH: runtime
        run: |
          set +e
          pytest -q > /tmp/branch.txt 2>&1
          git worktree add /tmp/cbcc-main 48b801022efdbbf577b663019f39f481a94a36ff
          (cd /tmp/cbcc-main && PYTHONPATH=runtime pytest -q > /tmp/main.txt 2>&1)
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          def failed(path):
              t=Path(path).read_text(encoding='utf-8',errors='replace')
              return sorted(set(re.findall(r'^FAILED\s+([^\s]+)',t,re.M)))
          b=failed('/tmp/branch.txt'); m=failed('/tmp/main.txt')
          new=sorted(set(b)-set(m)); fixed=sorted(set(m)-set(b))
          print('MAIN_FAILURE_COUNT=',len(m))
          print('BRANCH_FAILURE_COUNT=',len(b))
          print('NEW_FAILURE_COUNT=',len(new))
          print('FIXED_FAILURE_COUNT=',len(fixed))
          if fixed:
              print('FIXED_FAILURES:'); print('\n'.join(fixed))
          if new:
              print('NEW_FAILURES:'); print('\n'.join(new)); raise SystemExit(1)
          PY
      - name: Commit materialized v0.6.24 source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/cbcc/strategy_depth.py runtime/cbcc/asset_architecture.py runtime/cbcc/compiler.py tests/test_v0624_strategy_asset_scope.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: make strategy and asset authority task scoped"
            git push origin HEAD:work/v0624-strategy-asset-scope
          fi
