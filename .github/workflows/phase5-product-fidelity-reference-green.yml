name: phase5-product-fidelity-reference-green

on:
  push:
    branches: [phase5-product-fidelity-reference]
    paths:
      - '.github/phase5_patch_product_fidelity_reference.py'
      - '.github/workflows/phase5-product-fidelity-reference-green.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5-product-fidelity-reference
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest pyyaml openpyxl pillow
      - name: Apply canonical Product Fidelity reference patch
        run: python .github/phase5_patch_product_fidelity_reference.py
      - name: Focused Product Presence Fidelity reference proof
        run: pytest -q tests/test_v0676_phase5_product_fidelity_reference_prompt.py
      - name: Preserve prior Phase 5 dynamic Prompt continuity
        run: pytest -q tests/test_v0676_phase5_dynamic_prompt_continuity.py
      - name: Preserve Phase 4 Product Presence Fidelity Inclusion authority
        run: pytest -q tests/test_v0676_phase4_inclusion_execution_authority.py tests/test_v0635_native_reference_provider_integrity.py
      - name: Preserve Phase 4 all focused regressions
        run: pytest -q tests/test_v0676_phase4_*.py
      - name: Preserve v0.6.73/v0.6.74 prompt and cross-scope closure
        run: |
          pytest -q tests/test_v0673_model_prompt_route_relevance.py
          pytest -q tests/test_v0674_regression_closure.py
      - name: Commit GREEN production files only
        run: |
          git config user.name 'cbcc-phase5-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/cbcc/agent_authority_prompt_compiler.py runtime/cbcc/reference_guided_native_authority.py runtime/cbcc/integrated_render_route_authority.py
          git diff --cached --check
          git commit -m 'feat(phase5): consume canonical product fidelity authority'
          git push origin HEAD:phase5-product-fidelity-reference
