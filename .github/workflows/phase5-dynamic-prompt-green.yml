name: phase5-dynamic-prompt-green

on:
  push:
    branches: [phase5-prompt-compiler]
    paths:
      - '.github/workflows/phase5-dynamic-prompt-green.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest pyyaml pillow
      - name: Apply canonical dynamic Prompt bridge
        run: |
          python .github/phase5_patch_dynamic_prompt.py
          python .github/phase5_patch_parameter_closure_dynamic.py
      - name: Phase4 dynamic AD focused GREEN
        run: pytest -q tests/test_v0676_phase5_dynamic_art_direction_prompt_consumption.py
      - name: Existing model-native Prompt contract
        run: pytest -q tests/test_v0631_model_native_prompt_contract.py
      - name: Phase5 language-purity bridge remains green
        run: pytest -q tests/test_v0676_phase5_integrated_render_language_purity.py
      - name: Prompt adjacency — v0.6.72/v0.6.73
        run: |
          pytest -q \
            tests/test_v0672_prompt_relevance_and_nested_execution.py \
            tests/test_v0672_integrated_copy_negative_constraint.py \
            tests/test_v0673_model_prompt_route_relevance.py
      - name: Cross-scope closure — v0.6.74
        run: pytest -q tests/test_v0674_regression_closure.py
      - name: Commit production bridge only
        run: |
          git config user.name 'cbcc-phase5-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            runtime/cbcc/model_native_prompt_contract.py \
            runtime/cbcc/production_parameter_closure.py
          git diff --cached --check
          git commit -m 'feat(phase5): consume canonical dynamic art direction in model prompts'
          git push origin HEAD:phase5-prompt-compiler
