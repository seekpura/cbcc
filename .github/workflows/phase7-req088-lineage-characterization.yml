name: phase7-req088-lineage-characterization

on:
  push:
    branches: [repair-04-phase7-full-materialization]
    paths:
      - 'runtime/cbcc/lineage_normalization_v0681.py'
      - 'runtime/cbcc/phase7_lineage_semantic_closure_v0681.py'
      - 'runtime/cbcc/full_package_semantic_closure_v0681.py'
      - 'runtime/cbcc/commercial_delivery_continuity.py'
      - 'tests/test_v0681_phase7_req088_lineage_closure.py'
      - 'tests/test_v0681_phase7_req088_lineage_export.py'
      - 'tests/test_v0681_phase7_req088_wrapper_integration.py'
      - '.github/workflows/phase7-req088-lineage-characterization.yml'
  workflow_dispatch:

jobs:
  req088-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install focused dependencies
        run: python -m pip install pyyaml pytest
      - name: Characterize REQ-088 lineage closure
        env: {PYTHONHASHSEED: '0', PYTHONPATH: '.:runtime'}
        run: |
          python -m pytest -q \
            tests/test_v0681_phase7_req088_lineage_closure.py \
            tests/test_v0681_phase7_req088_lineage_export.py \
            tests/test_v0681_phase7_req088_wrapper_integration.py
