name: Apply v0.6.33 native-reference asset-universe authority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0633-native-reference-asset-universe.yml'
      - 'runtime/cbcc/reference_guided_native_authority.py'
      - 'runtime/cbcc/asset_universe_authority.py'
      - 'runtime/cbcc/__init__.py'
      - 'tests/test_v0633_reference_guided_native_asset_universe.py'
      - 'scripts/apply_v0633_native_reference_asset_universe.py'
      - 'scripts/patch_v0633_native_reference_continuity.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v0633:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt pytest
      - name: Apply v0.6.33 migration and continuity patches
        run: |
          python scripts/apply_v0633_native_reference_asset_universe.py
          python scripts/patch_v0633_native_reference_continuity.py
      - name: Compile changed modules
        env:
          PYTHONPATH: .:runtime
        run: |
          python -m py_compile \
            runtime/cbcc/reference_guided_native_authority.py \
            runtime/cbcc/asset_universe_authority.py \
            runtime/cbcc/__init__.py \
            runtime/cbcc/compiler.py \
            runtime/cbcc/asset_architecture.py \
            runtime/cbcc/providers.py \
            runtime/cbcc/production.py
      - name: v0.6.33 acceptance
        env:
          PYTHONPATH: .:runtime
        run: |
          pytest -q \
            tests/test_v0633_reference_guided_native_asset_universe.py \
            tests/test_v0632_production_parameter_closure.py \
            tests/test_v0632_portfolio_visual_authority.py \
            tests/test_v0632_human_art_direction_visibility.py \
            tests/test_v0631_model_native_prompt_contract.py \
            tests/test_v0630_agent_art_direction_authority.py \
            tests/test_v0630_prompt_art_direction_projection.py
      - name: Verify authority strings
        run: |
          test "$(cat VERSION)" = "0.6.33-reference-guided-native-asset-universe"
          grep -q '^version: 0.6.33-reference-guided-native-asset-universe$' SKILL.md
          grep -q 'REFERENCE_GUIDED_NATIVE_LOCK' SKILL.md
          grep -q '平台.*9图.*activation set' SKILL.md
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No migration diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION SKILL.md \
            runtime/cbcc/compiler.py runtime/cbcc/asset_architecture.py runtime/cbcc/product_visual_intelligence.py \
            runtime/cbcc/providers.py runtime/cbcc/production.py runtime/cbcc/reference_guided_native_authority.py \
            tests/test_v0631_model_native_prompt_contract.py tests/test_v0632_production_parameter_closure.py \
            scripts/build_plugin_dist.py
          git commit -m 'release: promote native reference generation and dynamic asset universe to v0.6.33'
          git push
