name: CBCC v0.6.28 Agent frontier scope verify

on:
  push:
    branches:
      - work/v0628-agent-frontier-scope

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen v0.6.27 main
        run: test "$(git rev-parse origin/main)" = "a0e1260aa41080f1a5c62e97d919cb2e506d5bca"
      - name: Apply v0.6.28 frontier patches
        run: |
          python .changes/v0628_apply.py
          python .changes/v0628_fix_production_intent.py
          python .changes/v0628_fix_research_action_identity.py
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Targeted Agent frontier and continuity
        env:
          PYTHONPATH: runtime
        run: |
          python -m py_compile runtime/cbcc/agent_autonomy.py runtime/cbcc/decision_authority.py runtime/cbcc/completion.py runtime/cbcc/compiler.py runtime/cbcc/human_delivery.py runtime/cbcc/scope_readiness.py
          pytest -q \
            tests/test_v0628_agent_frontier_scope.py \
            tests/test_v0627_current_scope_completion.py \
            tests/test_v0626_scope_readiness.py \
            tests/test_v0625_decision_question_authority.py \
            tests/test_v0624_strategy_asset_scope.py \
            tests/test_v0623_task_scoped_delivery.py \
            tests/test_v0622_dynamic_workspace.py \
            tests/test_v0621_agent_replan_and_frameworks.py::test_next_action_frontier_reports_material_gaps_without_fixed_sequence \
            tests/test_v0621_agent_replan_and_frameworks.py::test_next_action_can_stop_when_current_scope_is_satisfied
      - name: Full regression node-id diff against v0.6.27 main
        env:
          PYTHONPATH: runtime
        run: |
          set +e
          pytest -q > /tmp/branch.txt 2>&1
          git worktree add /tmp/cbcc-main a0e1260aa41080f1a5c62e97d919cb2e506d5bca
          (cd /tmp/cbcc-main && PYTHONPATH=runtime pytest -q > /tmp/main.txt 2>&1)
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          def failed(path):
              text=Path(path).read_text(encoding='utf-8',errors='replace')
              return sorted(set(re.findall(r'^FAILED\s+([^\s]+)',text,re.M)))
          branch=failed('/tmp/branch.txt'); main=failed('/tmp/main.txt')
          new=sorted(set(branch)-set(main)); fixed=sorted(set(main)-set(branch))
          print('MAIN_FAILURE_COUNT=',len(main))
          print('BRANCH_FAILURE_COUNT=',len(branch))
          print('NEW_FAILURE_COUNT=',len(new))
          print('FIXED_FAILURE_COUNT=',len(fixed))
          if fixed:
              print('FIXED_FAILURES:'); print('\n'.join(fixed))
          if new:
              print('NEW_FAILURES:'); print('\n'.join(new)); raise SystemExit(1)
          PY
      - name: Commit materialized v0.6.28 source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/cbcc/agent_autonomy.py runtime/cbcc/decision_authority.py runtime/cbcc/completion.py runtime/cbcc/compiler.py runtime/cbcc/human_delivery.py runtime/cbcc/scope_readiness.py tests/test_v0628_agent_frontier_scope.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: split blocking and advisory Agent frontiers"
            git push origin HEAD:work/v0628-agent-frontier-scope
          fi
