name: CBCC v0.6.30 historical release acceptance (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-v0630-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Historical release note
        run: |
          echo 'v0.6.30 is a frozen historical release.'
          echo 'Its prompt-format assertions are not used to validate v0.6.31+ main.'
          echo 'Use tag v0.6.30 and the corresponding GitHub release for historical inspection.'
