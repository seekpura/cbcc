name: v0682-phase8-provider-actual-output

on:
  push:
    paths:
      - 'runtime/cbcc/provider_surface.py'
      - 'runtime/cbcc/cli.py'
      - 'runtime/cbcc/learning_loop.py'
      - 'runtime/cbcc/full_package_semantic_closure_v0681.py'
      - 'tests/test_v0682_*.py'
      - 'references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE8_*.json'
      - '.github/workflows/v0682-phase8-provider-actual-output.yml'
  pull_request:
    paths:
      - 'runtime/cbcc/provider_surface.py'
      - 'runtime/cbcc/cli.py'
      - 'runtime/cbcc/learning_loop.py'
      - 'runtime/cbcc/full_package_semantic_closure_v0681.py'
      - 'tests/test_v0682_*.py'
      - 'references/REQUIREMENT_CONSUMER_MAP_CURRENT_PHASE8_*.json'
      - '.github/workflows/v0682-phase8-provider-actual-output.yml'
  workflow_dispatch:

jobs:
  phase8-provider-actual-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused verification dependencies
        run: python -m pip install pytest pyyaml
      - name: Verify Phase 8 provider actual-output closure
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: '.:runtime'
        run: python -m pytest -q tests/test_v0682_*.py
