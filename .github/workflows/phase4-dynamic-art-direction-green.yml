name: phase4-dynamic-art-direction-green

on:
  push:
    paths:
      - '.github/phase4_patch_dynamic_art_direction.py'
      - '.github/workflows/phase4-dynamic-art-direction-green.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase4-dynamic-art-direction-green:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
      - name: Apply Phase 4 dynamic Art Direction patch
        run: python .github/phase4_patch_dynamic_art_direction.py
      - name: Focused dynamic Surface-native Art Direction verification
        run: pytest -q tests/test_v0676_phase4_dynamic_surface_art_direction.py
      - name: Adjacent Phase 4 regression verification
        run: |
          pytest -q \
            tests/test_v0676_phase4_visual_route_art_direction.py \
            tests/test_v0676_phase4_scene_derived_photography_authority.py \
            tests/test_v0676_phase4_visual_master_authority.py \
            tests/test_v0676_phase4_visual_master_runtime_binding.py \
            tests/test_v0676_phase4_inclusion_execution_authority.py \
            tests/test_v0635_native_reference_provider_integrity.py
      - name: Verify compiler lifecycle ordering and static isolation contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('runtime/cbcc/compiler.py').read_text(encoding='utf-8')
          build="video_plan=build_video_creator_plan(request.get('project_id','project'),objects,questions,lang.to_dict(),request.get('video_jobs'),assets=architecture.get('assets'),creative_council=council)"
          project='architecture=project_dynamic_art_direction_to_assets(architecture,video_plan)'
          write="aap=_write(p/'artifacts/asset_architecture.json',architecture)"
          assert text.index(build) < text.index(project) < text.index(write)
          assert text.count(build) == 1
          PY
      - name: Commit production GREEN
        run: |
          git config user.name 'cbcc-phase4-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/cbcc/video_creator.py runtime/cbcc/compiler.py
          git diff --cached --check
          git commit -m 'feat(phase4): project authored dynamic direction into surface assets'
          git push origin HEAD:main
