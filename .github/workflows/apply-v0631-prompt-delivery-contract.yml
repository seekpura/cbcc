name: Apply v0.6.31 Prompt Delivery Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0631-prompt-delivery-contract.yml'
      - 'scripts/apply_v0631_prompt_delivery_contract.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt pytest
      - name: Apply prompt and delivery contract
        run: python scripts/apply_v0631_prompt_delivery_contract.py
      - name: Compile changed delivery modules
        env:
          PYTHONPATH: .:runtime
        run: |
          python -m py_compile runtime/cbcc/asset_compiler.py scripts/build_plugin_dist.py
      - name: Verify prompt and authority regressions
        env:
          PYTHONPATH: .:runtime
        run: |
          pytest -q tests/test_v0631_model_native_prompt_contract.py
          pytest -q \
            tests/test_v0630_agent_art_direction_authority.py \
            tests/test_v0630_surface_agent_authority.py \
            tests/test_v0630_agent_art_direction_e2e.py \
            tests/test_v0630_prompt_art_direction_projection.py
      - name: Verify human delivery contract text
        run: |
          grep -q 'Model-Native Prompt + Human Depth Authority' SKILL.md
          grep -q 'Model Prompt CN' runtime/cbcc/asset_compiler.py
          grep -q '14_visible_copy_block.json' runtime/cbcc/asset_compiler.py
          grep -q '15_production_assembly_notes.json' runtime/cbcc/asset_compiler.py
          grep -q 'Model-Native Prompt Contract' scripts/build_plugin_dist.py
      - name: Commit applied contract
        run: |
          if git diff --quiet; then
            echo 'No contract changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SKILL.md runtime/cbcc/asset_compiler.py scripts/build_plugin_dist.py
          git commit -m 'fix: preserve full art direction depth and separate prompt production objects'
          git push
