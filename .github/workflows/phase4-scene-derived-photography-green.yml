name: phase4-scene-derived-photography-green

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q pytest pyyaml openpyxl
      - name: Apply scene-derived photography patch
        run: |
          python .github/phase4_patch_scene_photography.py
          python -m py_compile runtime/cbcc/portfolio_visual_authority.py runtime/cbcc/photographic_route_agent_authority.py
      - name: Focused GREEN and cross-scope regressions
        run: |
          pytest -q \
            tests/test_v0676_phase4_scene_derived_photography_authority.py \
            tests/test_v0676_phase4_visual_route_art_direction.py \
            tests/test_v0676_phase4_visual_master_authority.py \
            tests/test_v0676_phase4_visual_master_runtime_binding.py \
            tests/test_v0632_portfolio_visual_authority.py \
            tests/test_v0630_agent_art_direction_authority.py \
            tests/test_v0676_phase3_opportunity_family_evaluation.py \
            tests/test_v0676_phase3_opportunity_family_runtime_binding.py
      - name: Confirm historical photography TypeError stays fixed
        run: |
          python - <<'PY'
          from tests.test_v069_photography_execution_continuity import _photo_contract, _asset
          from cbcc.prompt_compiler import compile_asset_prompt
          out=compile_asset_prompt(
              _asset(),
              {'name':'Test product'},
              {'market':'Malaysia','platform_family':'tiktok_shop'},
              {},{},
              photography=_photo_contract(),
              source_product_assets=[{'asset_id':'REAL-1','pixel_lock':True}],
          )
          execution=out['design_card']['photography_execution']
          assert execution['capture_mode']=='COMPOSITE'
          assert execution['composition']==_photo_contract()['composition']
          assert out['machine_visual_contract']['photography_execution']==execution
          print('historical_duplicate_photography_typeerror=FIXED')
          print('prompt_layering_assertion=DEFERRED_PHASE5')
          PY
      - name: Commit verified production changes
        run: |
          git config user.name 'cbcc-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/cbcc/portfolio_visual_authority.py runtime/cbcc/photographic_route_agent_authority.py
          git commit -m 'feat: GREEN enforce scene-derived photography execution'
          git push origin HEAD:main
