version: 2
policy: upgrades_are_additive_and_cross_dimension_regressions_block_release
checks:
  - id: business_object_density_without_summary_collapse
    repair_dimension: any
    must_preserve:
      - product_truth
      - market_audience_culture
      - strategy_frameworks
      - pricing_economics_offer
      - listing_search
      - content_matrix
      - visual_master
      - asset_universe_and_art_direction
      - prompt_production
      - video_creator_live
      - ads
      - reviews
      - race_localization_compliance_measurement
      - evidence_operations_workspace
    failure_examples:
      - replacing full business objects with a few conclusions
      - preserving headings while thinning payload depth
      - moving all detail to raw JSON while human objects become summaries

  - id: strategy_depth_without_framework_theater
    repair_dimension: strategy_or_frameworks
    must_preserve:
      - what_why_evidence_tradeoff_execution_measurement
      - platform_region_audience_culture_why
      - positioning_value_message_hierarchy
      - stp_jtbd
      - aida_fabe
      - four_p_funnel
      - race_connection
      - resource_tradeoffs
    failure_examples:
      - listing framework definitions without changing decisions
      - generic premium_young_conversion strategy
      - no explicit basis tradeoff or measurement

  - id: listing_depth_without_copy_stub
    repair_dimension: listing_or_localization
    must_preserve:
      - search_intent
      - keyword_clusters
      - title
      - bullets_or_key_benefits
      - description
      - attributes_and_specs
      - usage_warning_package_contents
      - faq_objection_handling
      - claim_mapping
      - exact_market_copy
      - chinese_companion
    failure_examples:
      - returning only title plus three bullets
      - removing platform fields while keeping marketing prose
      - translating target-market copy into Chinese instead of preserving publishable copy

  - id: visual_depth_without_prompt_only_substitution
    repair_dimension: visual_or_prompt
    must_preserve:
      - visual_master
      - moodboard_logic
      - palette_hex_and_contrast
      - composition_system
      - photography_lighting_cmf
      - human_scene_prop_logic
      - shot_list
      - per_asset_art_direction
      - production_parameter_closure
    failure_examples:
      - replacing Visual Master with model prompts
      - replacing per-asset Design Cards with one master prompt
      - keeping camera parameters while dropping subject scene evidence typography or culture

  - id: ads_reviews_economics_without_omission
    repair_dimension: full_project_or_visual_focus
    must_preserve:
      - pricing_economics_offer
      - advertising_optimization
      - review_analysis
      - break_even_logic
      - attribution_and_tests
      - review_learning_loop
    failure_examples:
      - omitting economics because the task includes visual assets
      - giving ad copy without economics attribution or landing logic
      - giving review sentiment without responsibility layer and repair route

  - id: content_matrix_without_generic_topics
    repair_dimension: platform_content
    must_preserve:
      - audience_state
      - topic
      - hook
      - script_structure
      - visual_form
      - proof
      - cta
      - metric
      - race_stage
      - culture_check
      - dimensions_duration_cover_subtitle
      - traffic_landing_attribution
      - why
    failure_examples:
      - reducing content matrix to educate_seed_convert
      - generic hooks with no platform or audience logic
      - no culture validation or attribution fields

  - id: language_without_strategy_loss
    repair_dimension: chinese_operator_language
    must_preserve:
      - strategy_depth
      - market_audience_culture_depth
      - pricing_economics_offer
      - visual_photography_depth
      - asset_art_direction_depth
      - prompt_density
    failure_examples:
      - translating by summarizing
      - replacing detailed strategy with short Chinese bullets
      - dropping evidence_tradeoff_execution_measurement

  - id: compliance_without_creative_loss
    repair_dimension: claim_compliance
    must_preserve:
      - creative_authorship
      - dynamic_asset_curation
      - integrated_final_image_generation
      - product_presence_choice
      - video_creator_ads
    failure_examples:
      - turning the agent into a gate/checker
      - globally forcing no text or no product
      - replacing creative decisions with prohibitions

  - id: prompt_cleanliness_without_parameter_loss
    repair_dimension: model_prompt_language_or_cleanliness
    must_preserve:
      - production_parameter_closure
      - people_subject_action_scene_props
      - composition_geometry
      - evidence_and_typography
      - culture_and_localization
      - camera_optical_values
      - lighting_program
      - cmf_material
      - color_management_finishing
      - motion_timing_when_relevant
      - target_market_visible_copy_route
    failure_examples:
      - making EN prompt pure English by deleting selected visual values
      - reducing a production prompt to generic premium_editorial_soft_light prose
      - moving all pixel-changing decisions out of the provider prompt

  - id: ui_without_business_object_loss
    repair_dimension: html_workspace_or_navigation
    must_preserve:
      - nine_domain_depth
      - listing_final_copy
      - pricing_economics
      - visual_master
      - content_matrix
      - race_culture_tables
      - asset_detail_design_cards
      - ads_reviews_evidence
    failure_examples:
      - dashboard cards replacing real payload
      - flattening all project content into one long page
      - hiding business content only in raw JSON inspector

  - id: media_portability_without_source_truth_loss
    repair_dimension: standalone_html_media
    must_preserve:
      - original_sources
      - product_reference_roles
      - source_hashes_and_provenance
      - editable_source_files
      - reference_guided_native_product_fidelity
    failure_examples:
      - embedding a preview but deleting source media
      - using a placeholder preview unrelated to the real source

  - id: full_density_without_fixed_template
    repair_dimension: full_project_completeness
    must_preserve:
      - project_authored_information_architecture
      - dynamic_asset_universe
      - per_asset_visual_mechanism_diversity
      - surface_native_execution
      - agent_creative_authority
    failure_examples:
      - fixed nine pages because nine domains exist
      - fixed seven_or_nine_assets
      - same left_text_right_product layout across assets

  - id: localization_without_foreign_copy_loss
    repair_dimension: chinese_operator_projection
    must_preserve:
      - exact_target_market_listing_copy
      - exact_visible_asset_copy
      - english_semantic_baseline_for_non_english_markets
      - model_prompt_en
    failure_examples:
      - translating publishable Malay Arabic or English copy into Chinese as final copy
      - removing provider English layer

  - id: source_fidelity_without_presence_forcing
    repair_dimension: product_fidelity
    must_preserve:
      - product_presence_is_per_asset
      - truth_reference_only_routes
      - product_absent_assets_when_strategically_stronger
      - reference_guided_native_lock_default_when_visible
    failure_examples:
      - forcing product into every asset
      - forcing exact_pixel_composite globally

  - id: platform_capacity_without_asset_universe_pruning
    repair_dimension: platform_gallery_limits
    must_preserve:
      - test_pool
      - rotation_pool
      - paid_assets
      - creator_assets
      - video_assets
      - pdp_longform_assets
    failure_examples:
      - pruning asset universe to platform maximum gallery count

  - id: validation_without_productization
    repair_dimension: regression_prevention
    must_preserve:
      - agentic_delivery
      - commercial_decision_making
      - human_facing_finished_outputs
    failure_examples:
      - exposing validators as the main UX
      - blocking normal creative choices that the agent should resolve

required_release_evidence:
  - master_construction_contract_loaded
  - business_object_density_contract_loaded
  - prompt_art_direction_contract_loaded
  - mature_capability_ledger_still_required
  - chinese_operator_surface_preserved
  - commercial_density_preserved
  - all_business_domains_preserved
  - prompt_and_art_direction_density_preserved
  - standalone_media_preserved
  - routed_workspace_preserved
  - no_platform_slot_pruning
